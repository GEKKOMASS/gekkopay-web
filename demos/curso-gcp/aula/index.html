window.COURSE=window.COURSE||{},window.COURSE.m2={id:"m2",n:2,lvl:"Intermedio",color:"#7C3AED",hours:16,title:"RAG empresarial y agentes sin código o de bajo código",intro:'En este módulo Nordia pasa de "probar la IA" a tener asistentes que responden con sus propios documentos y agentes que consultan otros sistemas. El participante aprende cuándo usar cada técnica, construye un RAG (generación aumentada con recuperación: la IA responde consultando documentos propios) con RAG Engine, un buscador empresarial con Agent Search, un agente de bajo código en Agent Studio y una primera integración con un sistema externo. Dos laboratorios son sin código (consola) y dos usan Python guiado paso a paso.',outcomes:["Decidir entre grounding con Google Search, RAG, búsqueda empresarial y fine-tuning según el caso.","Crear un corpus en RAG Engine, ajustar el troceado y conectar el corpus a Gemini con citas de la fuente.","Montar un buscador interno con Agent Search sobre documentos en Cloud Storage.","Diseñar, probar e inspeccionar un agente de bajo código en Agent Studio.","Conectar un modelo a un sistema externo mediante llamadas a funciones (function calling)."],prereq:'Módulo 1 aprobado o conocimientos equivalentes. Proyecto de Google Cloud con facturación y presupuesto con alertas. Se usa Python guiado (copiar, ejecutar y modificar valores). Material de práctica: el paquete <a href="Politicas_Nordia.zip" download>"Políticas de Nordia" (5 documentos PDF, descarga ZIP)</a>.',lessons:[{id:"2.1",hours:2,title:"Por qué RAG y cuándo no",sub:"Grounding con Google Search, RAG con datos propios, búsqueda empresarial y fine-tuning: cuál elegir.",objectives:["Explicar por qué un modelo no conoce los datos internos ni los hechos recientes.","Diferenciar grounding con Google Search, RAG, búsqueda empresarial y fine-tuning.","Elegir la técnica adecuada para un caso de negocio y justificar la decisión."],blocks:[{h:"El problema: el modelo no sabe lo que tu empresa sabe",html:'<p>Un modelo como Gemini aprendió de enormes cantidades de texto público hasta una fecha. No conoce las políticas de Nordia, sus precios, sus contratos ni lo que pasó ayer. Si le preguntas, puede responder de forma genérica o, peor, <b>inventar</b> con seguridad (alucinar).</p><p>La solución no es "entrenar más" al modelo cada vez que algo cambia. La solución habitual es <b>anclar</b> (grounding) la respuesta: darle al modelo, en el momento de la pregunta, la información correcta y pedirle que responda solo con ella y que cite la fuente.</p>'},{h:"Cuatro técnicas, cuatro usos",html:'<table class="tbl"><tr><th>Técnica</th><th>Qué hace</th><th>Úsala cuando</th></tr><tr><td><b>Grounding con Google Search</b></td><td>El modelo busca en la web pública antes de responder y devuelve las fuentes</td><td>La respuesta depende de información pública y reciente (noticias, normas publicadas, precios de mercado)</td></tr><tr><td><b>RAG con datos propios</b> (RAG Engine)</td><td>Recupera fragmentos de tus documentos y se los entrega al modelo como contexto</td><td>Debe responder con documentos internos y quieres controlar el troceado, los embeddings y la recuperación</td></tr><tr><td><b>Búsqueda empresarial</b> (Agent Search)</td><td>Un buscador administrado listo para usar sobre sitios, documentos y datos estructurados, con resúmenes generados</td><td>Necesitas un buscador o un sistema de RAG "llave en mano" con poca configuración</td></tr><tr><td><b>Fine-tuning</b> (ajuste fino)</td><td>Reentrena el modelo con ejemplos propios</td><td>Necesitas un estilo, formato o comportamiento muy específico y repetitivo; <b>no</b> para que "sepa" datos que cambian</td></tr></table><div class="tip">💡 Regla práctica: si la información cambia, usa recuperación (RAG o búsqueda). Si lo que quieres cambiar es el <i>comportamiento</i> del modelo, considera fine-tuning. Muchas soluciones reales combinan ambas cosas.</div>'},{h:"Grounding con Google Search en pocas líneas",html:'<p>Con el SDK de Gen AI (kit de desarrollo de Google), basta con agregar la herramienta de búsqueda a la configuración. La respuesta incluye metadatos de grounding con las páginas consultadas, que se deben mostrar al usuario:</p><pre>import os\nfrom google import genai\nfrom google.genai import types\n\nclient = genai.Client()  # usa las variables de entorno del laboratorio\nr = client.models.generate_content(\n    model=os.environ["MODEL_ID"],\n    contents="¿Cuál es la tasa de cambio oficial del dólar hoy en Colombia?",\n    config=types.GenerateContentConfig(\n        tools=[types.Tool(google_search=types.GoogleSearch())]),\n)\nprint(r.text)\nprint(r.candidates[0].grounding_metadata)</pre><p>Este ejemplo se ejecuta en el laboratorio 2.2 (guárdalo como <code>web.py</code>) junto con RAG para comparar ambas técnicas.</p>'},{h:"Lo que RAG no resuelve",html:"<ul><li><b>Documentos malos, respuestas malas:</b> si la política está desactualizada o contradice a otra, el asistente lo reflejará.</li><li><b>Permisos:</b> si el corpus incluye documentos confidenciales, cualquiera que use el asistente podría obtener esa información. Se separan corpus por audiencia o se aplican controles de acceso (Módulo 4).</li><li><b>Preguntas que requieren cálculo o datos en vivo</b> (saldo de vacaciones de una persona): eso se resuelve conectando el agente a un sistema mediante funciones (lección 2.5).</li></ul>"}],interactive:"classify",cases:{title:"¿Qué técnica necesita Nordia?",labels:["Grounding con Google Search","RAG / búsqueda empresarial","Fine-tuning","Llamada a funciones (sistema en vivo)"],items:[["Responder preguntas sobre la política de vacaciones de Nordia.",1,"Información interna que cambia de vez en cuando: recuperación de documentos."],["Contar al equipo comercial qué noticias públicas salieron hoy sobre un cliente.",0,"Información pública y reciente: grounding con Google Search."],["Saber cuántos días de vacaciones le quedan a un empleado específico.",3,"Es un dato vivo de un sistema de RR. HH.: se consulta con una función."],["Lograr que el asistente siempre responda con el formato y el tono exactos de los informes de Nordia, en miles de casos.",2,"Cambiar un comportamiento repetitivo: candidato a fine-tuning, después de agotar el prompt y los ejemplos."],["Responder qué dice la cláusula de renovación del contrato con el proveedor Andes, entre los 300 contratos vigentes.",1,"Pregunta puntual sobre documentos propios: recuperación (RAG o búsqueda empresarial)."]]},glossary:[["Grounding (anclaje)","Basar la respuesta del modelo en fuentes concretas y mostrarlas."],["RAG","Generación aumentada con recuperación: se recuperan fragmentos de documentos y se entregan al modelo como contexto."],["Fine-tuning (ajuste fino)","Reentrenar un modelo con ejemplos propios para cambiar su comportamiento."],["Corpus","Colección de documentos indexados que usa un sistema de RAG."]],quiz:[["La política de viáticos de Nordia cambia cada trimestre. ¿Qué técnica conviene para que el asistente la responda?",["Fine-tuning cada trimestre","RAG o búsqueda empresarial sobre el documento vigente","Grounding con Google Search","Ninguna, el modelo ya la conoce"],1,"Si la información cambia, se recupera en el momento de la pregunta."],["¿Qué devuelve el grounding con Google Search además de la respuesta?",["Un modelo reentrenado","Metadatos con las fuentes web consultadas","Un corpus nuevo","Un archivo PDF"],1,"Las fuentes deben mostrarse al usuario."],["¿Para qué NO sirve el fine-tuning?",["Para ajustar estilo o formato","Para que el modelo conozca datos que cambian con frecuencia","Para especializar un comportamiento repetitivo","Para tareas con muchos ejemplos"],1,"Los datos cambiantes se recuperan, no se entrenan."],["Un empleado pregunta su saldo de vacaciones. ¿Cómo debe obtenerlo el agente?",["Leyendo la política general","Consultando el sistema de RR. HH. mediante una función","Con grounding web","Inventando un estimado"],1,"Es un dato vivo y personal: se consulta en el sistema."]],instructor:{timing:[["Repaso del Módulo 1 y problema de negocio",15],["Por qué el modelo no sabe",15],["Cuatro técnicas",30],["Demo: grounding con Google Search",15],["Actividad: clasificar casos",25],["Límites de RAG y cierre",20]],keys:['La frase del módulo: "si la información cambia, se recupera; no se entrena".',"Mostrar siempre las fuentes: es lo que genera confianza en el usuario final."],errors:['Participantes que creen que RAG "entrena" al modelo: aclarar que el modelo no cambia, solo recibe contexto.',"Confundir RAG con buscar en Google: separar fuentes públicas de fuentes internas."]}},{id:"2.2",hours:4,title:"RAG empresarial con RAG Engine",sub:"Corpus, troceado, embeddings, recuperación y generación con citas.",objectives:["Describir las seis etapas de un flujo RAG y qué decisión se toma en cada una.","Crear un corpus en RAG Engine, importar documentos y ajustar el troceado (chunking).","Validar la recuperación antes de generar y conectar el corpus a Gemini como herramienta."],blocks:[{h:"Las seis etapas de RAG Engine",html:"<ol><li><b>Ingesta:</b> traer los documentos (Cloud Storage, Google Drive o archivos locales).</li><li><b>Transformación:</b> dividir cada documento en fragmentos (chunks).</li><li><b>Embeddings:</b> convertir cada fragmento en un vector, una lista de números que representa su significado; textos parecidos quedan cerca.</li><li><b>Indexación:</b> guardar los vectores en un índice buscable, llamado <b>corpus</b>.</li><li><b>Recuperación:</b> encontrar los fragmentos más relevantes para la pregunta.</li><li><b>Generación:</b> entregar esos fragmentos al modelo para que responda anclado a ellos.</li></ol>"},{h:"Decisiones que cambian la calidad",html:'<table class="tbl"><tr><th>Decisión</th><th>Efecto</th><th>Punto de partida</th></tr><tr><td><b>Tamaño del fragmento</b> (chunk_size)</td><td>Muy pequeño pierde contexto; muy grande mezcla temas y gasta tokens</td><td>512 tokens</td></tr><tr><td><b>Solapamiento</b> (chunk_overlap)</td><td>Evita cortar una idea entre dos fragmentos</td><td>100 tokens</td></tr><tr><td><b>top_k</b></td><td>Cuántos fragmentos se entregan al modelo</td><td>3 a 5</td></tr><tr><td><b>Umbral de distancia</b> (vector_distance_threshold)</td><td>Descarta fragmentos poco parecidos para que el agente diga "no lo sé" en lugar de inventar</td><td>Ajustar con pruebas</td></tr><tr><td><b>Modelo de embeddings</b></td><td>Define qué tan bien se entiende el idioma de los documentos</td><td>Para español, un modelo multilingüe como <code>text-multilingual-embedding-002</code>; <code>text-embedding-005</code> está especializado en inglés y código</td></tr><tr><td><b>Base de datos vectorial</b></td><td>Dónde se guardan los vectores: la administrada por RAG Engine u opciones como Vector Search, Weaviate o Pinecone</td><td>La administrada, para empezar</td></tr></table><div class="tip">💡 No hay valores universales. La forma profesional es armar un conjunto de 20 preguntas con su documento correcto y medir cuántas recuperan la fuente correcta con cada configuración.</div>'},{h:"Regiones, costos y SDK: tres trampas comunes",html:"<ul><li><b>Modo de despliegue y costo:</b> si no se elige un modo, RAG Engine usa por defecto el modo Spanner con el nivel Basic, una instancia fija que genera cobro mientras exista, aunque se borren los corpus. Para aprender, Google recomienda el modo <b>Serverless</b>: la gestión es gratuita y solo se paga la base vectorial según su uso. El modo se cambia en la consola (página RAG Engine → <b>Switch to Serverless</b>).</li><li><b>Regiones:</b> en algunas regiones RAG Engine exige pedir acceso (lista de permitidos) para proyectos nuevos. En noviembre de 2026 la documentación oficial lista <code>europe-west3</code> y <code>europe-west4</code> como disponibles sin ese trámite. Verifica siempre la página de regiones antes de dictar.</li><li><b>SDK:</b> el módulo clásico <code>vertexai.rag</code> está en desuso. El código actual usa el cliente <code>agentplatform</code> (paquete <code>google-cloud-agentplatform</code>) y el SDK de Gen AI para generar. Muchos tutoriales en internet todavía muestran el código viejo.</li></ul>"}],interactive:"rag",lab:{title:"Asistente de políticas de Nordia con RAG Engine",time:"120 min",cost:"Bajo solo si el proyecto usa el modo Serverless (paso 2). En modo Spanner Basic, el predeterminado, hay un cobro fijo mientras la instancia exista. Se cobran además embeddings y consultas al modelo.",steps:[["Subir los documentos",'En la consola abre <b>Cloud Storage</b> → <b>Buckets</b> → <b>Crear</b>. Nombre: <code>nordia-politicas-TUNOMBRE</code> (debe ser único en el mundo), ubicación <b>europe-west4</b>. Sube los 5 PDF del paquete "Políticas de Nordia".'],["Elegir el modo Serverless","En el buscador de la consola escribe <b>RAG Engine</b> y abre la página. Selecciona la región <b>europe-west4</b>. Si aparece la opción <b>Switch to Serverless</b>, haz clic para cambiar el proyecto a modo Serverless. Si no aparece, el proyecto ya está en ese modo. Este paso evita el cobro fijo del modo Spanner."],["Preparar el entorno",'En Cloud Shell (la terminal de Google Cloud en el navegador) crea un entorno virtual (venv: un espacio aislado para las librerías de Python del laboratorio) e instala los kits:<pre>gcloud services enable aiplatform.googleapis.com\npython3 -m venv ~/lab22 && source ~/lab22/bin/activate\npip install "google-cloud-agentplatform>=2.0.1" google-cloud-storage google-genai\nexport GOOGLE_CLOUD_PROJECT=$(gcloud config get-value project)\nexport GOOGLE_CLOUD_LOCATION=global\nexport GOOGLE_GENAI_USE_ENTERPRISE=True\nexport MODEL_ID=gemini-3.8-flash   # verifica que siga vigente\nexport BUCKET=nordia-politicas-TUNOMBRE</pre>'],["Crear el corpus e importar",'Crea <code>corpus.py</code>:<pre>import os, agentplatform\nfrom agentplatform import types\nfrom google.genai import types as gt\n\nclient = agentplatform.Client(project=os.environ["GOOGLE_CLOUD_PROJECT"],\n                              location="europe-west4")\n\nemb = types.RagEmbeddingModelConfig(\n    vertex_prediction_endpoint=types.RagEmbeddingModelConfigVertexPredictionEndpoint(\n        endpoint="publishers/google/models/text-multilingual-embedding-002"))\n\ncorpus = client.rag.create_corpus(rag_corpus=types.RagCorpus(\n    display_name="politicas-nordia",\n    rag_vector_db_config=types.RagVectorDbConfig(rag_embedding_model_config=emb)))\nprint("CORPUS:", corpus.name)\n\nclient.rag.import_files(\n    name=corpus.name,\n    import_config=types.ImportRagFilesConfig(\n        gcs_source=gt.GcsSource(uris=[f"gs://{os.environ[\'BUCKET\']}/*"]),\n        rag_file_transformation_config=types.RagFileTransformationConfig(\n            rag_file_chunking_config=types.RagFileChunkingConfig(\n                chunk_size=512, chunk_overlap=100))))</pre>Ejecuta <code>python corpus.py</code> (puede mostrar un aviso <code>ExperimentalWarning</code>: es normal, indica que el módulo es experimental). La importación termina antes de que el script finalice. Guarda el nombre del corpus: <pre>export CORPUS="projects/.../ragCorpora/..."   # pega el valor impreso</pre>'],["Probar la recuperación",'Antes de generar, verifica qué fragmentos se recuperan. Crea <code>recuperar.py</code>:<pre>import os, sys, agentplatform\nfrom agentplatform import types\nfrom google.genai import types as gt\n\nclient = agentplatform.Client(project=os.environ["GOOGLE_CLOUD_PROJECT"],\n                              location="europe-west4")\ncfg = gt.RagRetrievalConfig(top_k=3,\n      filter=gt.RagRetrievalConfigFilter(vector_distance_threshold=0.5))\nres = client.rag.retrieve_contexts(\n    vertex_rag_store=gt.VertexRagStore(rag_resources=[\n        gt.VertexRagStoreRagResource(rag_corpus=os.environ["CORPUS"])]),\n    query=types.RagQuery(text=sys.argv[1], rag_retrieval_config=cfg))\nprint(res)</pre>Ejecuta <code>python recuperar.py "¿Cuántos días de teletrabajo tengo?"</code> y revisa que aparezca el fragmento de la política de teletrabajo.'],["Generar con citas",'Crea <code>responder.py</code>:<pre>import os, sys\nfrom google import genai\nfrom google.genai import types as gt\n\nrag_tool = gt.Tool(retrieval=gt.Retrieval(vertex_rag_store=gt.VertexRagStore(\n    rag_resources=[gt.VertexRagStoreRagResource(rag_corpus=os.environ["CORPUS"])],\n    rag_retrieval_config=gt.RagRetrievalConfig(top_k=3))))\n\nclient = genai.Client()\nr = client.models.generate_content(\n    model=os.environ["MODEL_ID"], contents=sys.argv[1],\n    config=gt.GenerateContentConfig(\n        system_instruction=("Eres el asistente de RR. HH. de Nordia. Responde solo con "\n            "la información recuperada y menciona el documento fuente. Si no está, "\n            "di que no lo encontraste."),\n        tools=[rag_tool]))\nprint(r.text)\nprint(r.candidates[0].grounding_metadata)  # fragmentos y documentos usados</pre>Prueba con 5 preguntas del banco de pruebas, incluida la que no está en los documentos. Revisa en <code>grounding_metadata</code> qué documento sustenta cada respuesta.'],["Comparar con grounding web",'Guarda el ejemplo de grounding con Google Search de la lección 2.1 como <code>web.py</code> y ejecútalo con la pregunta "¿Cuántos días de teletrabajo tengo en Nordia?". Compara: ¿qué responde sin acceso a los documentos internos?'],["Medir y ajustar","Repite las 10 preguntas del banco de pruebas con <code>chunk_size</code> 64 y 128 (overlap 16 y 32), creando un corpus nuevo para cada valor, y compara con 512. Con 512 cada política queda casi entera en un solo fragmento. Registra en una tabla cuántas respuestas citan el documento correcto. Conclusión esperada: se elige con datos, no a ojo."]],check:"Entregar la tabla de 10 preguntas con la fuente esperada, la fuente obtenida y la configuración usada, más una conclusión de 5 líneas sobre el mejor tamaño de fragmento para estos documentos.",cleanup:"Elimina los corpus de prueba que no usarás desde la página RAG Engine de la consola y conserva el bucket para la lección 2.3. Si por error el proyecto quedó en modo Spanner, pide al instructor el procedimiento para pasarlo a Serverless o desaprovisionarlo (esto último borra los datos de ese modo)."},bank:[["¿Cuántos días de teletrabajo puedo tener por semana?","POL-01 Teletrabajo"],["¿Desde cuándo puedo pedir teletrabajo si soy nuevo?","POL-01 Teletrabajo"],["¿Con cuánta anticipación debo pedir vacaciones?","POL-02 Vacaciones"],["¿Puedo acumular tres periodos de vacaciones?","POL-02 Vacaciones"],["¿En cuántos días debo cargar las facturas de un viaje?","POL-03 Viáticos"],["¿Quién aprueba un viaje internacional?","POL-03 Viáticos"],["Me llegó un correo sospechoso, ¿qué hago?","SEG-01 Seguridad"],["¿Cada cuánto cambio mi contraseña?","SEG-01 Seguridad"],["¿Cada cuánto renuevan los portátiles?","TI-02 Equipos"],["¿Cuál es el horario de la cafetería de la oficina?","Ninguno: el agente debe decir que no lo encontró"]],glossary:[["Chunk (fragmento)","Porción de un documento que se indexa y recupera por separado."],["Embedding","Vector numérico que representa el significado de un texto."],["top_k","Número de fragmentos más relevantes que se recuperan."],["Bucket","Contenedor de archivos en Cloud Storage."]],quiz:[["¿Qué etapa convierte los fragmentos en vectores?",["Ingesta","Embeddings","Generación","Transformación"],1,"Los embeddings representan el significado como números."],["Si la recuperación no trae el fragmento correcto, ¿qué pasará con la respuesta?",["El modelo lo corrige solo","Probablemente será incorrecta o incompleta","No importa, el modelo ya sabe la respuesta","Se usará Google Search automáticamente"],1,"Primero se valida la recuperación y después la generación."],["¿Para qué sirve el umbral de distancia?",["Para acelerar la importación","Para descartar fragmentos poco parecidos y evitar respuestas inventadas","Para cifrar el corpus","Para elegir la región"],1,"Sin fragmentos relevantes, el agente debe decir que no encontró la información."],["¿Cuál es el SDK actual para crear corpus de RAG Engine?",["vertexai.rag","El cliente agentplatform","gcloud ml language","BigQuery ML"],1,"vertexai.rag está en desuso."]],instructor:{timing:[["Seis etapas (pizarra)",25],["Decisiones de calidad con el simulador",35],["Regiones y SDK",10],["Laboratorio",120],["Puesta en común de resultados",30],["Cierre",20]],keys:["Validar recuperación antes de generación.","Decidir parámetros con un conjunto de pruebas, no por intuición."],errors:["Error de región o permiso al crear el corpus: usar una región disponible sin lista de permitidos (ver documentación de regiones).","Importación sin archivos: revisar la ruta gs:// y que los PDF estén en la raíz del bucket.","ImportError de agentplatform: activar el entorno virtual (source ~/lab22/bin/activate) e instalar google-cloud-agentplatform.","ImportError: cannot import name storage: falta instalar google-cloud-storage en el entorno.","Cobro inesperado de Spanner: el proyecto quedó en el modo por defecto; cambiar a Serverless desde la página RAG Engine.","Aviso ExperimentalWarning al ejecutar: es informativo, no es un error."]}},{id:"2.3",hours:3,title:"Búsqueda empresarial lista para usar",sub:"Agent Search (antes Vertex AI Search) sobre documentos, sitios y datos estructurados.",objectives:["Explicar qué ofrece Agent Search frente a construir un RAG propio.","Crear un almacén de datos (data store) desde Cloud Storage y una app de búsqueda.","Evaluar los resultados de búsqueda y los costos de las ediciones y funciones avanzadas."],blocks:[{h:'Agent Search: el RAG "llave en mano"',html:'<p>Agent Search permite crear experiencias de búsqueda de calidad Google sobre sitios web, datos estructurados y no estructurados, y también funciona como sistema RAG listo para usar. A diferencia de RAG Engine, no se configuran a mano el troceado ni los embeddings: se crea un <b>almacén de datos</b> (data store), se conecta a una <b>app</b> y el servicio se encarga del resto.</p><table class="tbl"><tr><th></th><th>RAG Engine</th><th>Agent Search</th></tr><tr><td>Control técnico</td><td>Alto: troceado, embeddings, base vectorial, umbrales</td><td>Medio: configuración administrada</td></tr><tr><td>Tiempo hasta el primer resultado</td><td>Horas</td><td>Minutos</td></tr><tr><td>Ideal para</td><td>Agentes a la medida y equipos técnicos</td><td>Buscadores internos, portales y prototipos rápidos</td></tr></table>'},{h:"Tipos de datos",html:"<ul><li><b>No estructurados:</b> documentos (PDF, HTML, TXT) en Cloud Storage, opcionalmente con metadatos.</li><li><b>Estructurados:</b> datos con esquema, por ejemplo una tabla de BigQuery o archivos JSON.</li><li><b>Sitios web:</b> la búsqueda completa en sitios web requiere activar las funciones Enterprise de la app, con costo adicional.</li><li><b>Conectores de terceros:</b> fuentes como Jira o Salesforce sincronizadas con el almacén de datos.</li></ul>"},{h:"Costos y ediciones",html:"<p>Agent Search cobra por consultas y por funciones avanzadas. Los resúmenes generados con citas y las respuestas extractivas requieren las funciones Enterprise. Antes de un despliegue: estima consultas mensuales, revisa la página oficial de precios y define qué funciones son imprescindibles. En el laboratorio se usan pocos documentos y pocas consultas.</p>"}],interactive:"classify",cases:{title:"¿RAG Engine o Agent Search?",labels:["RAG Engine","Agent Search"],items:[["Un portal de búsqueda para que 400 empleados encuentren procedimientos, listo esta semana.",1,"Tiempo corto y caso estándar de búsqueda: Agent Search."],["Un agente que necesita controlar el tamaño de fragmento y usar una base vectorial que la empresa ya tiene.",0,"Control técnico fino: RAG Engine."],["Buscar en el catálogo de productos (tabla de BigQuery) con filtros por precio.",1,"Datos estructurados con búsqueda administrada: Agent Search."],["Experimentar con distintos modelos de embeddings y medir cuál recupera mejor.",0,"La elección de embeddings es configurable en RAG Engine."]]},lab:{title:"Buscador interno de Nordia con Agent Search",time:"75 min",cost:"Bajo con pocas consultas. Las funciones Enterprise quedan desactivadas, por eso la vista previa muestra resultados de búsqueda sin resúmenes generados.",steps:[["Abrir AI Applications","Necesitas el rol Discovery Engine Admin (si eres propietario del proyecto ya lo tienes). En el buscador superior de la consola escribe <b>AI Applications</b> y abre la página. Si lo solicita, activa la API."],["Crear el almacén de datos","En el menú lateral elige <b>Data Stores</b> (almacenes de datos) → <b>Create data store</b>. Fuente: <b>Cloud Storage</b>. Tipo: <b>documentos no estructurados</b>. Marca <b>Folder</b> (carpeta) y en el campo <code>gs://</code> escribe <code>nordia-politicas-TUNOMBRE</code>. Ubicación: <b>global</b>. Nombre: <code>politicas-nordia-ds</code>. Haz clic en <b>Create</b>. La indexación puede tardar varios minutos."],["Crear la app de búsqueda",'En el menú lateral elige <b>Apps</b> → <b>Create app</b> y elige el tipo de app de búsqueda (en la consola actual la tarjeta puede aparecer como "Site search with AI mode" o como búsqueda personalizada). Conecta el almacén <code>politicas-nordia-ds</code> y deja desactivadas las funciones Enterprise.'],["Probar en la vista previa",'Abre la app y entra a <b>Preview</b>. Busca: "teletrabajo", "¿qué hago con un correo sospechoso?" y "renovación de portátiles". Observa qué documentos devuelve y en qué orden. Sin funciones Enterprise no habrá resumen generado: aquí se evalúa la búsqueda.'],["Comparar con tu RAG","Haz las mismas 5 preguntas que usaste en el laboratorio 2.2. Registra en la tabla si el documento correcto aparece en el primer resultado y cuánto tiempo de configuración tomó cada herramienta. Opcional con el instructor: activar Enterprise por un rato para ver resúmenes, revisando antes el costo."],["Integración (lectura)","En la app, revisa la sección de integración: muestra cómo llamar al buscador por API o insertarlo en un sitio. Anota qué necesitarías para ponerlo en la intranet de Nordia."]],check:"Entregar capturas de la vista previa, la tabla comparativa RAG Engine vs Agent Search y una recomendación de cuál usaría Nordia para su portal interno y por qué.",cleanup:"Si no lo usarás más, elimina la app y el almacén de datos desde AI Applications para evitar cargos."},glossary:[["Data store (almacén de datos)","Contenedor donde Agent Search guarda e indexa los datos de una fuente."],["App (en Agent Search)","La aplicación de búsqueda o recomendaciones que usa uno o más almacenes de datos."],["Datos estructurados","Datos con columnas y tipos definidos, como una tabla."],["Conector","Integración que sincroniza datos de otra aplicación (Jira, Salesforce) con el almacén."]],quiz:[["¿Cuál es la principal ventaja de Agent Search frente a RAG Engine?",["Más control del troceado","Resultados en minutos con configuración administrada","Es gratis","Permite reentrenar Gemini"],1,'Agent Search es la opción "llave en mano".'],["¿Qué se conecta a una app de Agent Search?",["Un corpus de RAG Engine","Uno o más almacenes de datos","Un modelo de BigQuery ML","Un bucket directamente sin almacén"],1,"La app usa almacenes de datos."],["¿Qué funciones pueden generar costo adicional?",["La vista previa","La edición Enterprise y funciones avanzadas","Crear un proyecto","Leer la documentación"],1,"Siempre revisar precios antes de activarlas."],["Nordia necesita un agente con umbrales de similitud ajustados a mano. ¿Qué elige?",["Agent Search","RAG Engine","Gemini Enterprise","Document AI"],1,"El control fino está en RAG Engine."]],instructor:{timing:[["Agent Search vs RAG Engine",30],["Tipos de datos y costos",20],["Actividad de clasificación",15],["Laboratorio",75],["Comparación de resultados",25],["Cierre",15]],keys:['No hay una herramienta "mejor": hay una adecuada al tiempo, al control y al presupuesto.',"Mostrar el costo antes de activar funciones avanzadas."],errors:['La interfaz de AI Applications cambia con frecuencia: guiarse por los nombres "Data Stores" y "Apps" y por el buscador de la consola.',"La búsqueda no devuelve nada: la indexación aún no termina; esperar y recargar.","Ruta del bucket mal escrita: con la opción Folder basta el nombre del bucket.","Falta de permisos: asignar el rol Discovery Engine Admin."]}},{id:"2.4",hours:4,title:"Agentes sin código y de bajo código",sub:"Agent Studio para equipos técnicos y el constructor sin código de Gemini Enterprise para equipos de negocio.",objectives:["Explicar qué es un agente y en qué se diferencia de un chatbot con prompt.","Diseñar, probar e inspeccionar un agente en Agent Studio con instrucciones, conocimiento y herramientas.","Decidir cuándo basta un agente sin código y cuándo pasar a código con ADK."],blocks:[{h:"De chatbot a agente",html:"<p>Un chatbot responde con lo que sabe. Un <b>agente</b> recibe un objetivo, decide qué pasos seguir y usa <b>herramientas</b> (buscar en la web, consultar documentos, llamar a un sistema) para lograrlo. Sus piezas son: <b>instrucciones</b> (qué debe hacer y qué no), <b>modelo</b>, <b>herramientas</b>, <b>conocimiento</b> y, en diseños más complejos, <b>subagentes</b> especializados.</p>"},{h:"Dos caminos sin escribir código",html:'<table class="tbl"><tr><th></th><th>Agent Studio (Agent Platform)</th><th>Constructor sin código de Gemini Enterprise</th></tr><tr><td>Para quién</td><td>Equipos técnicos que prototipan y luego despliegan</td><td>Usuarios de negocio que automatizan su propio trabajo</td></tr><tr><td>Cómo se crea</td><td>Describiendo el agente en lenguaje natural o en un lienzo visual con agente principal y subagentes</td><td>Describiendo la tarea en lenguaje natural dentro de la app de Gemini Enterprise</td></tr><tr><td>Salida</td><td>Se puede obtener el código Python o desplegar el agente</td><td>El agente queda disponible para el equipo dentro de Gemini Enterprise</td></tr><tr><td>Requisito</td><td>Proyecto de Google Cloud con el rol de usuario de Agent Platform</td><td>Licencia de Gemini Enterprise en la organización</td></tr></table><div class="tip">💡 Google ha renombrado varias veces estas herramientas. En la app de Gemini Enterprise el constructor se conoció como Agent Designer y la documentación reciente lo presenta como Workflow Builder; verifica el nombre vigente antes de dictar.</div>'},{h:"Qué se configura en Agent Studio",html:'<ul><li><b>Instrucciones:</b> el comportamiento del agente.</li><li><b>Modelo:</b> el que lo impulsa.</li><li><b>Herramientas:</b> Google Search (búsqueda y grounding) y contexto de URL vienen activadas por defecto; también servidores MCP (protocolo estándar para conectar herramientas) registrados en Agent Registry (el catálogo de agentes y herramientas de Agent Platform).</li><li><b>Conocimiento:</b> hasta 10 archivos PDF o de texto de 2 MB cada uno, en el agente principal, después de guardar.</li><li><b>Subagentes:</b> locales o tomados de Agent Registry.</li></ul><p>La pestaña <b>Preview</b> permite conversar con el agente e inspeccionar cada evento: llamadas a herramientas, solicitud y respuesta, modelo y consumo de tokens. Desde <b>Get code</b> se genera el código Python para continuar el desarrollo.</p><div class="tip">⚠ Al momento de esta edición, el diseño de agentes en Agent Studio está en <b>vista previa</b> (Preview): puede cambiar y tiene soporte limitado. Úsalo para prototipos; para producción, pasa a ADK (Agent Development Kit, el kit de Google para programar agentes; Módulo 3).</div>'},{h:"Instrucciones que funcionan",html:"<p>Una buena instrucción de agente define: rol, objetivo, fuentes permitidas, qué hacer si no sabe, límites (qué nunca hacer) y formato de respuesta. Usa el generador de esta lección para armar la tuya.</p>"}],interactive:"prompter",lab:{title:"Agente de bienvenida para nuevos empleados de Nordia en Agent Studio",time:"90 min",cost:"Bajo: consultas de prueba al modelo.",steps:[["Verificar permisos","Confirma que tu usuario tiene el rol <b>Agent Platform User</b> (<code>roles/aiplatform.user</code>) en el proyecto. Si usas tu propio proyecto como propietario, ya lo tienes."],["Crear el agente",'En la consola abre la página <b>Agents</b> (búscala en el buscador superior) y haz clic en <b>Create agent</b>. Se abre el lienzo de Agent Studio. En el chat describe: <i>"Agente de bienvenida para nuevos empleados de Nordia. Responde dudas sobre políticas internas usando solo los documentos cargados, en tono cercano y profesional, y sugiere a quién escribir cuando no sepa."</i>'],["Guardar y ajustar","Haz clic en <b>Save</b> y ponle nombre: <code>bienvenida-nordia</code>. Abre el panel <b>Details</b> y pega la instrucción que armaste con el generador de esta lección. Revisa el modelo seleccionado."],["Agregar conocimiento",'En <b>Knowledge</b> carga los 5 PDF de "Políticas de Nordia" (máximo 10 archivos de 2 MB).'],["Decidir sobre las herramientas web","Google Search y URL context (lectura de páginas web por dirección) vienen activados por defecto. Para un agente que solo debe usar políticas internas, desactiva ambos y explica en tu bitácora por qué."],["Probar e inspeccionar",'En <b>Preview</b> haz 5 preguntas, incluida una fuera de los documentos ("¿cuál es el mejor restaurante cerca de la oficina?"). Si aparece un diálogo de permisos, elige <b>Grant All</b> (otorgar todos) para dar a la identidad del agente los roles que necesita. Selecciona cada evento y revisa qué herramienta usó y cuántos tokens consumió.'],["Obtener el código","Haz clic en <b>Get code</b> y guarda el <code>agent.py</code> generado: lo usarás como punto de partida en el Módulo 3."]],check:"Entregar la instrucción final, capturas de 2 eventos inspeccionados, la respuesta a la pregunta fuera de alcance y el archivo agent.py generado.",cleanup:"Puedes conservar el agente guardado para el Módulo 3. No lo despliegues todavía. Ojo: los archivos de conocimiento quedan en un bucket del proyecto visible para quien tenga acceso a él; no cargues documentos confidenciales reales en un proyecto de práctica."},glossary:[["Agente","Sistema de IA que persigue un objetivo, decide pasos y usa herramientas."],["Herramienta (tool)","Capacidad que el agente puede invocar: buscar, consultar datos, llamar una API."],["Subagente","Agente especializado al que el agente principal delega una parte del trabajo."],["MCP","Model Context Protocol: estándar abierto para conectar herramientas y datos a modelos de IA."]],quiz:[["¿Qué diferencia a un agente de un chatbot simple?",["Usa un modelo más grande","Decide pasos y usa herramientas para lograr un objetivo","Solo responde en JSON","No necesita instrucciones"],1,"La autonomía y las herramientas definen al agente."],["En Agent Studio, ¿cuándo se puede cargar conocimiento?",["Antes de crear el agente","Después de guardar el agente, en el agente principal","Solo en subagentes","Nunca"],1,"El conocimiento se asocia a un agente ya guardado (con nombre) y solo al agente principal; por eso primero se guarda."],["¿Qué permite ver la pestaña Preview al seleccionar un evento?",["El costo mensual","Las llamadas a herramientas, la solicitud, la respuesta y los tokens","La factura","El código de Google"],1,"Es la base para depurar un agente."],["¿Qué requiere el constructor sin código de Gemini Enterprise?",["Una licencia de Gemini Enterprise","Saber Python","Una cuenta de BigQuery","Un servidor propio"],0,"Es parte de la aplicación de Gemini Enterprise."]],instructor:{timing:[["De chatbot a agente",25],["Dos caminos sin código",25],["Qué se configura y vista previa",20],["Generador de instrucciones",20],["Laboratorio",90],["Demostraciones de los participantes",40],["Cierre",20]],keys:["Agent Studio es para prototipar rápido y luego llevar a código.",'Las instrucciones son el "contrato" del agente: rol, límites y qué hacer si no sabe.'],errors:["No aparece la opción de conocimiento: el agente no se ha guardado.","Bloqueo por política de ubicación de la organización: la configuración del agente se guarda en una región específica; revisar políticas con el administrador.","El agente responde con información web: Google Search sigue activado.","Si nadie tiene licencia de Gemini Enterprise, mostrar el constructor sin código como demostración del instructor."]}},{id:"2.5",hours:3,title:"Integración con sistemas existentes",sub:"Llamadas a funciones, APIs administradas, MCP y webhooks.",objectives:['Explicar cómo un modelo "llama" a un sistema mediante function calling.',"Conectar Gemini a una función que simula el sistema de RR. HH. de Nordia.","Identificar opciones de integración empresarial: Apigee API hub, MCP y webhooks, y sus riesgos."],blocks:[{h:"Cómo funciona una llamada a función",html:'<ol><li>Le describes al modelo las funciones disponibles: nombre, para qué sirve y qué parámetros recibe.</li><li>El usuario pregunta algo que requiere un dato vivo ("¿cuántos días de vacaciones me quedan?").</li><li>El modelo no inventa: responde con una <b>solicitud estructurada</b> para llamar a la función con ciertos parámetros.</li><li>Tu código ejecuta la función contra el sistema real y devuelve el resultado.</li><li>El modelo redacta la respuesta final con ese dato.</li></ol><div class="tip">💡 El modelo nunca ejecuta nada por sí mismo: decide <i>qué</i> llamar; tu código decide si lo ejecuta. Ojo: en el laboratorio el SDK usa la <b>ejecución automática</b>, que corre la función sin pedir aprobación. Para acciones irreversibles se desactiva con <code>automatic_function_calling=types.AutomaticFunctionCallingConfig(disable=True)</code> y tu código revisa la solicitud antes de ejecutarla.</div>'},{h:"Opciones de integración empresarial",html:'<table class="tbl"><tr><th>Opción</th><th>Qué es</th><th>Cuándo</th></tr><tr><td><b>Funciones en código</b></td><td>Funciones de Python que el modelo puede pedir ejecutar</td><td>Prototipos y agentes a la medida</td></tr><tr><td><b>APIs administradas con Apigee</b></td><td>Publicar, asegurar y catalogar las APIs de la empresa (Apigee API hub) para que los agentes las usen con control</td><td>Empresas con muchas APIs y requisitos de gobierno</td></tr><tr><td><b>Servidores MCP</b></td><td>Protocolo estándar para exponer herramientas a cualquier agente compatible; en Agent Platform se registran en Agent Registry</td><td>Herramientas reutilizables entre varios agentes</td></tr><tr><td><b>Webhooks</b></td><td>Avisos automáticos que un sistema envía a una URL cuando ocurre algo (un ticket nuevo, un pago)</td><td>Cuando el agente debe reaccionar a eventos</td></tr></table>'},{h:"Riesgos que hay que controlar",html:"<ul><li><b>Acciones irreversibles:</b> borrar, pagar o enviar correos deben pedir confirmación humana.</li><li><b>Permisos mínimos:</b> la cuenta que usa el agente solo debe poder hacer lo necesario.</li><li><b>Validación:</b> verifica los parámetros que propone el modelo antes de ejecutar.</li><li><b>Inyección de prompt:</b> un texto malicioso podría intentar que el agente llame funciones indebidas; se aborda en el Módulo 4.</li></ul>"}],interactive:"flow",flow:[["👤 Usuario",'"¿Cuántos días de vacaciones me quedan? Mi código es E-1042."'],["🧠 Modelo",'Detecta que necesita un dato vivo y propone: consultar_vacaciones(codigo_empleado="E-1042").'],["🛡 Tu código","Valida el parámetro y los permisos del usuario antes de ejecutar."],["🗄 Sistema de RR. HH.",'Devuelve: {"dias_disponibles": 9, "periodo": "2026"}.'],["🧠 Modelo",'Redacta: "Tienes 9 días de vacaciones disponibles del periodo 2026." Solo usa el dato que devolvió el sistema.'],["✅ Resultado","Dato correcto, trazable y sin inventar."]],lab:{title:'Conectar Gemini al "sistema de RR. HH." de Nordia',time:"75 min",cost:"Muy bajo.",steps:[["Preparar el entorno","En Cloud Shell activa el entorno del laboratorio 2.2 (<code>source ~/lab22/bin/activate</code>) y verifica las variables <code>GOOGLE_CLOUD_PROJECT</code>, <code>GOOGLE_CLOUD_LOCATION</code>, <code>GOOGLE_GENAI_USE_ENTERPRISE</code> y <code>MODEL_ID</code> (repite los <code>export</code> si cerraste la sesión)."],["Crear la función",'Crea <code>rrhh.py</code>. La función simula el sistema de RR. HH.; en producción llamaría a la API real:<pre>import os\nfrom google import genai\nfrom google.genai import types\n\nSALDOS = {"E-1042": 9, "E-2077": 15}\n\ndef consultar_vacaciones(codigo_empleado: str) -> dict:\n    """Devuelve los días de vacaciones disponibles de un empleado de Nordia.\n\n    Args:\n        codigo_empleado: código del empleado, con formato E-0000.\n    """\n    if codigo_empleado not in SALDOS:\n        return {"error": "empleado no encontrado"}\n    return {"dias_disponibles": SALDOS[codigo_empleado], "periodo": "2026"}\n\nclient = genai.Client()\nr = client.models.generate_content(\n    model=os.environ["MODEL_ID"],\n    contents="¿Cuántos días de vacaciones me quedan? Mi código es E-1042.",\n    config=types.GenerateContentConfig(\n        system_instruction="Eres el asistente de RR. HH. de Nordia. Usa las "\n            "herramientas para datos de empleados; nunca inventes saldos.",\n        tools=[consultar_vacaciones]),\n)\nprint(r.text)</pre>Ejecuta <code>python rrhh.py</code>. El SDK ejecuta la función automáticamente cuando el modelo la solicita.'],["Ver la llamada","Agrega al final <code>print(r.automatic_function_calling_history)</code> y vuelve a ejecutar. Identifica en la salida el mensaje donde el modelo pide llamar a la función y el resultado devuelto."],["Probar casos borde",'Cambia la pregunta: código inexistente (E-9999), sin código ("¿cuántos días me quedan?") y una pregunta de política ("¿con cuánta anticipación pido vacaciones?"). Registra qué hace el agente en cada caso.'],["Añadir un control","Modifica la función para que rechace códigos que no cumplan el formato E-0000 y vuelve a probar. Escribe en tu bitácora qué otras validaciones exigirías antes de conectarla a un sistema real."],["Diseño de integración (papel)","Dibuja cómo se conectaría este agente al sistema real de Nordia: ¿función directa, API publicada en Apigee o servidor MCP? ¿Qué webhook usarías para avisar al empleado cuando aprueben su solicitud?"]],check:"Entregar la salida de los 4 casos de prueba, la función con la validación añadida y el diagrama de integración con la justificación de la opción elegida.",cleanup:"Ejecuta <code>deactivate</code>. No quedan recursos con costo."},glossary:[["Function calling (llamada a funciones)","Capacidad del modelo de solicitar la ejecución de una función con parámetros estructurados."],["Apigee API hub","Catálogo centralizado de APIs de la organización, con gobierno y seguridad."],["Webhook","Aviso automático que un sistema envía a una URL cuando ocurre un evento."],["Docstring","Texto de documentación de una función en Python; el SDK lo usa para describirle la función al modelo."]],quiz:[["En function calling, ¿quién ejecuta la función?",["El modelo, dentro de Google","Tu código o el SDK, después de que el modelo la solicita","El usuario final","Nadie, es simulado"],1,"El modelo solo propone; el código ejecuta."],["¿Por qué es importante el docstring de la función?",["Por estética","Porque el SDK lo usa para explicarle al modelo qué hace la función y sus parámetros","Porque reduce el costo a cero","Porque cifra los datos"],1,"Una descripción clara mejora cuándo y cómo se llama la función."],["¿Qué acciones deben pedir confirmación humana?",["Consultar un saldo","Acciones irreversibles como pagar o borrar","Saludar","Resumir un texto"],1,"Control humano en acciones con impacto."],["¿Qué es un webhook?",["Un modelo de embeddings","Un aviso automático que un sistema envía a una URL cuando ocurre algo","Un tipo de corpus","Una región de Google Cloud"],1,"Permite que el agente reaccione a eventos."]],instructor:{timing:[["Cómo funciona una llamada a función (diagrama)",25],["Opciones de integración",25],["Riesgos",15],["Laboratorio",75],["Evaluación del módulo",20],["Cierre y reto",20]],keys:["El modelo propone, el código dispone.","Diseñar la integración pensando en permisos y auditoría desde el inicio."],errors:["La función no se llama: revisar que el docstring y los tipos de parámetros estén completos.","Variables de entorno perdidas: repetir los export.","automatic_function_calling_history vacío: el modelo respondió sin usar la función; reformular la pregunta o reforzar la instrucción."]}}],exam:[["La lista de precios de Nordia cambia cada mes. ¿Qué técnica permite que el asistente la responda bien?",["Fine-tuning mensual","Recuperación (RAG o búsqueda empresarial)","Subir la temperatura","Grounding con Google Search"],1],["¿Qué técnica conviene para responder sobre noticias públicas de hoy?",["Grounding con Google Search","RAG Engine","Fine-tuning","BigQuery ML"],0],["¿Qué es un corpus en RAG Engine?",["Un modelo entrenado","El índice buscable de fragmentos de documentos","Una región","Un tipo de API"],1],["¿Qué parámetro define cuántos fragmentos se entregan al modelo?",["chunk_overlap","top_k","max_output_tokens","display_name"],1],["Un fragmento demasiado grande tiende a…",["Mezclar temas y gastar más tokens","Mejorar siempre la precisión","Reducir el costo","Eliminar las alucinaciones"],0],["¿Qué se debe validar antes de conectar el corpus a la generación?",["La factura","Que la recuperación traiga los fragmentos correctos","La temperatura","El nombre del bucket"],1],['¿Qué opción es "llave en mano" para buscadores internos?',["Agent Search","RAG Engine","Model Garden","Cloud Shell"],0],["En Agent Search, una app usa…",["Uno o más almacenes de datos","Un corpus de RAG Engine","Un modelo de BigQuery ML","Una función de Python"],0],["¿Para qué sirve la pestaña Preview de Agent Studio?",["Para pagar","Para conversar con el agente e inspeccionar herramientas, solicitudes y tokens","Para crear buckets","Para entrenar embeddings"],1],["Un agente de políticas internas tiene Google Search activado y responde con información web. ¿Qué haces?",["Subir la temperatura","Desactivar Google Search y reforzar las instrucciones","Agregar más subagentes","Nada, es correcto"],1],["¿Qué requiere el constructor sin código de Gemini Enterprise?",["Licencia de Gemini Enterprise","Saber Python","Una base vectorial propia","Un clúster de GKE (servicio de Kubernetes de Google)"],0],["En function calling, el modelo…",["Ejecuta la función en tu servidor","Propone la llamada con parámetros y el código la ejecuta","Reescribe la función","Desactiva la seguridad"],1],["¿Qué acción debería requerir confirmación humana?",["Consultar una política","Aprobar un pago","Contar tokens","Buscar un documento"],1],["¿Qué estándar permite exponer herramientas reutilizables a distintos agentes?",["MCP","JSON","SQL","PDF"],0],["¿Cuál es el SDK recomendado actualmente para crear corpus de RAG Engine?",["vertexai.rag","agentplatform","gcloud ml","BigQuery"],1]],rubric:"Rúbrica del reto: asignación correcta de técnica a cada tipo de pregunta (30 %), fuentes y permisos (20 %), plan de medición de calidad (25 %), controles humanos y de seguridad (25 %).",guide:{before:['Entregar a cada participante el paquete "Políticas de Nordia" (5 PDF).',"Verificar en la documentación oficial las regiones disponibles de RAG Engine sin lista de permitidos y actualizar el laboratorio 2.2 si cambiaron.","Confirmar que el modelo indicado en MODEL_ID sigue vigente.","Probar el día anterior los cuatro laboratorios; la indexación de Agent Search puede tardar varios minutos.","Verificar en la página RAG Engine que el proyecto de cada participante esté en modo Serverless antes del laboratorio 2.2.","Si la organización no tiene licencia de Gemini Enterprise, preparar la demostración del constructor sin código desde una cuenta del instructor o con capturas.","Planear pausas de 10 minutos cada 90 minutos."],cost:["RAG Engine: usar el modo Serverless; en modo Spanner (predeterminado) el nivel Basic tiene cobro fijo mientras exista, aunque se borren los corpus. Eliminar los corpus de prueba al terminar.","Agent Search: no activar la edición Enterprise ni funciones avanzadas en clase salvo que se presupueste.","Agent Studio y function calling: costo por consultas al modelo, bajo en uso de práctica.","Mantener el presupuesto de USD 20 por participante con alertas."]},challenge:"Reto del módulo: diseña el asistente interno de Nordia de punta a punta. Indica qué preguntas responderá con RAG, cuáles con búsqueda empresarial y cuáles con funciones conectadas a sistemas; qué fuentes y permisos usará; cómo medirás la calidad (conjunto de 20 preguntas) y qué acciones requerirán confirmación humana. Entrega un diagrama y una página de justificación."};
</script>

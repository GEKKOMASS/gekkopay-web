<style>
:root{--bg:#F6F7FB;--ink:#0F172A;--mu:#5B6475;--ln:#E3E7EF;--card:#fff;--b1:#2563EB;--b2:#7C3AED;--g1:#059669;--y1:#D97706;--r1:#DC2626;--dk:#0B1220;--disp:'Space Grotesk',system-ui,sans-serif;--sans:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;font-size:15.5px}
button,input{font:inherit}button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--disp);letter-spacing:-.01em}
.top{position:sticky;top:0;z-index:30;background:var(--dk);color:#fff;height:58px;display:flex;align-items:center;gap:12px;padding:0 16px}
.top .lg{font-family:var(--disp);font-weight:700;display:flex;gap:9px;align-items:center;font-size:16px;text-decoration:none;color:#fff}
.top .lg i{font-style:normal;width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--b1),var(--b2));display:grid;place-items:center;font-size:13px}
.prog{flex:1;max-width:260px;margin-left:auto;font-size:12px;color:#A9B4C7}
.prog .bar{height:6px;background:#1E293B;border-radius:99px;overflow:hidden;margin-top:4px}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#60A5FA,#C4B5FD);transition:.4s}
.ins{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#C7D2E3;white-space:nowrap}
.ins input{accent-color:#A78BFA}
.menu{display:none;background:none;border:0;color:#fff;font-size:22px}
.lay{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 58px)}
aside{background:#fff;border-right:1px solid var(--ln);padding:16px 12px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
aside h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:14px 8px 6px;font-family:var(--sans)}
aside a{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.35}
aside a:hover{background:#F1F5F9}
aside a.on{background:#EEF2FF;color:#3730A3;font-weight:600}
aside a .ck{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #CBD5E1;margin-top:1px;display:grid;place-items:center;font-size:10px;color:#fff}
aside a.done .ck{background:var(--g1);border-color:var(--g1)}
aside a.lock{color:#94A3B8;cursor:default}
aside a.lock:hover{background:none}
@media(max-width:900px){.lay{grid-template-columns:minmax(0,1fr)}.top .lg span{font-size:14px}aside{position:fixed;left:0;top:58px;width:290px;z-index:25;transform:translateX(-100%);transition:.25s;box-shadow:10px 0 30px rgba(0,0,0,.15)}aside.open{transform:none}.menu{display:block}.prog{display:none}}
main{min-width:0;padding:28px clamp(16px,4vw,48px) 80px;max-width:940px;width:100%}
.crumb{font-size:12.5px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
h1{font-size:clamp(26px,3.4vw,36px);line-height:1.15;margin:6px 0 8px}
.sub{color:var(--mu);font-size:16.5px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.chip{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:#fff;border:1px solid var(--ln)}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:20px;margin-top:16px}
.card h2{font-size:21px;margin-bottom:8px}
.card h3{font-size:18px;margin:4px 0 8px}
.card p{margin:8px 0}
.card ul,.card ol{padding-left:22px;margin:8px 0}
.card li{margin:5px 0}
.obj{background:#F8FAFC}
.tip{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14.5px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0;display:block;overflow-x:auto}
.tbl th,.tbl td{border-bottom:1px solid var(--ln);padding:9px 10px;text-align:left;vertical-align:top}
.tbl th{background:#F8FAFC;color:var(--mu);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
pre{background:#0B1220;color:#E2E8F0;border-radius:12px;padding:14px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;margin:10px 0;position:relative;white-space:pre}
code{overflow-wrap:anywhere;font-family:var(--mono);font-size:.9em;background:#F1F5F9;border-radius:5px;padding:1px 5px}
pre code{background:none;padding:0}
.cp{position:absolute;right:8px;top:8px;background:#1E293B;color:#CBD5E1;border:0;border-radius:7px;padding:4px 9px;font-size:11.5px}
.lab{border-left:4px solid var(--g1)}
.lab .lmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.step{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}
.step:first-of-type{border-top:0}
.step input{width:20px;height:20px;accent-color:var(--g1);flex:none;margin-top:3px}
.step>div{min-width:0;flex:1}
.step.ok b{text-decoration:line-through;color:var(--mu)}
.instr{border-left:4px solid var(--b2);background:#FAF5FF;display:none}
body.inst .instr{display:block}
.q{margin:14px 0}
.q b{display:block;margin-bottom:8px}
.q label{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--ln);border-radius:10px;padding:9px 11px;margin-bottom:6px;cursor:pointer;font-size:14.5px;background:#fff}
.q label.ok{border-color:var(--g1);background:#ECFDF5}.q label.bad{border-color:var(--r1);background:#FEF2F2}
.q .why{display:none;font-size:13.5px;color:var(--mu);margin-top:4px}
.q.done .why{display:block}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--b1);color:#fff;text-decoration:none}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--ln)}
.btn.g{background:var(--g1)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.score{font-family:var(--disp);font-size:20px;margin-left:10px}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.gl{grid-template-columns:1fr}}
.gl div{background:#F8FAFC;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font-size:14px}
.gl b{display:block}
/* interactives */
.ia{border:2px dashed #C7D2FE;background:#FCFCFF}
.case{border:1px solid var(--ln);border-radius:12px;padding:12px;margin:8px 0;background:#fff}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.opts button{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:6px 12px;font-size:13.5px}
.opts button.ok{background:#ECFDF5;border-color:var(--g1);color:#065F46}
.opts button.bad{background:#FEF2F2;border-color:var(--r1);color:#991B1B}
.fb{font-size:13.5px;color:var(--mu);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.grid2>*{min-width:0}
.fld{margin:8px 0}
.fld label{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:4px}
.fld input[type=number]{width:100%;border:1px solid var(--ln);border-radius:10px;padding:9px 11px}
.fld input[type=range]{width:100%;accent-color:var(--b1)}
.out{background:var(--dk);color:#E2E8F0;border-radius:14px;padding:16px}
.out b.big{display:block;font-family:var(--disp);font-size:34px;color:#fff}
.out .r{display:flex;justify-content:space-between;border-top:1px solid #1E293B;padding:7px 0;font-size:14px}
.mx{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;font-size:13px;align-items:center}
.mx .c{border-radius:10px;padding:10px;text-align:center;font-weight:700}
.cert{text-align:center;border:3px double #C4B5FD;border-radius:18px;padding:26px;background:linear-gradient(180deg,#fff,#F5F3FF)}
.cert h2{font-size:26px}
.hero{background:radial-gradient(700px 300px at 90% -20%,rgba(124,58,237,.3),transparent 60%),var(--dk);color:#fff;border-radius:18px;padding:26px}
.hero h1{color:#fff}
.hero p{color:#B8C2D6}
.wm{position:fixed;right:12px;bottom:12px;background:rgba(11,18,32,.92);color:#C4B5FD;font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;z-index:60;pointer-events:none;letter-spacing:.04em}
.foot{font-size:12px;color:var(--mu);margin-top:40px;border-top:1px solid var(--ln);padding-top:14px}
</style>

<script>
/*! © GEKKOMASS · Programa IA & Agentes en Google Cloud · Prohibida su reproducción */window.COURSE={m1:{id:"m1",n:1,lvl:"Básico",color:"#2563EB",hours:12,title:"Fundamentos y exploración de modelos",intro:"Este módulo construye el vocabulario y el criterio que se usarán en todo el programa. Al terminarlo, el participante sabe distinguir los tipos de IA, ubicar cada servicio de Google Cloud en el mapa, escribir prompts controlando costo y calidad, y entiende cómo nace, se evalúa y se usa un modelo de machine learning.",outcomes:["Explicar con ejemplos la diferencia entre IA, machine learning, deep learning e IA generativa.","Elegir el servicio de IA de Google Cloud adecuado para un caso de negocio y justificar la elección.","Escribir prompts con instrucciones del sistema, ajustar parámetros y estimar el costo por consulta.","Entrenar, evaluar y usar un modelo de clasificación con BigQuery ML usando solo SQL."],prereq:"No requiere experiencia en programación: en el laboratorio 1.3 se copia y ejecuta código Python guiado paso a paso. Se recomienda SQL básico (el lenguaje para consultar bases de datos) para el laboratorio 1.4. Cada participante necesita una cuenta de Google Cloud con facturación activa; las cuentas nuevas suelen recibir un crédito de prueba (verificar condiciones vigentes en cloud.google.com/free).",lessons:[{id:"1.1",hours:2,title:"IA, machine learning e IA generativa",sub:"Conceptos sin humo, casos reales y límites de cada enfoque.",objectives:["Definir IA, machine learning (ML), deep learning e IA generativa y cómo se relacionan.","Reconocer qué tipo de solución necesita un problema de negocio.","Identificar los límites y riesgos de cada enfoque, incluidas las alucinaciones."],blocks:[{h:"Cuatro términos que se usan mal",html:'<p>En las empresas se dice "IA" para todo, y esa confusión cuesta dinero: se compran soluciones complejas para problemas simples o se espera magia de herramientas que no la tienen. Ordenemos los términos de afuera hacia adentro:</p><ul><li><b>Inteligencia artificial (IA):</b> el campo amplio de crear sistemas que realizan tareas que normalmente requieren inteligencia humana: reconocer, decidir, predecir, conversar.</li><li><b>Machine learning (aprendizaje automático, ML):</b> una forma de lograr IA en la que el sistema <i>aprende patrones a partir de datos</i> en lugar de seguir reglas escritas a mano.</li><li><b>Deep learning (aprendizaje profundo):</b> un tipo de ML que usa redes neuronales de muchas capas. Es lo que permitió los grandes avances en visión, voz y lenguaje.</li><li><b>IA generativa:</b> modelos de deep learning entrenados con enormes cantidades de datos que <i>crean contenido nuevo</i>: texto, código, imágenes, audio. Gemini es un ejemplo.</li></ul><div class="tip">💡 Regla práctica: toda IA generativa es ML, pero no todo ML es IA generativa. Predecir si un cliente pagará su factura es ML clásico; redactarle un mensaje de cobro es IA generativa.</div>'},{h:"Cómo aprende un modelo, en pocas palabras",html:'<p>Un modelo de ML es una función que recibe <b>características</b> (features: los datos de entrada, por ejemplo país, dispositivo y páginas vistas) y produce una <b>predicción</b> (por ejemplo: "comprará" o "no comprará").</p><p>Durante el <b>entrenamiento</b> el modelo ve miles de ejemplos donde ya se conoce la respuesta correcta, llamada <b>etiqueta</b> (label). Ajusta sus parámetros internos para equivocarse lo menos posible. Luego se <b>evalúa</b> con ejemplos que nunca vio, para saber si realmente aprendió o solo memorizó.</p><p>Los modelos generativos funcionan con la misma lógica a otra escala: aprenden a predecir el siguiente fragmento de texto (token) con base en todo lo anterior. Por eso escriben con fluidez, y también por eso pueden "inventar" con total seguridad algo que suena correcto pero no lo es.</p>'},{h:"Tres familias de problemas de negocio",html:'<table class="tbl"><tr><th>Familia</th><th>Pregunta típica</th><th>Ejemplo</th><th>Enfoque habitual</th></tr><tr><td>Predecir</td><td>¿Qué va a pasar?</td><td>¿Este cliente cancelará su plan?</td><td>ML clásico con datos históricos</td></tr><tr><td>Percibir</td><td>¿Qué hay aquí?</td><td>Leer una factura escaneada, transcribir una llamada</td><td>APIs preentrenadas (servicios listos que un programa puede usar: visión, voz, documentos)</td></tr><tr><td>Generar y conversar</td><td>¿Puedes crear o responder esto?</td><td>Resumir contratos, responder preguntas de empleados</td><td>IA generativa, normalmente con RAG (que la IA responda consultando documentos propios) o agentes (IA que además ejecuta acciones)</td></tr></table>'},{h:"Límites que hay que decir en voz alta",html:'<ul><li><b>Alucinaciones:</b> un modelo generativo puede producir datos falsos con tono convincente. Se mitiga anclando las respuestas a fuentes confiables, técnica llamada grounding, y con RAG (Módulo 2) y diseñando el agente para decir "no lo sé".</li><li><b>Datos sesgados o pobres:</b> un modelo aprende lo que hay en los datos, incluidos sus errores y sesgos.</li><li><b>Costo y latencia (tiempo de respuesta):</b> cada consulta a un modelo grande cuesta y tarda. Elegir el modelo más pequeño que cumpla el objetivo es una decisión de negocio.</li><li><b>Privacidad y cumplimiento:</b> qué datos se envían al modelo, dónde se procesan y quién puede verlos (Módulo 4).</li></ul>'},{h:"Caso continuo: Nordia",html:'<p>Durante todo el programa trabajaremos con <b>Nordia</b>, una empresa ficticia de servicios con 400 empleados. Su gerencia quiere "usar IA". Al final de este módulo el participante podrá traducir ese deseo en tres iniciativas concretas: un modelo que prediga qué clientes están en riesgo de irse, una API que lea las facturas de proveedores y un asistente interno que responda preguntas sobre políticas. Cada una usa un enfoque distinto.</p>'}],interactive:"classify",cases:{title:"¿Qué enfoque necesita Nordia?",labels:["ML clásico","API preentrenada","IA generativa"],items:[["Predecir qué clientes cancelarán su plan el próximo trimestre.",0,"Predicción con datos históricos y etiqueta clara: ML clásico."],["Transcribir a texto las llamadas del centro de soporte.",1,"Existe una API especializada (Speech-to-Text)."],["Redactar respuestas a correos de clientes con el tono de la marca.",2,"Generar texto nuevo: IA generativa."],["Leer facturas escaneadas y extraer el total.",1,"Document AI resuelve esta tarea sin entrenar nada."],["Estimar la demanda de la próxima semana por sucursal.",0,"Pronóstico con series de tiempo: ML clásico."],["Responder preguntas de empleados sobre políticas internas.",2,"IA generativa anclada a documentos (RAG, Módulo 2)."]]},glossary:[["Feature (característica)","Dato de entrada que usa el modelo para predecir."],["Label (etiqueta)","La respuesta correcta conocida en los datos de entrenamiento."],["Token","Fragmento de texto (aprox. una palabra corta o parte de una palabra) con el que trabajan y cobran los modelos de lenguaje."],["Alucinación","Respuesta inventada por un modelo generativo que parece correcta pero no lo es."]],quiz:[["Una empresa quiere saber qué clientes probablemente dejarán de pagar el próximo mes. ¿Qué enfoque es el más adecuado para empezar?",["IA generativa","ML clásico con datos históricos de pagos","Una API de visión"],1,"Es un problema de predicción con datos históricos y una etiqueta clara (pagó / no pagó)."],["¿Cuál afirmación es correcta?",["Todo ML es IA generativa","Toda IA generativa es una forma de ML","Deep learning no usa datos"],1,"La IA generativa usa deep learning, que es un tipo de ML."],["¿Qué es una alucinación?",["Un error de conexión","Una respuesta inventada con apariencia de verdad","Un modelo que tarda en responder"],1,"Se mitiga anclando el modelo a fuentes confiables."],['En un modelo que predice compras, "páginas vistas" es…',["Una etiqueta","Una característica (feature)","Un token"],1,"Es un dato de entrada; la etiqueta sería si compró o no."]]},{id:"1.2",hours:3,title:"Mapa de servicios de IA en Google Cloud",sub:"Agent Platform (antes Vertex AI), Model Garden, Gemini Enterprise y APIs preentrenadas.",objectives:["Ubicar los principales servicios de IA de Google Cloud y para quién está pensado cada uno.","Usar Model Garden para descubrir, comparar y probar modelos.","Probar una API preentrenada desde Cloud Shell."],blocks:[{h:"Primero, los nombres (cambian seguido)",html:'<p>En Google Cloud Next \'26 (abril de 2026) Google reorganizó su oferta de IA. Vertex AI pasó a llamarse <b>Gemini Enterprise Agent Platform</b> (en este curso, "Agent Platform"); Vertex AI Studio pasó a ser <b>Agent Studio</b>; Agent Engine pasó a ser <b>Agent Runtime</b>; y Vertex AI Search pasó a ser <b>Agent Search</b>. Antes, en octubre de 2025, Agentspace se había integrado en <b>Gemini Enterprise</b>.</p><div class="tip">💡 Mucha documentación, cursos y respuestas en foros siguen usando los nombres anteriores. Saber la equivalencia ahorra horas de búsqueda. Siempre verifica en la documentación oficial antes de un despliegue.</div>'},{h:"El mapa en cuatro capas",html:'<table class="tbl"><tr><th>Capa</th><th>Servicios</th><th>Para quién</th></tr><tr><td><b>1. APIs preentrenadas</b></td><td>Vision, Speech-to-Text, Text-to-Speech, Translation, Natural Language, Document AI</td><td>Desarrolladores que necesitan una capacidad concreta sin entrenar nada</td></tr><tr><td><b>2. Modelos fundacionales</b></td><td>Gemini y otros modelos (de Google, abiertos y de terceros) disponibles en Model Garden</td><td>Equipos que construyen aplicaciones con IA generativa</td></tr><tr><td><b>3. Plataforma para construir</b></td><td>Agent Platform: Agent Studio, RAG Engine, Agent Search, ADK (kit para programar agentes), Agent Runtime, evaluación y MLOps (prácticas para operar modelos en producción)</td><td>Equipos técnicos que llevan soluciones a producción</td></tr><tr><td><b>4. Aplicación para empleados</b></td><td>Gemini Enterprise: asistente, búsqueda empresarial y agentes sin código</td><td>Usuarios de negocio</td></tr></table><p>Además, <b>BigQuery ML</b> permite entrenar y usar modelos de ML directamente con SQL sobre los datos del almacén de datos, sin moverlos.</p>'},{h:"Model Garden: el catálogo de modelos",html:"<p>Model Garden es el catálogo donde se descubren los modelos disponibles. Cada modelo tiene una <b>ficha</b> (model card) con sus capacidades, tamaño de contexto, regiones, precios y restricciones de uso. Desde allí se puede probar el modelo en Agent Studio o consultar el código para llamarlo por API (interfaz que permite que un programa use el servicio).</p><p>Criterios para comparar modelos: <b>calidad</b> en tu tarea (no en benchmarks, que son pruebas genéricas de comparación), <b>latencia</b> (tiempo de respuesta), <b>costo por token</b>, <b>ventana de contexto</b> (cuánto texto acepta), <b>multimodalidad</b> (texto, imagen, audio, video) y <b>disponibilidad regional</b>.</p>"},{h:"Árbol de decisión rápido",html:"<ol><li>¿Existe una API preentrenada que haga exactamente la tarea (traducir, transcribir, leer facturas)? → Úsala primero: es la opción más rápida y predecible.</li><li>¿La tarea es predecir con tus datos tabulares (en tablas)? → BigQuery ML o AutoML (servicio que entrena modelos automáticamente con tus datos).</li><li>¿Debe responder con documentos de la empresa? → Modelo Gemini con RAG (Módulo 2).</li><li>¿Debe ejecutar acciones en otros sistemas, como un CRM (sistema de gestión de clientes)? → Construir un agente (Módulos 2 y 3).</li><li>¿Solo hay que generar, resumir o clasificar texto? → Modelo Gemini vía Agent Platform con un buen prompt (lección 1.3).</li></ol>"}],interactive:"decide",lab:{title:"Explorar Model Garden y probar una API preentrenada",time:"60 min",cost:"Muy bajo (centavos de dólar con uso de práctica).",steps:[["Preparar el proyecto","En la consola de Google Cloud, crea un proyecto nuevo llamado <code>curso-ia-TUNOMBRE</code> y verifica que tenga una cuenta de facturación asociada. Luego, en <b>Facturación → Presupuestos y alertas</b>, crea un presupuesto de USD 20 con alertas al 50 %, 90 % y 100 %."],["Abrir Model Garden","En el buscador superior de la consola escribe <b>Model Garden</b> y abre el resultado. Si es la primera vez, acepta habilitar la API que solicita."],["Leer una ficha de modelo","Abre la ficha de un modelo Gemini reciente. Anota en tu bitácora: ventana de contexto, tipos de entrada que acepta, regiones disponibles y dónde se consultan los precios."],["Comparar dos modelos",'Prueba el mismo prompt en dos modelos disponibles (por ejemplo, una versión "Flash" y una "Flash-Lite") desde Agent Studio: <i>"Resume en 3 viñetas la política de vacaciones: 15 días hábiles por año, solicitud con 15 días de anticipación, máximo dos periodos acumulados."</i> Compara calidad y tiempo de respuesta.'],["Probar una API preentrenada",'Abre <b>Cloud Shell</b> (la terminal de comandos que Google Cloud abre en el navegador; ícono de terminal arriba a la derecha) y ejecuta:<pre>gcloud services enable language.googleapis.com\ngcloud ml language analyze-sentiment \\\n  --content="El soporte de Nordia resolvió mi problema rapidísimo, excelente servicio."</pre>Observa el puntaje (score) y la magnitud del sentimiento. Repite con una frase negativa.'],["Conclusión","En tu bitácora, responde: ¿para qué casos de Nordia usarías la API de lenguaje y para cuáles un modelo Gemini? Justifica con costo, control y calidad."]],check:"El participante entrega su bitácora con la ficha de un modelo, la comparación de dos modelos y el resultado del análisis de sentimiento.",cleanup:"No se crean recursos con costo fijo. Mantén el proyecto para los siguientes laboratorios."},glossary:[["Model Garden","Catálogo de modelos de Google Cloud con fichas, pruebas y código de ejemplo."],["Agent Studio","Diseñador visual de bajo código para probar prompts y agentes (antes Vertex AI Studio)."],["Ventana de contexto","Cantidad máxima de tokens que un modelo puede recibir en una sola consulta."],["API preentrenada","Servicio listo para usar que realiza una tarea concreta sin entrenamiento propio."]],quiz:[["Nordia necesita extraer automáticamente proveedor, fecha y total de facturas escaneadas. ¿Por dónde empezar?",["Entrenar un modelo propio desde cero","Document AI, una API preentrenada para documentos","Gemini Enterprise"],1,"Si existe una API especializada para la tarea, suele ser la opción más rápida y predecible."],["¿Dónde se comparan fichas de modelos, precios y capacidades?",["Model Garden","Cloud Storage","IAM"],0,"Model Garden es el catálogo de modelos."],["¿Cuál es el nombre actual de Vertex AI?",["Gemini Enterprise Agent Platform","Agent Search","Model Armor"],0,"Cambio anunciado en Google Cloud Next '26."],["Gemini Enterprise está pensado principalmente para…",["Entrenar modelos tabulares","Usuarios de negocio que usan asistentes, búsqueda y agentes sin código","Administrar redes"],1,"Es la aplicación orientada a empleados."]]},{id:"1.3",hours:3,title:"Prompts, parámetros y costos",sub:"Instrucciones del sistema, temperatura, tokens y cómo estimar el costo por consulta.",objectives:["Escribir prompts estructurados con instrucciones del sistema, contexto, tarea y formato de salida.","Ajustar temperatura y límite de tokens según el tipo de tarea.","Contar tokens y estimar el costo mensual de un caso de uso."],blocks:[{h:"Anatomía de un buen prompt",html:'<p>Un prompt profesional tiene cuatro partes. Separarlas mejora la calidad y facilita mantenerlo:</p><ol><li><b>Instrucción del sistema</b> (system instruction): el rol y las reglas permanentes. <i>"Eres el asistente de RR. HH. de Nordia. Respondes solo con base en las políticas entregadas. Si no sabes, lo dices."</i></li><li><b>Contexto:</b> la información que el modelo necesita (una política, un correo, datos).</li><li><b>Tarea:</b> qué hacer, en una frase clara con un verbo.</li><li><b>Formato de salida:</b> cómo quieres la respuesta (viñetas, tabla, JSON con campos definidos).</li></ol><div class="tip">💡 Dar 1 a 3 ejemplos de entrada y salida esperada (few-shot) suele mejorar mucho la consistencia en tareas de extracción y clasificación.</div>'},{h:"Parámetros que sí importan",html:'<table class="tbl"><tr><th>Parámetro</th><th>Qué controla</th><th>Recomendación</th></tr><tr><td><b>Temperatura</b></td><td>Cuánta variación tiene la respuesta</td><td><b>Con Gemini 3 y posteriores:</b> Google recomienda no modificarla; en modelos recientes como gemini-3.8-flash la documentación indica que el servicio ignora la temperatura, top_p y top_k. La consistencia se logra con instrucciones claras, un esquema de salida y el nivel de razonamiento. <b>Con otros modelos:</b> baja para extraer o clasificar, más alta para lluvia de ideas.</td></tr><tr><td><b>Nivel de razonamiento</b> (thinking_level)</td><td>Cuánto "piensa" el modelo antes de responder</td><td>En gemini-3.8-flash el valor por defecto es medio (MEDIUM); se puede usar bajo (LOW) para tareas simples, más rápido y barato, o alto (HIGH) para problemas complejos. Los tokens de razonamiento se cobran como salida.</td></tr><tr><td><b>Esquema de salida</b> (response_schema)</td><td>Obliga a responder en un formato JSON exacto</td><td>Úsalo siempre que la respuesta la vaya a leer otro sistema.</td></tr><tr><td><b>Máximo de tokens de salida</b></td><td>Largo máximo de la respuesta</td><td>Limítalo para controlar el costo, pero deja margen: en modelos que razonan, el razonamiento también consume este límite y una cifra muy baja deja la respuesta cortada o vacía.</td></tr><tr><td><b>Top-p / Top-k</b></td><td>Entre cuántas opciones de palabra elige el modelo</td><td>Se dejan por defecto; en modelos Gemini recientes no tienen efecto.</td></tr></table>'},{h:"Tokens y costo: la cuenta que nadie hace",html:'<p>Los modelos cobran por <b>tokens de entrada</b> (lo que envías: instrucciones, contexto y pregunta) y <b>tokens de salida</b> (lo que responde, más los <b>tokens de razonamiento</b> en modelos que "piensan"), normalmente a precios distintos por cada millón de tokens. Los precios cambian y dependen del modelo, así que <b>siempre se consultan en la página oficial de precios</b> antes de estimar.</p><p>Fórmula mensual:</p><pre>costo_mes = consultas_mes × ( tokens_entrada × precio_entrada\n                           + (tokens_salida + tokens_razonamiento) × precio_salida ) ÷ 1.000.000</pre><p>El error más común es olvidar que el <b>contexto se envía en cada consulta</b>: si cada pregunta lleva 5 páginas de política, se pagan esas páginas miles de veces. Por eso RAG (enviar solo los fragmentos relevantes) también es una estrategia de ahorro.</p>'},{h:"Seguridad básica desde el primer prompt",html:"<ul><li>No envíes datos personales o secretos si la tarea no los necesita.</li><li>No confíes en que una instrucción del sistema basta para bloquear abusos: existe la <b>inyección de prompt</b> (prompt injection: instrucciones maliciosas escondidas en el texto). Se aborda con capas de defensa en el Módulo 4.</li><li>Pide formatos estructurados (JSON: formato de datos que los programas leen fácilmente) cuando la salida la consuma otro sistema, y valídala.</li></ul>"}],interactive:"cost",lab:{title:"Prompts de extracción de datos con el SDK de Gen AI",time:"75 min",cost:"Muy bajo (centavos de dólar).",steps:[["Preparar Cloud Shell","Abre Cloud Shell en tu proyecto y ejecuta (crea un entorno de Python aislado e instala el SDK, el kit de desarrollo de Google):<pre>gcloud services enable aiplatform.googleapis.com\npython3 -m venv ~/lab13 && source ~/lab13/bin/activate\npip install --upgrade google-genai\nexport GOOGLE_CLOUD_PROJECT=$(gcloud config get-value project)\nexport GOOGLE_CLOUD_LOCATION=global\nexport GOOGLE_GENAI_USE_ENTERPRISE=True</pre>La última variable indica que se usará Agent Platform (en documentación anterior aparece como <code>GOOGLE_GENAI_USE_VERTEXAI</code>)."],["Elegir el modelo","En Model Garden copia el identificador (ID) de un modelo Gemini vigente. En noviembre de 2026 la documentación oficial usa <code>gemini-3.8-flash</code>; los modelos 2.5 se retiraron en octubre de 2026. Guárdalo en una variable:<pre>export MODEL_ID=gemini-3.8-flash   # verifica que siga vigente</pre>Si cierras Cloud Shell, repite los comandos <code>export</code> y <code>source</code> antes de continuar."],["Primera llamada",'Crea el archivo <code>extraer.py</code> con el editor de Cloud Shell:<pre>import os\nfrom google import genai\nfrom google.genai import types\nfrom pydantic import BaseModel\n\nclass Factura(BaseModel):\n    proveedor: str | None\n    contacto: str | None\n    factura: str | None\n    monto: float | None\n    moneda: str | None\n    vencimiento: str | None\n\nclient = genai.Client()  # usa las variables de entorno\nmodelo = os.environ["MODEL_ID"]\n\ncorreo = """Hola, soy Laura Pérez de Suministros Andes.\nLa factura FA-2291 por USD 1.240 vence el 30 de noviembre.\nGracias por confirmar el pago."""\n\nr = client.models.generate_content(\n    model=modelo,\n    contents=f"Extrae los datos del correo.\\n\\nCorreo:\\n{correo}",\n    config=types.GenerateContentConfig(\n        system_instruction=(\n            "Eres un asistente de cuentas por pagar. Extrae los datos del correo. "\n            "El monto va como número con punto decimal y sin separador de miles "\n            "(ej.: 1240.00). Si un dato no aparece, usa null."),\n        response_mime_type="application/json",\n        response_schema=Factura,\n        thinking_config=types.ThinkingConfig(thinking_level="low"),\n        max_output_tokens=2048,\n    ),\n)\nprint(r.text)\nprint(r.usage_metadata)</pre>Ejecuta <code>python extraer.py</code>. Observa que no se modifica la temperatura: con Gemini 3 se deja en su valor por defecto y la consistencia la da el esquema.'],["Leer el consumo","En la salida, <code>usage_metadata</code> muestra los tokens del prompt (<code>prompt_token_count</code>), de la respuesta (<code>candidates_token_count</code>) y de razonamiento (<code>thoughts_token_count</code>). Anótalos: son la base de la estimación de costo."],["Experimentar con el razonamiento",'Cambia <code>thinking_level</code> a <code>"high"</code> y ejecuta 3 veces. Compara el tiempo de respuesta y los tokens de razonamiento con <code>"low"</code>. ¿Mejoró el resultado en una tarea tan simple? Registra la conclusión: el nivel de razonamiento se elige según la complejidad, porque cuesta.'],["Contar tokens antes de enviar",'Agrega al final del archivo (cuenta los tokens sin generar respuesta):<pre>t = client.models.count_tokens(model=modelo, contents=correo)\nprint("Tokens del correo:", t.total_tokens)</pre>'],["Estimación de costo","Con los precios vigentes de la página oficial y el simulador de esta lección, calcula el costo mensual de procesar 20.000 correos de proveedores, incluidos los tokens de razonamiento."]],check:"Entregar el JSON obtenido, la tabla de tokens por ejecución (entrada, salida y razonamiento), la conclusión sobre el nivel de razonamiento y la estimación mensual con la fuente y la fecha del precio usado.",cleanup:"No quedan recursos activos. Ejecuta <code>deactivate</code> y cierra Cloud Shell."},glossary:[["System instruction (instrucción del sistema)","Reglas y rol permanentes que guían todas las respuestas del modelo."],["Temperatura","Parámetro que controla la variabilidad de la respuesta. En modelos Gemini recientes se deja sin modificar (gemini-3.8-flash la ignora)."],["Tokens de razonamiento (thinking)",'Tokens que el modelo usa para "pensar" antes de responder; se cobran como salida.'],["SDK","Kit de desarrollo: librería que facilita usar un servicio desde un lenguaje de programación."],["Few-shot","Técnica de incluir pocos ejemplos de entrada y salida en el prompt."],["Prompt injection (inyección de prompt)","Ataque que esconde instrucciones maliciosas en el texto que procesa el modelo."]],quiz:[["Con un modelo Gemini 3, ¿cómo logras que la extracción de datos de facturas sea consistente?",["Bajando la temperatura a 0","Dejando la temperatura por defecto y usando instrucciones claras con un esquema de salida JSON","Subiendo el máximo de tokens a 10"],1,"En Gemini 3 no se ajusta la temperatura (gemini-3.8-flash incluso la ignora); la consistencia viene del esquema y de las instrucciones."],["¿Qué tokens se cobran?",["Solo los de la respuesta","Los de entrada, los de salida y los de razonamiento (estos últimos como salida)","Solo los de la instrucción del sistema"],1,"Se cobran todos; el razonamiento se factura al precio de salida."],["¿Por qué RAG también ahorra dinero?",["Porque usa modelos gratis","Porque envía solo los fragmentos relevantes y no documentos completos en cada consulta","Porque no usa tokens"],1,"Menos tokens de entrada por consulta = menor costo."],["¿Dónde se consultan los precios para una estimación?",["En un foro de desarrolladores","En la página oficial de precios de Google Cloud","Se toman del último proyecto similar"],1,"Los precios cambian; siempre se toma la fuente oficial y se anota la fecha."]]},{id:"1.4",hours:4,title:"Cómo se desarrolla un modelo",sub:"Datos, entrenamiento, evaluación; modelo preentrenado vs AutoML vs entrenamiento propio.",objectives:["Describir el ciclo de vida de un modelo de ML de punta a punta.","Separar datos de entrenamiento y de evaluación y leer métricas básicas de clasificación.","Entrenar, evaluar y usar un modelo con BigQuery ML."],blocks:[{h:"El ciclo de vida en seis pasos",html:"<ol><li><b>Definir el problema</b> y la métrica de éxito de negocio (ej.: detectar el 70 % de los clientes que cancelarán).</li><li><b>Reunir y preparar datos:</b> limpiar, unir fuentes y crear características útiles.</li><li><b>Entrenar</b> con una parte de los datos.</li><li><b>Evaluar</b> con datos que el modelo no vio.</li><li><b>Desplegar</b> para que otros sistemas lo usen.</li><li><b>Monitorear</b> y reentrenar: los datos del mundo real cambian (deriva o drift) y el desempeño del modelo se degrada con el tiempo.</li></ol>"},{h:"Tres caminos para obtener un modelo",html:'<table class="tbl"><tr><th>Camino</th><th>Cuándo usarlo</th><th>Esfuerzo</th></tr><tr><td><b>Modelo preentrenado / fundacional</b></td><td>La tarea es general (lenguaje, visión) y basta con buenos prompts o RAG</td><td>Bajo</td></tr><tr><td><b>AutoML o BigQuery ML</b></td><td>Tienes datos propios etiquetados y quieres un buen modelo sin diseñar la red neuronal ni el algoritmo a mano</td><td>Medio</td></tr><tr><td><b>Entrenamiento personalizado</b></td><td>Requisitos muy específicos, gran volumen de datos y un equipo de ciencia de datos</td><td>Alto</td></tr></table>'},{h:"Evaluar un clasificador sin perderse",html:'<p>En un problema de sí/no (¿comprará?) cada predicción cae en una de cuatro casillas de la <b>matriz de confusión</b>: verdaderos positivos, falsos positivos, falsos negativos y verdaderos negativos. De ahí salen las métricas:</p><ul><li><b>Exactitud (accuracy):</b> porcentaje total de aciertos. Engaña cuando los casos positivos son pocos.</li><li><b>Precisión (precision):</b> de los que el modelo marcó como "sí", cuántos lo eran.</li><li><b>Exhaustividad (recall):</b> de todos los "sí" reales, cuántos encontró el modelo.</li><li><b>ROC AUC:</b> qué tan bien separa ambas clases en general (1 es perfecto; 0,5 es azar).</li></ul><div class="tip">💡 Si solo 2 de cada 100 visitantes compran, un modelo que siempre dice "no comprará" tiene 98 % de exactitud y no sirve para nada. Por eso se miran precisión y exhaustividad.</div>'},{h:"BigQuery ML: modelos con SQL",html:"<p>BigQuery ML permite crear, evaluar y usar modelos con sentencias SQL, directamente donde están los datos. El modelo de este laboratorio es una <b>regresión logística</b> (logistic_reg): un algoritmo clásico que calcula la probabilidad de un resultado sí/no. Las tres instrucciones clave son <code>CREATE MODEL</code> (entrenar), <code>ML.EVALUATE</code> (evaluar) y <code>ML.PREDICT</code> (predecir). Es ideal para analistas que ya conocen SQL y para prototipos rápidos.</p>"}],interactive:"confusion",lab:{title:"Primer modelo con BigQuery ML: ¿qué visitantes comprarán?",time:"90 min",cost:"Bajo. BigQuery cobra por los datos que lee; el filtro de fechas (_TABLE_SUFFIX) y seleccionar solo las columnas necesarias reducen lo leído. Ojo: LIMIT no reduce los datos leídos.",steps:[["Crear el conjunto de datos","En la consola abre <b>BigQuery</b>. En el panel Explorador, junto al nombre de tu proyecto, abre el menú (⋮) → <b>Crear conjunto de datos</b> (dataset: el contenedor de tablas y modelos). Nombre: <code>bqml_lab</code>, ubicación: <b>US (multirregión, es decir, varios centros de datos de EE. UU.)</b>, porque el conjunto público de práctica está allí."],["Entrenar el modelo","En el editor de consultas ejecuta:<pre>CREATE OR REPLACE MODEL `bqml_lab.sample_model`\nOPTIONS(model_type='logistic_reg') AS\nSELECT\n  IF(totals.transactions IS NULL, 0, 1) AS label,\n  IFNULL(device.operatingSystem, \"\") AS os,\n  device.isMobile AS is_mobile,\n  IFNULL(geoNetwork.country, \"\") AS country,\n  IFNULL(totals.pageviews, 0) AS pageviews\nFROM `bigquery-public-data.google_analytics_sample.ga_sessions_*`\nWHERE _TABLE_SUFFIX BETWEEN '20160801' AND '20170630';</pre>Las tablas de este conjunto público están separadas por día; <code>_TABLE_SUFFIX</code> filtra los días a usar e <code>IFNULL</code> reemplaza los valores vacíos. Espera a que termine (unos minutos). Abre el modelo en el Explorador y revisa la pestaña de entrenamiento."],["Evaluar","Con datos de un periodo distinto (que el modelo no vio):<pre>SELECT *\nFROM ML.EVALUATE(MODEL `bqml_lab.sample_model`, (\n  SELECT\n    IF(totals.transactions IS NULL, 0, 1) AS label,\n    IFNULL(device.operatingSystem, \"\") AS os,\n    device.isMobile AS is_mobile,\n    IFNULL(geoNetwork.country, \"\") AS country,\n    IFNULL(totals.pageviews, 0) AS pageviews\n  FROM `bigquery-public-data.google_analytics_sample.ga_sessions_*`\n  WHERE _TABLE_SUFFIX BETWEEN '20170701' AND '20170801'));</pre>Anota precision, recall, accuracy y roc_auc. Interprétalas con lo visto en la lección."],["Predecir compras por país","<pre>SELECT country, SUM(predicted_label) AS compras_previstas\nFROM ML.PREDICT(MODEL `bqml_lab.sample_model`, (\n  SELECT\n    IFNULL(device.operatingSystem, \"\") AS os,\n    device.isMobile AS is_mobile,\n    IFNULL(totals.pageviews, 0) AS pageviews,\n    IFNULL(geoNetwork.country, \"\") AS country\n  FROM `bigquery-public-data.google_analytics_sample.ga_sessions_*`\n  WHERE _TABLE_SUFFIX BETWEEN '20170701' AND '20170801'))\nGROUP BY country\nORDER BY compras_previstas DESC\nLIMIT 10;</pre>"],["Reflexión de negocio","Si fueras el gerente comercial, ¿qué decisión tomarías con este resultado? ¿Qué dato adicional pedirías para mejorar el modelo?"]],check:"Entregar captura de las métricas, la interpretación de precision y recall con palabras propias, y la tabla de países con la decisión de negocio propuesta.",cleanup:"Si no seguirás usándolo, elimina el conjunto de datos bqml_lab (menú ⋮ → Eliminar) para no acumular almacenamiento."},glossary:[["Matriz de confusión","Tabla que cruza lo predicho con lo real en un clasificador."],["Precisión (precision)","De lo que el modelo marcó como positivo, qué parte lo era."],["Exhaustividad (recall)","De todos los positivos reales, qué parte encontró el modelo."],["Drift (deriva)","Cambio en la distribución de los datos del mundo real que degrada el desempeño del modelo con el tiempo."],["Regresión logística","Algoritmo clásico que estima la probabilidad de un resultado sí/no."]],quiz:[["¿Por qué se evalúa con datos que el modelo no vio?",["Para que el modelo sea más rápido","Para saber si generaliza y no solo memorizó","Porque BigQuery lo exige"],1,"Evaluar con los mismos datos del entrenamiento da resultados engañosamente buenos."],["En la detección de fraude importa encontrar la mayoría de los fraudes reales. ¿Qué métrica cuidas más?",["Recall (exhaustividad)","Solo la exactitud","La cantidad de columnas"],0,"El recall mide cuántos positivos reales encuentra el modelo."],["¿Qué instrucción de BigQuery ML entrena un modelo?",["ML.PREDICT","CREATE MODEL","ML.EVALUATE"],1,"CREATE MODEL entrena; ML.EVALUATE evalúa; ML.PREDICT predice."],['Un modelo que siempre dice "no comprará" obtiene 98 % de exactitud. ¿Qué significa?',["Que es excelente","Que la exactitud engaña cuando hay pocos positivos","Que hay un error en BigQuery"],1,"Por eso se revisan precisión y exhaustividad."]]}],exam:[["¿Qué tipo de IA redacta un correo de cobro personalizado?",["ML clásico de regresión","IA generativa","Una API de visión","BigQuery ML"],1],['Un modelo de cancelaciones usa "meses como cliente" y "quejas del último trimestre" para predecir "canceló: sí/no". ¿Qué es "canceló: sí/no"?',["Una característica (feature)","La etiqueta (label)","Un token de entrada","Una instrucción del sistema"],1],["Nordia quiere transcribir llamadas de soporte. Primera opción a evaluar:",["Speech-to-Text","BigQuery ML","Entrenar un modelo propio","Agent Search"],0],["¿Qué servicio es el catálogo de modelos con fichas y pruebas?",["Model Garden","Agent Runtime","Agent Search","Document AI"],0],["Nombre actual de Vertex AI Search:",["Agent Search","Agent Runtime","Agent Studio","Gemini Enterprise"],0],["Nombre actual de Agent Engine:",["Agent Runtime","Agent Search","Agent Studio","Model Garden"],0],["¿Para qué sirve la instrucción del sistema?",["Fijar el rol y las reglas permanentes del modelo","Definir el esquema JSON de salida","Limitar los tokens de salida","Elegir la región del modelo"],0],["Con Gemini 3, para clasificar tickets en categorías fijas de forma consistente conviene…",["Bajar la temperatura a 0","Mantener la temperatura por defecto y usar un esquema de salida con las categorías","Subir la temperatura al máximo","Quitar la instrucción del sistema"],1],["Si cada consulta incluye un documento de 5 páginas, el costo…",["No cambia, el contexto es gratis","Aumenta, porque esos tokens de entrada se pagan en cada consulta","Solo aumenta la primera vez","Baja, porque el modelo responde más corto"],1],["¿Qué es prompt injection?",["Un formato de salida estructurada","Instrucciones maliciosas escondidas en el texto que procesa el modelo","Una técnica de few-shot","Un error de cuota"],1],["¿Qué paso del ciclo de vida detecta la deriva (drift)?",["Monitoreo","Definir el problema","Entrenamiento","Preparación de datos"],0],["La precisión (precision) responde a…",["De lo marcado como positivo, cuánto lo era","De todos los positivos reales, cuántos encontró","El porcentaje total de aciertos","Qué tan bien separa las clases en general"],0],["Un ROC AUC de 0,5 indica…",["Un modelo perfecto","Un desempeño similar al azar","Una precisión del 50 %","Que faltan datos de entrenamiento"],1],["¿Qué instrucción produce predicciones en BigQuery ML?",["ML.PREDICT","CREATE MODEL","ML.EVALUATE","ML.TRAINING_INFO"],0],["¿Qué reduce de verdad los datos que lee (y cobra) una consulta en BigQuery?",["Agregar LIMIT","Filtrar por fechas con _TABLE_SUFFIX y seleccionar solo las columnas necesarias","Ordenar con ORDER BY","Usar una tabla con más filas"],1]],rubric:"Rúbrica del reto: elección correcta del servicio (40 %), justificación con criterios de costo, control y calidad (40 %), estimación de costo con fuente y fecha (20 %).",challenge:"Reto del módulo: para 5 necesidades de Nordia (predecir cancelaciones, leer facturas, transcribir llamadas, responder preguntas de RR. HH. y traducir contratos), elige el servicio adecuado, justifica en 3 líneas cada uno y estima el orden de magnitud del costo mensual con precios oficiales del día."},m2:{id:"m2",n:2,lvl:"Intermedio",color:"#7C3AED",hours:16,title:"RAG empresarial y agentes sin código o de bajo código",intro:'En este módulo Nordia pasa de "probar la IA" a tener asistentes que responden con sus propios documentos y agentes que consultan otros sistemas. El participante aprende cuándo usar cada técnica, construye un RAG (generación aumentada con recuperación: la IA responde consultando documentos propios) con RAG Engine, un buscador empresarial con Agent Search, un agente de bajo código en Agent Studio y una primera integración con un sistema externo. Dos laboratorios son sin código (consola) y dos usan Python guiado paso a paso.',outcomes:["Decidir entre grounding con Google Search, RAG, búsqueda empresarial y fine-tuning según el caso.","Crear un corpus en RAG Engine, ajustar el troceado y conectar el corpus a Gemini con citas de la fuente.","Montar un buscador interno con Agent Search sobre documentos en Cloud Storage.","Diseñar, probar e inspeccionar un agente de bajo código en Agent Studio.","Conectar un modelo a un sistema externo mediante llamadas a funciones (function calling)."],prereq:'Módulo 1 aprobado o conocimientos equivalentes. Proyecto de Google Cloud con facturación y presupuesto con alertas. Se usa Python guiado (copiar, ejecutar y modificar valores). Material de práctica: el paquete <a href="https://gekkomass.github.io/gekkopay-web/demos/curso-gcp/aula/Politicas_Nordia.zip" download>"Políticas de Nordia" (5 documentos PDF, descarga ZIP)</a>.',lessons:[{id:"2.1",hours:2,title:"Por qué RAG y cuándo no",sub:"Grounding con Google Search, RAG con datos propios, búsqueda empresarial y fine-tuning: cuál elegir.",objectives:["Explicar por qué un modelo no conoce los datos internos ni los hechos recientes.","Diferenciar grounding con Google Search, RAG, búsqueda empresarial y fine-tuning.","Elegir la técnica adecuada para un caso de negocio y justificar la decisión."],blocks:[{h:"El problema: el modelo no sabe lo que tu empresa sabe",html:'<p>Un modelo como Gemini aprendió de enormes cantidades de texto público hasta una fecha. No conoce las políticas de Nordia, sus precios, sus contratos ni lo que pasó ayer. Si le preguntas, puede responder de forma genérica o, peor, <b>inventar</b> con seguridad (alucinar).</p><p>La solución no es "entrenar más" al modelo cada vez que algo cambia. La solución habitual es <b>anclar</b> (grounding) la respuesta: darle al modelo, en el momento de la pregunta, la información correcta y pedirle que responda solo con ella y que cite la fuente.</p>'},{h:"Cuatro técnicas, cuatro usos",html:'<table class="tbl"><tr><th>Técnica</th><th>Qué hace</th><th>Úsala cuando</th></tr><tr><td><b>Grounding con Google Search</b></td><td>El modelo busca en la web pública antes de responder y devuelve las fuentes</td><td>La respuesta depende de información pública y reciente (noticias, normas publicadas, precios de mercado)</td></tr><tr><td><b>RAG con datos propios</b> (RAG Engine)</td><td>Recupera fragmentos de tus documentos y se los entrega al modelo como contexto</td><td>Debe responder con documentos internos y quieres controlar el troceado, los embeddings y la recuperación</td></tr><tr><td><b>Búsqueda empresarial</b> (Agent Search)</td><td>Un buscador administrado listo para usar sobre sitios, documentos y datos estructurados, con resúmenes generados</td><td>Necesitas un buscador o un sistema de RAG "llave en mano" con poca configuración</td></tr><tr><td><b>Fine-tuning</b> (ajuste fino)</td><td>Reentrena el modelo con ejemplos propios</td><td>Necesitas un estilo, formato o comportamiento muy específico y repetitivo; <b>no</b> para que "sepa" datos que cambian</td></tr></table><div class="tip">💡 Regla práctica: si la información cambia, usa recuperación (RAG o búsqueda). Si lo que quieres cambiar es el <i>comportamiento</i> del modelo, considera fine-tuning. Muchas soluciones reales combinan ambas cosas.</div>'},{h:"Grounding con Google Search en pocas líneas",html:'<p>Con el SDK de Gen AI (kit de desarrollo de Google), basta con agregar la herramienta de búsqueda a la configuración. La respuesta incluye metadatos de grounding con las páginas consultadas, que se deben mostrar al usuario:</p><pre>import os\nfrom google import genai\nfrom google.genai import types\n\nclient = genai.Client()  # usa las variables de entorno del laboratorio\nr = client.models.generate_content(\n    model=os.environ["MODEL_ID"],\n    contents="¿Cuál es la tasa de cambio oficial del dólar hoy en Colombia?",\n    config=types.GenerateContentConfig(\n        tools=[types.Tool(google_search=types.GoogleSearch())]),\n)\nprint(r.text)\nprint(r.candidates[0].grounding_metadata)</pre><p>Este ejemplo se ejecuta en el laboratorio 2.2 (guárdalo como <code>web.py</code>) junto con RAG para comparar ambas técnicas.</p>'},{h:"Lo que RAG no resuelve",html:"<ul><li><b>Documentos malos, respuestas malas:</b> si la política está desactualizada o contradice a otra, el asistente lo reflejará.</li><li><b>Permisos:</b> si el corpus incluye documentos confidenciales, cualquiera que use el asistente podría obtener esa información. Se separan corpus por audiencia o se aplican controles de acceso (Módulo 4).</li><li><b>Preguntas que requieren cálculo o datos en vivo</b> (saldo de vacaciones de una persona): eso se resuelve conectando el agente a un sistema mediante funciones (lección 2.5).</li></ul>"}],interactive:"classify",cases:{title:"¿Qué técnica necesita Nordia?",labels:["Grounding con Google Search","RAG / búsqueda empresarial","Fine-tuning","Llamada a funciones (sistema en vivo)"],items:[["Responder preguntas sobre la política de vacaciones de Nordia.",1,"Información interna que cambia de vez en cuando: recuperación de documentos."],["Contar al equipo comercial qué noticias públicas salieron hoy sobre un cliente.",0,"Información pública y reciente: grounding con Google Search."],["Saber cuántos días de vacaciones le quedan a un empleado específico.",3,"Es un dato vivo de un sistema de RR. HH.: se consulta con una función."],["Lograr que el asistente siempre responda con el formato y el tono exactos de los informes de Nordia, en miles de casos.",2,"Cambiar un comportamiento repetitivo: candidato a fine-tuning, después de agotar el prompt y los ejemplos."],["Responder qué dice la cláusula de renovación del contrato con el proveedor Andes, entre los 300 contratos vigentes.",1,"Pregunta puntual sobre documentos propios: recuperación (RAG o búsqueda empresarial)."]]},glossary:[["Grounding (anclaje)","Basar la respuesta del modelo en fuentes concretas y mostrarlas."],["RAG","Generación aumentada con recuperación: se recuperan fragmentos de documentos y se entregan al modelo como contexto."],["Fine-tuning (ajuste fino)","Reentrenar un modelo con ejemplos propios para cambiar su comportamiento."],["Corpus","Colección de documentos indexados que usa un sistema de RAG."]],quiz:[["La política de viáticos de Nordia cambia cada trimestre. ¿Qué técnica conviene para que el asistente la responda?",["Fine-tuning cada trimestre","RAG o búsqueda empresarial sobre el documento vigente","Grounding con Google Search","Ninguna, el modelo ya la conoce"],1,"Si la información cambia, se recupera en el momento de la pregunta."],["¿Qué devuelve el grounding con Google Search además de la respuesta?",["Un modelo reentrenado","Metadatos con las fuentes web consultadas","Un corpus nuevo","Un archivo PDF"],1,"Las fuentes deben mostrarse al usuario."],["¿Para qué NO sirve el fine-tuning?",["Para ajustar estilo o formato","Para que el modelo conozca datos que cambian con frecuencia","Para especializar un comportamiento repetitivo","Para tareas con muchos ejemplos"],1,"Los datos cambiantes se recuperan, no se entrenan."],["Un empleado pregunta su saldo de vacaciones. ¿Cómo debe obtenerlo el agente?",["Leyendo la política general","Consultando el sistema de RR. HH. mediante una función","Con grounding web","Inventando un estimado"],1,"Es un dato vivo y personal: se consulta en el sistema."]]},{id:"2.2",hours:4,title:"RAG empresarial con RAG Engine",sub:"Corpus, troceado, embeddings, recuperación y generación con citas.",objectives:["Describir las seis etapas de un flujo RAG y qué decisión se toma en cada una.","Crear un corpus en RAG Engine, importar documentos y ajustar el troceado (chunking).","Validar la recuperación antes de generar y conectar el corpus a Gemini como herramienta."],blocks:[{h:"Las seis etapas de RAG Engine",html:"<ol><li><b>Ingesta:</b> traer los documentos (Cloud Storage, Google Drive o archivos locales).</li><li><b>Transformación:</b> dividir cada documento en fragmentos (chunks).</li><li><b>Embeddings:</b> convertir cada fragmento en un vector, una lista de números que representa su significado; textos parecidos quedan cerca.</li><li><b>Indexación:</b> guardar los vectores en un índice buscable, llamado <b>corpus</b>.</li><li><b>Recuperación:</b> encontrar los fragmentos más relevantes para la pregunta.</li><li><b>Generación:</b> entregar esos fragmentos al modelo para que responda anclado a ellos.</li></ol>"},{h:"Decisiones que cambian la calidad",html:'<table class="tbl"><tr><th>Decisión</th><th>Efecto</th><th>Punto de partida</th></tr><tr><td><b>Tamaño del fragmento</b> (chunk_size)</td><td>Muy pequeño pierde contexto; muy grande mezcla temas y gasta tokens</td><td>512 tokens</td></tr><tr><td><b>Solapamiento</b> (chunk_overlap)</td><td>Evita cortar una idea entre dos fragmentos</td><td>100 tokens</td></tr><tr><td><b>top_k</b></td><td>Cuántos fragmentos se entregan al modelo</td><td>3 a 5</td></tr><tr><td><b>Umbral de distancia</b> (vector_distance_threshold)</td><td>Descarta fragmentos poco parecidos para que el agente diga "no lo sé" en lugar de inventar</td><td>Ajustar con pruebas</td></tr><tr><td><b>Modelo de embeddings</b></td><td>Define qué tan bien se entiende el idioma de los documentos</td><td>Para español, un modelo multilingüe como <code>text-multilingual-embedding-002</code>; <code>text-embedding-005</code> está especializado en inglés y código</td></tr><tr><td><b>Base de datos vectorial</b></td><td>Dónde se guardan los vectores: la administrada por RAG Engine u opciones como Vector Search (de Google) o servicios de terceros como Weaviate o Pinecone</td><td>La administrada, para empezar</td></tr></table><div class="tip">💡 No hay valores universales. La forma profesional es armar un conjunto de 20 preguntas con su documento correcto y medir cuántas recuperan la fuente correcta con cada configuración.</div>'},{h:"Regiones, costos y SDK: tres trampas comunes",html:"<ul><li><b>Modo de despliegue y costo:</b> si no se elige un modo, RAG Engine usa por defecto el modo Spanner con el nivel Basic, una instancia fija que genera cobro mientras exista, aunque se borren los corpus. Google recomienda empezar con el modo <b>Serverless</b>: la gestión es gratuita y solo se paga la base vectorial según su uso. En noviembre de 2026 Serverless está en <b>vista previa</b> y disponible solo en <code>us-central1</code>, por eso el laboratorio usa esa región. Cambiar de modo no borra ni detiene el modo Spanner: si ya se creó algo allí, hay que desaprovisionarlo aparte.</li><li><b>Regiones:</b> en modo Spanner, algunas regiones (entre ellas <code>us-central1</code>) exigen pedir acceso para proyectos nuevos, mientras <code>europe-west3</code> y <code>europe-west4</code> no lo exigen. Verifica siempre las páginas oficiales de regiones y de modos antes de dictar: cambian con frecuencia.</li><li><b>SDK:</b> el módulo clásico <code>vertexai.rag</code> está en desuso. El código actual usa el cliente <code>agentplatform</code> (paquete <code>google-cloud-agentplatform</code>) y el SDK de Gen AI para generar. Muchos tutoriales en internet todavía muestran el código viejo.</li></ul>"}],interactive:"rag",lab:{title:"Asistente de políticas de Nordia con RAG Engine",time:"120 min",cost:"Bajo si el proyecto queda en modo Serverless (paso 2): se pagan la base vectorial, los embeddings y las consultas al modelo. En modo Spanner Basic, el predeterminado, hay un cobro fijo mientras la instancia exista.",steps:[["Subir los documentos",'En la consola abre <b>Cloud Storage</b> → <b>Buckets</b> → <b>Crear</b>. Nombre: <code>nordia-politicas-TUNOMBRE</code> (debe ser único en el mundo), ubicación <b>us-central1</b>. Sube los 5 PDF directamente en la raíz del bucket (sin carpetas) del paquete "Políticas de Nordia".'],["Elegir el modo Serverless","En el buscador de la consola escribe <b>RAG Engine</b> y abre la página. Selecciona la región <b>us-central1</b>. Revisa la etiqueta de modo que muestra la página: si dice Spanner, haz clic en <b>Switch to Serverless</b>; si ya dice Serverless, continúa. No sigas al paso 3 hasta confirmar que el modo es Serverless: así evitas el cobro fijo del modo Spanner. Si la opción no está disponible en tu proyecto, avisa al instructor (plan B en la guía del instructor)."],["Preparar el entorno",'En Cloud Shell (la terminal de Google Cloud en el navegador) crea un entorno virtual (venv: un espacio aislado para las librerías de Python del laboratorio) e instala los kits:<pre>gcloud services enable aiplatform.googleapis.com\npython3 -m venv ~/lab22 && source ~/lab22/bin/activate\npip install "google-cloud-agentplatform>=2.0.1" google-cloud-storage google-genai\nexport GOOGLE_CLOUD_PROJECT=$(gcloud config get-value project)\nexport GOOGLE_CLOUD_LOCATION=global\nexport GOOGLE_GENAI_USE_ENTERPRISE=True\nexport MODEL_ID=gemini-3.8-flash   # verifica que siga vigente\nexport BUCKET=nordia-politicas-TUNOMBRE</pre>'],["Crear el corpus e importar",'Crea <code>corpus.py</code>:<pre>import os, agentplatform\nfrom agentplatform import types\nfrom google.genai import types as gt\n\nclient = agentplatform.Client(project=os.environ["GOOGLE_CLOUD_PROJECT"],\n                              location="us-central1")\n\nemb = types.RagEmbeddingModelConfig(\n    vertex_prediction_endpoint=types.RagEmbeddingModelConfigVertexPredictionEndpoint(\n        endpoint="publishers/google/models/text-multilingual-embedding-002"))\n\ncorpus = client.rag.create_corpus(rag_corpus=types.RagCorpus(\n    display_name="politicas-nordia",\n    rag_vector_db_config=types.RagVectorDbConfig(rag_embedding_model_config=emb)))\nprint("CORPUS:", corpus.name)\n\nclient.rag.import_files(\n    name=corpus.name,\n    import_config=types.ImportRagFilesConfig(\n        gcs_source=gt.GcsSource(uris=[f"gs://{os.environ[\'BUCKET\']}/*"]),\n        rag_file_transformation_config=types.RagFileTransformationConfig(\n            rag_file_chunking_config=types.RagFileChunkingConfig(\n                chunk_size=512, chunk_overlap=100))))</pre>Nota: Google anunció el retiro de <code>text-multilingual-embedding-002</code> para el 1 de abril de 2027; antes de esa fecha el curso indicará su reemplazo. Ejecuta <code>python corpus.py</code> (puede mostrar un aviso <code>ExperimentalWarning</code>: es normal, indica que el módulo es experimental). La importación termina antes de que el script finalice. Guarda el nombre del corpus: <pre>export CORPUS="projects/.../ragCorpora/..."   # pega el valor impreso</pre>'],["Probar la recuperación",'Antes de generar, verifica qué fragmentos se recuperan. Crea <code>recuperar.py</code>:<pre>import os, sys, agentplatform\nfrom agentplatform import types\nfrom google.genai import types as gt\n\nclient = agentplatform.Client(project=os.environ["GOOGLE_CLOUD_PROJECT"],\n                              location="us-central1")\ncfg = gt.RagRetrievalConfig(top_k=3,\n      filter=gt.RagRetrievalConfigFilter(vector_distance_threshold=0.5))\nres = client.rag.retrieve_contexts(\n    vertex_rag_store=gt.VertexRagStore(rag_resources=[\n        gt.VertexRagStoreRagResource(rag_corpus=os.environ["CORPUS"])]),\n    query=types.RagQuery(text=sys.argv[1], rag_retrieval_config=cfg))\nprint(res)</pre>Ejecuta <code>python recuperar.py "¿Cuántos días de teletrabajo tengo?"</code> y revisa que aparezca el fragmento de la política de teletrabajo.'],["Generar con citas",'Crea <code>responder.py</code>:<pre>import os, sys\nfrom google import genai\nfrom google.genai import types as gt\n\nrag_tool = gt.Tool(retrieval=gt.Retrieval(vertex_rag_store=gt.VertexRagStore(\n    rag_resources=[gt.VertexRagStoreRagResource(rag_corpus=os.environ["CORPUS"])],\n    rag_retrieval_config=gt.RagRetrievalConfig(top_k=3))))\n\nclient = genai.Client()\nr = client.models.generate_content(\n    model=os.environ["MODEL_ID"], contents=sys.argv[1],\n    config=gt.GenerateContentConfig(\n        system_instruction=("Eres el asistente de RR. HH. de Nordia. Responde solo con "\n            "la información recuperada y menciona el documento fuente. Si no está, "\n            "di que no lo encontraste."),\n        tools=[rag_tool]))\nprint(r.text)\nprint(r.candidates[0].grounding_metadata)  # fragmentos y documentos usados</pre>Prueba con 5 preguntas del banco de pruebas, incluida la que no está en los documentos. Revisa en <code>grounding_metadata</code> qué documento sustenta cada respuesta.'],["Comparar con grounding web",'Guarda el ejemplo de grounding con Google Search de la lección 2.1 como <code>web.py</code> y ejecútalo con la pregunta "¿Cuántos días de teletrabajo tengo en Nordia?". Compara: ¿qué responde sin acceso a los documentos internos?'],["Medir y ajustar","Repite las 10 preguntas del banco de pruebas con <code>chunk_size</code> 64 y 128 (overlap 16 y 32) y compara con 512. Para cada valor: en <code>corpus.py</code> cambia <code>display_name</code> (por ejemplo, politicas-nordia-64) y los valores de troceado, ejecútalo y vuelve a hacer <code>export CORPUS=...</code> con el nuevo nombre antes de usar recuperar.py y responder.py. Con 512 cada política queda casi entera en un solo fragmento. Registra en una tabla cuántas respuestas citan el documento correcto. Conclusión esperada: se elige con datos, no a ojo."]],check:"Entregar la tabla de 10 preguntas con la fuente esperada, la fuente obtenida y la configuración usada, más una conclusión de 5 líneas sobre el mejor tamaño de fragmento para estos documentos.",cleanup:"Elimina los corpus de prueba desde la página RAG Engine (región us-central1) y conserva el bucket para la lección 2.3. Si en algún momento el proyecto creó recursos en modo Spanner, avisa al instructor: hay que desaprovisionarlo (nivel Unprovisioned), lo que borra los datos de ese modo y detiene su cobro."},bank:[["¿Cuántos días de teletrabajo puedo tener por semana?","POL-01 Teletrabajo"],["¿Desde cuándo puedo pedir teletrabajo si soy nuevo?","POL-01 Teletrabajo"],["¿Con cuánta anticipación debo pedir vacaciones?","POL-02 Vacaciones"],["¿Puedo acumular tres periodos de vacaciones?","POL-02 Vacaciones"],["¿En cuántos días debo cargar las facturas de un viaje?","POL-03 Viáticos"],["¿Quién aprueba un viaje internacional?","POL-03 Viáticos"],["Me llegó un correo sospechoso, ¿qué hago?","SEG-01 Seguridad"],["¿Cada cuánto cambio mi contraseña?","SEG-01 Seguridad"],["¿Cada cuánto renuevan los portátiles?","TI-02 Equipos"],["¿Cuál es el horario de la cafetería de la oficina?","Ninguno: el agente debe decir que no lo encontró"]],glossary:[["Chunk (fragmento)","Porción de un documento que se indexa y recupera por separado."],["Embedding","Vector numérico que representa el significado de un texto."],["top_k","Número de fragmentos más relevantes que se recuperan."],["Bucket","Contenedor de archivos en Cloud Storage."]],quiz:[["¿Qué etapa convierte los fragmentos en vectores?",["Ingesta","Embeddings","Generación","Transformación"],1,"Los embeddings representan el significado como números."],["Si la recuperación no trae el fragmento correcto, ¿qué pasará con la respuesta?",["El modelo lo corrige solo","Probablemente será incorrecta o incompleta","No importa, el modelo ya sabe la respuesta","Se usará Google Search automáticamente"],1,"Primero se valida la recuperación y después la generación."],["¿Para qué sirve el umbral de distancia?",["Para acelerar la importación","Para descartar fragmentos poco parecidos y evitar respuestas inventadas","Para cifrar el corpus","Para elegir la región"],1,"Sin fragmentos relevantes, el agente debe decir que no encontró la información."],["¿Cuál es el SDK actual para crear corpus de RAG Engine?",["vertexai.rag","El cliente agentplatform","gcloud ml language","BigQuery ML"],1,"vertexai.rag está en desuso."]]},{id:"2.3",hours:3,title:"Búsqueda empresarial lista para usar",sub:"Agent Search (antes Vertex AI Search) sobre documentos, sitios y datos estructurados.",objectives:["Explicar qué ofrece Agent Search frente a construir un RAG propio.","Crear un almacén de datos (data store) desde Cloud Storage y una app de búsqueda.","Evaluar los resultados de búsqueda y los costos de las ediciones y funciones avanzadas."],blocks:[{h:'Agent Search: el RAG "llave en mano"',html:'<p>Agent Search permite crear experiencias de búsqueda de calidad Google sobre sitios web, datos estructurados y no estructurados, y también funciona como sistema RAG listo para usar. A diferencia de RAG Engine, no se configuran a mano el troceado ni los embeddings: se crea un <b>almacén de datos</b> (data store), se conecta a una <b>app</b> y el servicio se encarga del resto.</p><table class="tbl"><tr><th></th><th>RAG Engine</th><th>Agent Search</th></tr><tr><td>Control técnico</td><td>Alto: troceado, embeddings, base vectorial, umbrales</td><td>Medio: configuración administrada</td></tr><tr><td>Tiempo hasta el primer resultado</td><td>Horas</td><td>Minutos</td></tr><tr><td>Ideal para</td><td>Agentes a la medida y equipos técnicos</td><td>Buscadores internos, portales y prototipos rápidos</td></tr></table>'},{h:"Tipos de datos",html:"<ul><li><b>No estructurados:</b> documentos (PDF, HTML, TXT) en Cloud Storage, opcionalmente con metadatos.</li><li><b>Estructurados:</b> datos con esquema, por ejemplo una tabla de BigQuery o archivos JSON.</li><li><b>Sitios web:</b> la búsqueda completa en sitios web requiere activar las funciones Enterprise de la app, con costo adicional.</li><li><b>Conectores de terceros:</b> fuentes como Jira o Salesforce sincronizadas con el almacén de datos.</li></ul>"},{h:"Costos y ediciones",html:"<p>Agent Search cobra por consultas y por funciones avanzadas. Los resúmenes generados con citas y las respuestas extractivas requieren las funciones Enterprise. Antes de un despliegue: estima consultas mensuales, revisa la página oficial de precios y define qué funciones son imprescindibles. En el laboratorio se usan pocos documentos y pocas consultas.</p>"}],interactive:"classify",cases:{title:"¿RAG Engine o Agent Search?",labels:["RAG Engine","Agent Search"],items:[["Un portal de búsqueda para que 400 empleados encuentren procedimientos, listo esta semana.",1,"Tiempo corto y caso estándar de búsqueda: Agent Search."],["Un agente que necesita controlar el tamaño de fragmento y usar una base vectorial que la empresa ya tiene.",0,"Control técnico fino: RAG Engine."],["Buscar en el catálogo de productos (tabla de BigQuery) con filtros por precio.",1,"Datos estructurados con búsqueda administrada: Agent Search."],["Experimentar con distintos modelos de embeddings y medir cuál recupera mejor.",0,"La elección de embeddings es configurable en RAG Engine."]]},lab:{title:"Buscador interno de Nordia con Agent Search",time:"75 min",cost:"Bajo con pocas consultas. Las funciones Enterprise quedan desactivadas, por eso la vista previa muestra resultados de búsqueda sin resúmenes generados.",steps:[["Abrir AI Applications","Necesitas el rol Discovery Engine Admin (si eres propietario del proyecto ya lo tienes). En el buscador superior de la consola escribe <b>AI Applications</b> y abre la página. Si lo solicita, activa la API."],["Crear el almacén de datos","En el menú lateral elige <b>Data Stores</b> (almacenes de datos) → <b>Create data store</b>. Fuente: <b>Cloud Storage</b>. Tipo: <b>documentos no estructurados</b>. Marca <b>Folder</b> (carpeta) y en el campo <code>gs://</code> escribe <code>nordia-politicas-TUNOMBRE</code>. Ubicación: <b>global</b>. Nombre: <code>politicas-nordia-ds</code>. Haz clic en <b>Create</b>. La indexación puede tardar varios minutos."],["Crear la app de búsqueda",'En el menú lateral elige <b>Apps</b> → <b>Create app</b> y elige el tipo de app de búsqueda (en la consola actual la tarjeta puede aparecer como "Site search with AI mode" o como búsqueda personalizada). Conecta el almacén <code>politicas-nordia-ds</code> y deja desactivadas las funciones Enterprise.'],["Probar en la vista previa",'Abre la app y entra a <b>Preview</b>. Busca: "teletrabajo", "¿qué hago con un correo sospechoso?" y "renovación de portátiles". Observa qué documentos devuelve y en qué orden. Sin funciones Enterprise no habrá resumen generado: aquí se evalúa la búsqueda.'],["Comparar con tu RAG","Haz las mismas 5 preguntas que usaste en el laboratorio 2.2. Registra en la tabla si el documento correcto aparece en el primer resultado y cuánto tiempo de configuración tomó cada herramienta. Opcional con el instructor: activar Enterprise por un rato para ver resúmenes, revisando antes el costo."],["Integración (lectura)","En la app, revisa la sección de integración: muestra cómo llamar al buscador por API o insertarlo en un sitio. Anota qué necesitarías para ponerlo en la intranet de Nordia."]],check:"Entregar capturas de la vista previa, la tabla comparativa RAG Engine vs Agent Search y una recomendación de cuál usaría Nordia para su portal interno y por qué.",cleanup:"Si no lo usarás más, elimina la app y el almacén de datos desde AI Applications para evitar cargos."},glossary:[["Data store (almacén de datos)","Contenedor donde Agent Search guarda e indexa los datos de una fuente."],["App (en Agent Search)","La aplicación de búsqueda o recomendaciones que usa uno o más almacenes de datos."],["Datos estructurados","Datos con columnas y tipos definidos, como una tabla."],["Conector","Integración que sincroniza datos de otra aplicación (Jira, Salesforce) con el almacén."]],quiz:[["¿Cuál es la principal ventaja de Agent Search frente a RAG Engine?",["Más control del troceado","Resultados en minutos con configuración administrada","Es gratis","Permite reentrenar Gemini"],1,'Agent Search es la opción "llave en mano".'],["¿Qué se conecta a una app de Agent Search?",["Un corpus de RAG Engine","Uno o más almacenes de datos","Un modelo de BigQuery ML","Un bucket directamente sin almacén"],1,"La app usa almacenes de datos."],["¿Qué funciones pueden generar costo adicional?",["La vista previa","La edición Enterprise y funciones avanzadas","Crear un proyecto","Leer la documentación"],1,"Siempre revisar precios antes de activarlas."],["Nordia necesita un agente con umbrales de similitud ajustados a mano. ¿Qué elige?",["Agent Search","RAG Engine","Gemini Enterprise","Document AI"],1,"El control fino está en RAG Engine."]]},{id:"2.4",hours:4,title:"Agentes sin código y de bajo código",sub:"Agent Studio para equipos técnicos y el constructor sin código de Gemini Enterprise para equipos de negocio.",objectives:["Explicar qué es un agente y en qué se diferencia de un chatbot con prompt.","Diseñar, probar e inspeccionar un agente en Agent Studio con instrucciones, conocimiento y herramientas.","Decidir cuándo basta un agente sin código y cuándo pasar a código con ADK."],blocks:[{h:"De chatbot a agente",html:"<p>Un chatbot responde con lo que sabe. Un <b>agente</b> recibe un objetivo, decide qué pasos seguir y usa <b>herramientas</b> (buscar en la web, consultar documentos, llamar a un sistema) para lograrlo. Sus piezas son: <b>instrucciones</b> (qué debe hacer y qué no), <b>modelo</b>, <b>herramientas</b>, <b>conocimiento</b> y, en diseños más complejos, <b>subagentes</b> especializados.</p>"},{h:"Dos caminos sin escribir código",html:'<table class="tbl"><tr><th></th><th>Agent Studio (Agent Platform)</th><th>Constructor sin código de Gemini Enterprise</th></tr><tr><td>Para quién</td><td>Equipos técnicos que prototipan y luego despliegan</td><td>Usuarios de negocio que automatizan su propio trabajo</td></tr><tr><td>Cómo se crea</td><td>Describiendo el agente en lenguaje natural o en un lienzo visual con agente principal y subagentes</td><td>Describiendo la tarea en lenguaje natural dentro de la app de Gemini Enterprise</td></tr><tr><td>Salida</td><td>Se puede obtener el código Python o desplegar el agente</td><td>El agente queda disponible para el equipo dentro de Gemini Enterprise</td></tr><tr><td>Requisito</td><td>Proyecto de Google Cloud con el rol de usuario de Agent Platform</td><td>Licencia de Gemini Enterprise en la organización</td></tr></table><div class="tip">💡 Google ha renombrado varias veces estas herramientas. En la app de Gemini Enterprise el constructor se conoció como Agent Designer y la documentación reciente lo presenta como Workflow Builder; verifica el nombre vigente antes de dictar.</div>'},{h:"Qué se configura en Agent Studio",html:'<ul><li><b>Instrucciones:</b> el comportamiento del agente.</li><li><b>Modelo:</b> el que lo impulsa.</li><li><b>Herramientas:</b> Google Search (búsqueda y grounding) y contexto de URL vienen activadas por defecto; también servidores MCP (protocolo estándar para conectar herramientas) registrados en Agent Registry (el catálogo de agentes y herramientas de Agent Platform).</li><li><b>Conocimiento:</b> hasta 10 archivos PDF o de texto de 2 MB cada uno, en el agente principal, después de guardar.</li><li><b>Subagentes:</b> locales o tomados de Agent Registry.</li></ul><p>La pestaña <b>Preview</b> permite conversar con el agente e inspeccionar cada evento: llamadas a herramientas, solicitud y respuesta, modelo y consumo de tokens. Desde <b>Get code</b> se genera el código Python para continuar el desarrollo.</p><div class="tip">⚠ Al momento de esta edición, el diseño de agentes en Agent Studio está en <b>vista previa</b> (Preview): puede cambiar y tiene soporte limitado. Úsalo para prototipos; para producción, pasa a ADK (Agent Development Kit, el kit de Google para programar agentes; Módulo 3).</div>'},{h:"Instrucciones que funcionan",html:"<p>Una buena instrucción de agente define: rol, objetivo, fuentes permitidas, qué hacer si no sabe, límites (qué nunca hacer) y formato de respuesta. Usa el generador de esta lección para armar la tuya.</p>"}],interactive:"prompter",lab:{title:"Agente de bienvenida para nuevos empleados de Nordia en Agent Studio",time:"90 min",cost:"Bajo: consultas de prueba al modelo.",steps:[["Verificar permisos","Confirma que tu usuario tiene el rol <b>Agent Platform User</b> (<code>roles/aiplatform.user</code>) en el proyecto. Si usas tu propio proyecto como propietario, ya lo tienes."],["Crear el agente",'En la consola abre la página <b>Agents</b> (búscala en el buscador superior) y haz clic en <b>Create agent</b>. Se abre el lienzo de Agent Studio. En el chat describe: <i>"Agente de bienvenida para nuevos empleados de Nordia. Responde dudas sobre políticas internas usando solo los documentos cargados, en tono cercano y profesional, y sugiere a quién escribir cuando no sepa."</i>'],["Guardar y ajustar","Haz clic en <b>Save</b> y ponle nombre: <code>bienvenida-nordia</code>. Abre el panel <b>Details</b> y pega la instrucción que armaste con el generador de esta lección. Revisa el modelo seleccionado."],["Agregar conocimiento",'En <b>Knowledge</b> carga los 5 PDF de "Políticas de Nordia" (máximo 10 archivos de 2 MB).'],["Decidir sobre las herramientas web","Google Search y URL context (lectura de páginas web por dirección) vienen activados por defecto. Para un agente que solo debe usar políticas internas, desactiva ambos y explica en tu bitácora por qué."],["Probar e inspeccionar",'En <b>Preview</b> haz 5 preguntas, incluida una fuera de los documentos ("¿cuál es el mejor restaurante cerca de la oficina?"). Si aparece un diálogo de permisos, elige <b>Grant All</b> (otorgar todos) para dar a la identidad del agente los roles que necesita. Selecciona cada evento y revisa qué herramienta usó y cuántos tokens consumió.'],["Obtener el código","Haz clic en <b>Get code</b> y guarda el <code>agent.py</code> generado: lo usarás como punto de partida en el Módulo 3."]],check:"Entregar la instrucción final, capturas de 2 eventos inspeccionados, la respuesta a la pregunta fuera de alcance y el archivo agent.py generado.",cleanup:"Puedes conservar el agente guardado para el Módulo 3. No lo despliegues todavía. Ojo: los archivos de conocimiento quedan en un bucket del proyecto visible para quien tenga acceso a él; no cargues documentos confidenciales reales en un proyecto de práctica."},glossary:[["Agente","Sistema de IA que persigue un objetivo, decide pasos y usa herramientas."],["Herramienta (tool)","Capacidad que el agente puede invocar: buscar, consultar datos, llamar una API."],["Subagente","Agente especializado al que el agente principal delega una parte del trabajo."],["MCP","Model Context Protocol: estándar abierto para conectar herramientas y datos a modelos de IA."]],quiz:[["¿Qué diferencia a un agente de un chatbot simple?",["Usa un modelo más grande","Decide pasos y usa herramientas para lograr un objetivo","Solo responde en JSON","No necesita instrucciones"],1,"La autonomía y las herramientas definen al agente."],["En Agent Studio, ¿cuándo se puede cargar conocimiento?",["Antes de crear el agente","Después de guardar el agente, en el agente principal","Solo en subagentes","Nunca"],1,"El conocimiento se asocia a un agente ya guardado (con nombre) y solo al agente principal; por eso primero se guarda."],["¿Qué permite ver la pestaña Preview al seleccionar un evento?",["El costo mensual","Las llamadas a herramientas, la solicitud, la respuesta y los tokens","La factura","El código de Google"],1,"Es la base para depurar un agente."],["¿Qué requiere el constructor sin código de Gemini Enterprise?",["Una licencia de Gemini Enterprise","Saber Python","Una cuenta de BigQuery","Un servidor propio"],0,"Es parte de la aplicación de Gemini Enterprise."]]},{id:"2.5",hours:3,title:"Integración con sistemas existentes",sub:"Llamadas a funciones, APIs administradas, MCP y webhooks.",objectives:['Explicar cómo un modelo "llama" a un sistema mediante function calling.',"Conectar Gemini a una función que simula el sistema de RR. HH. de Nordia.","Identificar opciones de integración empresarial: Apigee API hub, MCP y webhooks, y sus riesgos."],blocks:[{h:"Cómo funciona una

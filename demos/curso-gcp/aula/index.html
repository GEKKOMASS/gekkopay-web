<style>
:root{--bg:#F6F7FB;--ink:#0F172A;--mu:#5B6475;--ln:#E3E7EF;--card:#fff;--b1:#2563EB;--b2:#7C3AED;--g1:#059669;--y1:#D97706;--r1:#DC2626;--dk:#0B1220;--disp:'Space Grotesk',system-ui,sans-serif;--sans:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;font-size:15.5px}
button,input{font:inherit}button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--disp);letter-spacing:-.01em}
.top{position:sticky;top:0;z-index:30;background:var(--dk);color:#fff;height:58px;display:flex;align-items:center;gap:12px;padding:0 16px}
.top .lg{font-family:var(--disp);font-weight:700;display:flex;gap:9px;align-items:center;font-size:16px;text-decoration:none;color:#fff}
.top .lg i{font-style:normal;width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--b1),var(--b2));display:grid;place-items:center;font-size:13px}
.prog{flex:1;max-width:260px;margin-left:auto;font-size:12px;color:#A9B4C7}
.prog .bar{height:6px;background:#1E293B;border-radius:99px;overflow:hidden;margin-top:4px}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#60A5FA,#C4B5FD);transition:.4s}
.ins{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#C7D2E3;white-space:nowrap}
.ins input{accent-color:#A78BFA}
.menu{display:none;background:none;border:0;color:#fff;font-size:22px}
.lay{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 58px)}
aside{background:#fff;border-right:1px solid var(--ln);padding:16px 12px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
aside h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:14px 8px 6px;font-family:var(--sans)}
aside a{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.35}
aside a:hover{background:#F1F5F9}
aside a.on{background:#EEF2FF;color:#3730A3;font-weight:600}
aside a .ck{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #CBD5E1;margin-top:1px;display:grid;place-items:center;font-size:10px;color:#fff}
aside a.done .ck{background:var(--g1);border-color:var(--g1)}
aside a.lock{color:#94A3B8;cursor:default}
aside a.lock:hover{background:none}
@media(max-width:900px){.lay{grid-template-columns:minmax(0,1fr)}.top .lg span{font-size:14px}aside{position:fixed;left:0;top:58px;width:290px;z-index:25;transform:translateX(-100%);transition:.25s;box-shadow:10px 0 30px rgba(0,0,0,.15)}aside.open{transform:none}.menu{display:block}.prog{display:none}}
main{min-width:0;padding:28px clamp(16px,4vw,48px) 80px;max-width:940px;width:100%}
.crumb{font-size:12.5px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
h1{font-size:clamp(26px,3.4vw,36px);line-height:1.15;margin:6px 0 8px}
.sub{color:var(--mu);font-size:16.5px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.chip{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:#fff;border:1px solid var(--ln)}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:20px;margin-top:16px}
.card h2{font-size:21px;margin-bottom:8px}
.card h3{font-size:18px;margin:4px 0 8px}
.card p{margin:8px 0}
.card ul,.card ol{padding-left:22px;margin:8px 0}
.card li{margin:5px 0}
.obj{background:#F8FAFC}
.tip{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14.5px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0;display:block;overflow-x:auto}
.tbl th,.tbl td{border-bottom:1px solid var(--ln);padding:9px 10px;text-align:left;vertical-align:top}
.tbl th{background:#F8FAFC;color:var(--mu);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
pre{background:#0B1220;color:#E2E8F0;border-radius:12px;padding:14px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;margin:10px 0;position:relative;white-space:pre}
code{font-family:var(--mono);font-size:.9em;background:#F1F5F9;border-radius:5px;padding:1px 5px}
pre code{background:none;padding:0}
.cp{position:absolute;right:8px;top:8px;background:#1E293B;color:#CBD5E1;border:0;border-radius:7px;padding:4px 9px;font-size:11.5px}
.lab{border-left:4px solid var(--g1)}
.lab .lmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.step{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}
.step:first-of-type{border-top:0}
.step input{width:20px;height:20px;accent-color:var(--g1);flex:none;margin-top:3px}
.step>div{min-width:0;flex:1}
.step.ok b{text-decoration:line-through;color:var(--mu)}
.instr{border-left:4px solid var(--b2);background:#FAF5FF;display:none}
body.inst .instr{display:block}
.q{margin:14px 0}
.q b{display:block;margin-bottom:8px}
.q label{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--ln);border-radius:10px;padding:9px 11px;margin-bottom:6px;cursor:pointer;font-size:14.5px;background:#fff}
.q label.ok{border-color:var(--g1);background:#ECFDF5}.q label.bad{border-color:var(--r1);background:#FEF2F2}
.q .why{display:none;font-size:13.5px;color:var(--mu);margin-top:4px}
.q.done .why{display:block}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--b1);color:#fff;text-decoration:none}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--ln)}
.btn.g{background:var(--g1)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.score{font-family:var(--disp);font-size:20px;margin-left:10px}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.gl{grid-template-columns:1fr}}
.gl div{background:#F8FAFC;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font-size:14px}
.gl b{display:block}
/* interactives */
.ia{border:2px dashed #C7D2FE;background:#FCFCFF}
.case{border:1px solid var(--ln);border-radius:12px;padding:12px;margin:8px 0;background:#fff}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.opts button{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:6px 12px;font-size:13.5px}
.opts button.ok{background:#ECFDF5;border-color:var(--g1);color:#065F46}
.opts button.bad{background:#FEF2F2;border-color:var(--r1);color:#991B1B}
.fb{font-size:13.5px;color:var(--mu);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.grid2>*{min-width:0}
.fld{margin:8px 0}
.fld label{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:4px}
.fld input[type=number]{width:100%;border:1px solid var(--ln);border-radius:10px;padding:9px 11px}
.fld input[type=range]{width:100%;accent-color:var(--b1)}
.out{background:var(--dk);color:#E2E8F0;border-radius:14px;padding:16px}
.out b.big{display:block;font-family:var(--disp);font-size:34px;color:#fff}
.out .r{display:flex;justify-content:space-between;border-top:1px solid #1E293B;padding:7px 0;font-size:14px}
.mx{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;font-size:13px;align-items:center}
.mx .c{border-radius:10px;padding:10px;text-align:center;font-weight:700}
.cert{text-align:center;border:3px double #C4B5FD;border-radius:18px;padding:26px;background:linear-gradient(180deg,#fff,#F5F3FF)}
.cert h2{font-size:26px}
.hero{background:radial-gradient(700px 300px at 90% -20%,rgba(124,58,237,.3),transparent 60%),var(--dk);color:#fff;border-radius:18px;padding:26px}
.hero h1{color:#fff}
.hero p{color:#B8C2D6}
.wm{position:fixed;right:12px;bottom:12px;background:rgba(11,18,32,.92);color:#C4B5FD;font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;z-index:60;pointer-events:none;letter-spacing:.04em}
.foot{font-size:12px;color:var(--mu);margin-top:40px;border-top:1px solid var(--ln);padding-top:14px}
</style>

<script>
/*! © GEKKOMASS · Programa IA & Agentes en Google Cloud · Módulo 1 · Prohibida su reproducción */
window.COURSE=window.COURSE||{},window.COURSE.m1={id:"m1",n:1,lvl:"Básico",color:"#2563EB",hours:12,title:"Fundamentos y exploración de modelos",intro:"Este módulo construye el vocabulario y el criterio que se usarán en todo el programa. Al terminarlo, el participante sabe distinguir los tipos de IA, ubicar cada servicio de Google Cloud en el mapa, escribir prompts controlando costo y calidad, y entiende cómo nace, se evalúa y se usa un modelo de machine learning.",outcomes:["Explicar con ejemplos la diferencia entre IA, machine learning, deep learning e IA generativa.","Elegir el servicio de IA de Google Cloud adecuado para un caso de negocio y justificar la elección.","Escribir prompts con instrucciones del sistema, ajustar parámetros y estimar el costo por consulta.","Entrenar, evaluar y usar un modelo de clasificación con BigQuery ML usando solo SQL."],prereq:"No requiere experiencia en programación: en el laboratorio 1.3 se copia y ejecuta código Python guiado paso a paso. Se recomienda SQL básico (el lenguaje para consultar bases de datos) para el laboratorio 1.4. Cada participante necesita una cuenta de Google Cloud con facturación activa; las cuentas nuevas suelen recibir un crédito de prueba (verificar condiciones vigentes en cloud.google.com/free).",lessons:[{id:"1.1",hours:2,title:"IA, machine learning e IA generativa",sub:"Conceptos sin humo, casos reales y límites de cada enfoque.",objectives:["Definir IA, machine learning (ML), deep learning e IA generativa y cómo se relacionan.","Reconocer qué tipo de solución necesita un problema de negocio.","Identificar los límites y riesgos de cada enfoque, incluidas las alucinaciones."],blocks:[{h:"Cuatro términos que se usan mal",html:'<p>En las empresas se dice "IA" para todo, y esa confusión cuesta dinero: se compran soluciones complejas para problemas simples o se espera magia de herramientas que no la tienen. Ordenemos los términos de afuera hacia adentro:</p><ul><li><b>Inteligencia artificial (IA):</b> el campo amplio de crear sistemas que realizan tareas que normalmente requieren inteligencia humana: reconocer, decidir, predecir, conversar.</li><li><b>Machine learning (aprendizaje automático, ML):</b> una forma de lograr IA en la que el sistema <i>aprende patrones a partir de datos</i> en lugar de seguir reglas escritas a mano.</li><li><b>Deep learning (aprendizaje profundo):</b> un tipo de ML que usa redes neuronales de muchas capas. Es lo que permitió los grandes avances en visión, voz y lenguaje.</li><li><b>IA generativa:</b> modelos de deep learning entrenados con enormes cantidades de datos que <i>crean contenido nuevo</i>: texto, código, imágenes, audio. Gemini es un ejemplo.</li></ul><div class="tip">💡 Regla práctica: toda IA generativa es ML, pero no todo ML es IA generativa. Predecir si un cliente pagará su factura es ML clásico; redactarle un mensaje de cobro es IA generativa.</div>'},{h:"Cómo aprende un modelo, en pocas palabras",html:'<p>Un modelo de ML es una función que recibe <b>características</b> (features: los datos de entrada, por ejemplo país, dispositivo y páginas vistas) y produce una <b>predicción</b> (por ejemplo: "comprará" o "no comprará").</p><p>Durante el <b>entrenamiento</b> el modelo ve miles de ejemplos donde ya se conoce la respuesta correcta, llamada <b>etiqueta</b> (label). Ajusta sus parámetros internos para equivocarse lo menos posible. Luego se <b>evalúa</b> con ejemplos que nunca vio, para saber si realmente aprendió o solo memorizó.</p><p>Los modelos generativos funcionan con la misma lógica a otra escala: aprenden a predecir el siguiente fragmento de texto (token) con base en todo lo anterior. Por eso escriben con fluidez, y también por eso pueden "inventar" con total seguridad algo que suena correcto pero no lo es.</p>'},{h:"Tres familias de problemas de negocio",html:'<table class="tbl"><tr><th>Familia</th><th>Pregunta típica</th><th>Ejemplo</th><th>Enfoque habitual</th></tr><tr><td>Predecir</td><td>¿Qué va a pasar?</td><td>¿Este cliente cancelará su plan?</td><td>ML clásico con datos históricos</td></tr><tr><td>Percibir</td><td>¿Qué hay aquí?</td><td>Leer una factura escaneada, transcribir una llamada</td><td>APIs preentrenadas (servicios listos que un programa puede usar: visión, voz, documentos)</td></tr><tr><td>Generar y conversar</td><td>¿Puedes crear o responder esto?</td><td>Resumir contratos, responder preguntas de empleados</td><td>IA generativa, normalmente con RAG (que la IA responda consultando documentos propios) o agentes (IA que además ejecuta acciones)</td></tr></table>'},{h:"Límites que hay que decir en voz alta",html:'<ul><li><b>Alucinaciones:</b> un modelo generativo puede producir datos falsos con tono convincente. Se mitiga anclando las respuestas a fuentes confiables, técnica llamada grounding, y con RAG (Módulo 2) y diseñando el agente para decir "no lo sé".</li><li><b>Datos sesgados o pobres:</b> un modelo aprende lo que hay en los datos, incluidos sus errores y sesgos.</li><li><b>Costo y latencia (tiempo de respuesta):</b> cada consulta a un modelo grande cuesta y tarda. Elegir el modelo más pequeño que cumpla el objetivo es una decisión de negocio.</li><li><b>Privacidad y cumplimiento:</b> qué datos se envían al modelo, dónde se procesan y quién puede verlos (Módulo 4).</li></ul>'},{h:"Caso continuo: Nordia",html:'<p>Durante todo el programa trabajaremos con <b>Nordia</b>, una empresa ficticia de servicios con 400 empleados. Su gerencia quiere "usar IA". Al final de este módulo el participante podrá traducir ese deseo en tres iniciativas concretas: un modelo que prediga qué clientes están en riesgo de irse, una API que lea las facturas de proveedores y un asistente interno que responda preguntas sobre políticas. Cada una usa un enfoque distinto.</p>'}],interactive:"classify",cases:{title:"¿Qué enfoque necesita Nordia?",labels:["ML clásico","API preentrenada","IA generativa"],items:[["Predecir qué clientes cancelarán su plan el próximo trimestre.",0,"Predicción con datos históricos y etiqueta clara: ML clásico."],["Transcribir a texto las llamadas del centro de soporte.",1,"Existe una API especializada (Speech-to-Text)."],["Redactar respuestas a correos de clientes con el tono de la marca.",2,"Generar texto nuevo: IA generativa."],["Leer facturas escaneadas y extraer el total.",1,"Document AI resuelve esta tarea sin entrenar nada."],["Estimar la demanda de la próxima semana por sucursal.",0,"Pronóstico con series de tiempo: ML clásico."],["Responder preguntas de empleados sobre políticas internas.",2,"IA generativa anclada a documentos (RAG, Módulo 2)."]]},glossary:[["Feature (característica)","Dato de entrada que usa el modelo para predecir."],["Label (etiqueta)","La respuesta correcta conocida en los datos de entrenamiento."],["Token","Fragmento de texto (aprox. una palabra corta o parte de una palabra) con el que trabajan y cobran los modelos de lenguaje."],["Alucinación","Respuesta inventada por un modelo generativo que parece correcta pero no lo es."]],quiz:[["Una empresa quiere saber qué clientes probablemente dejarán de pagar el próximo mes. ¿Qué enfoque es el más adecuado para empezar?",["IA generativa","ML clásico con datos históricos de pagos","Una API de visión"],1,"Es un problema de predicción con datos históricos y una etiqueta clara (pagó / no pagó)."],["¿Cuál afirmación es correcta?",["Todo ML es IA generativa","Toda IA generativa es una forma de ML","Deep learning no usa datos"],1,"La IA generativa usa deep learning, que es un tipo de ML."],["¿Qué es una alucinación?",["Un error de conexión","Una respuesta inventada con apariencia de verdad","Un modelo que tarda en responder"],1,"Se mitiga anclando el modelo a fuentes confiables."],['En un modelo que predice compras, "páginas vistas" es…',["Una etiqueta","Una característica (feature)","Un token"],1,"Es un dato de entrada; la etiqueta sería si compró o no."]],instructor:{timing:[["Apertura y expectativas",15],["Los cuatro términos",25],["Cómo aprende un modelo",20],["Actividad: clasificar casos",25],["Límites y riesgos",20],["Caso Nordia y cierre",15]],keys:['Separar "IA" como deseo de "ML / generativa" como herramienta.',"Introducir desde ya la palabra alucinación y la idea de anclar respuestas a fuentes."],errors:['Participantes que creen que la IA generativa "sabe" todo en tiempo real: mostrar un ejemplo de fecha o dato interno que el modelo no puede conocer.','Confundir automatización con reglas (if/else) con ML: preguntar "¿de dónde aprendió la regla?".']}},{id:"1.2",hours:3,title:"Mapa de servicios de IA en Google Cloud",sub:"Agent Platform (antes Vertex AI), Model Garden, Gemini Enterprise y APIs preentrenadas.",objectives:["Ubicar los principales servicios de IA de Google Cloud y para quién está pensado cada uno.","Usar Model Garden para descubrir, comparar y probar modelos.","Probar una API preentrenada desde Cloud Shell."],blocks:[{h:"Primero, los nombres (cambian seguido)",html:'<p>En Google Cloud Next \'26 (abril de 2026) Google reorganizó su oferta de IA. Vertex AI pasó a llamarse <b>Gemini Enterprise Agent Platform</b> (en este curso, "Agent Platform"); Vertex AI Studio pasó a ser <b>Agent Studio</b>; Agent Engine pasó a ser <b>Agent Runtime</b>; y Vertex AI Search pasó a ser <b>Agent Search</b>. Antes, en octubre de 2025, Agentspace se había integrado en <b>Gemini Enterprise</b>.</p><div class="tip">💡 Mucha documentación, cursos y respuestas en foros siguen usando los nombres anteriores. Saber la equivalencia ahorra horas de búsqueda. Siempre verifica en la documentación oficial antes de un despliegue.</div>'},{h:"El mapa en cuatro capas",html:'<table class="tbl"><tr><th>Capa</th><th>Servicios</th><th>Para quién</th></tr><tr><td><b>1. APIs preentrenadas</b></td><td>Vision, Speech-to-Text, Text-to-Speech, Translation, Natural Language, Document AI</td><td>Desarrolladores que necesitan una capacidad concreta sin entrenar nada</td></tr><tr><td><b>2. Modelos fundacionales</b></td><td>Gemini y otros modelos (de Google, abiertos y de terceros) disponibles en Model Garden</td><td>Equipos que construyen aplicaciones con IA generativa</td></tr><tr><td><b>3. Plataforma para construir</b></td><td>Agent Platform: Agent Studio, RAG Engine, Agent Search, ADK (kit para programar agentes), Agent Runtime, evaluación y MLOps (prácticas para operar modelos en producción)</td><td>Equipos técnicos que llevan soluciones a producción</td></tr><tr><td><b>4. Aplicación para empleados</b></td><td>Gemini Enterprise: asistente, búsqueda empresarial y agentes sin código</td><td>Usuarios de negocio</td></tr></table><p>Además, <b>BigQuery ML</b> permite entrenar y usar modelos de ML directamente con SQL sobre los datos del almacén de datos, sin moverlos.</p>'},{h:"Model Garden: el catálogo de modelos",html:"<p>Model Garden es el catálogo donde se descubren los modelos disponibles. Cada modelo tiene una <b>ficha</b> (model card) con sus capacidades, tamaño de contexto, regiones, precios y restricciones de uso. Desde allí se puede probar el modelo en Agent Studio o consultar el código para llamarlo por API (interfaz que permite que un programa use el servicio).</p><p>Criterios para comparar modelos: <b>calidad</b> en tu tarea (no en benchmarks, que son pruebas genéricas de comparación), <b>latencia</b> (tiempo de respuesta), <b>costo por token</b>, <b>ventana de contexto</b> (cuánto texto acepta), <b>multimodalidad</b> (texto, imagen, audio, video) y <b>disponibilidad regional</b>.</p>"},{h:"Árbol de decisión rápido",html:"<ol><li>¿Existe una API preentrenada que haga exactamente la tarea (traducir, transcribir, leer facturas)? → Úsala primero: es la opción más rápida y predecible.</li><li>¿La tarea es predecir con tus datos tabulares (en tablas)? → BigQuery ML o AutoML (servicio que entrena modelos automáticamente con tus datos).</li><li>¿Debe responder con documentos de la empresa? → Modelo Gemini con RAG (Módulo 2).</li><li>¿Debe ejecutar acciones en otros sistemas, como un CRM (sistema de gestión de clientes)? → Construir un agente (Módulos 2 y 3).</li><li>¿Solo hay que generar, resumir o clasificar texto? → Modelo Gemini vía Agent Platform con un buen prompt (lección 1.3).</li></ol>"}],interactive:"decide",lab:{title:"Explorar Model Garden y probar una API preentrenada",time:"60 min",cost:"Muy bajo (centavos de dólar con uso de práctica).",steps:[["Preparar el proyecto","En la consola de Google Cloud, crea un proyecto nuevo llamado <code>curso-ia-TUNOMBRE</code> y verifica que tenga una cuenta de facturación asociada. Luego, en <b>Facturación → Presupuestos y alertas</b>, crea un presupuesto de USD 20 con alertas al 50 %, 90 % y 100 %."],["Abrir Model Garden","En el buscador superior de la consola escribe <b>Model Garden</b> y abre el resultado. Si es la primera vez, acepta habilitar la API que solicita."],["Leer una ficha de modelo","Abre la ficha de un modelo Gemini reciente. Anota en tu bitácora: ventana de contexto, tipos de entrada que acepta, regiones disponibles y dónde se consultan los precios."],["Comparar dos modelos",'Prueba el mismo prompt en dos modelos disponibles (por ejemplo, una versión "Flash" y una "Flash-Lite") desde Agent Studio: <i>"Resume en 3 viñetas la política de vacaciones: 15 días hábiles por año, solicitud con 15 días de anticipación, máximo dos periodos acumulados."</i> Compara calidad y tiempo de respuesta.'],["Probar una API preentrenada",'Abre <b>Cloud Shell</b> (la terminal de comandos que Google Cloud abre en el navegador; ícono de terminal arriba a la derecha) y ejecuta:<pre>gcloud services enable language.googleapis.com\ngcloud ml language analyze-sentiment \\\n  --content="El soporte de Nordia resolvió mi problema rapidísimo, excelente servicio."</pre>Observa el puntaje (score) y la magnitud del sentimiento. Repite con una frase negativa.'],["Conclusión","En tu bitácora, responde: ¿para qué casos de Nordia usarías la API de lenguaje y para cuáles un modelo Gemini? Justifica con costo, control y calidad."]],check:"El participante entrega su bitácora con la ficha de un modelo, la comparación de dos modelos y el resultado del análisis de sentimiento.",cleanup:"No se crean recursos con costo fijo. Mantén el proyecto para los siguientes laboratorios."},glossary:[["Model Garden","Catálogo de modelos de Google Cloud con fichas, pruebas y código de ejemplo."],["Agent Studio","Diseñador visual de bajo código para probar prompts y agentes (antes Vertex AI Studio)."],["Ventana de contexto","Cantidad máxima de tokens que un modelo puede recibir en una sola consulta."],["API preentrenada","Servicio listo para usar que realiza una tarea concreta sin entrenamiento propio."]],quiz:[["Nordia necesita extraer automáticamente proveedor, fecha y total de facturas escaneadas. ¿Por dónde empezar?",["Entrenar un modelo propio desde cero","Document AI, una API preentrenada para documentos","Gemini Enterprise"],1,"Si existe una API especializada para la tarea, suele ser la opción más rápida y predecible."],["¿Dónde se comparan fichas de modelos, precios y capacidades?",["Model Garden","Cloud Storage","IAM"],0,"Model Garden es el catálogo de modelos."],["¿Cuál es el nombre actual de Vertex AI?",["Gemini Enterprise Agent Platform","Agent Search","Model Armor"],0,"Cambio anunciado en Google Cloud Next '26."],["Gemini Enterprise está pensado principalmente para…",["Entrenar modelos tabulares","Usuarios de negocio que usan asistentes, búsqueda y agentes sin código","Administrar redes"],1,"Es la aplicación orientada a empleados."]],instructor:{timing:[["Repaso y nombres nuevos",20],["Mapa en cuatro capas",35],["Model Garden y criterios",25],["Árbol de decisión (actividad)",20],["Laboratorio",60],["Puesta en común",20]],keys:["Presupuesto con alertas ANTES de cualquier laboratorio.",'Insistir en "la API más simple que resuelva el problema".'],errors:["Proyecto sin facturación: la consola pide habilitar facturación al abrir Model Garden.","API no habilitada: el comando de gcloud muestra un error y sugiere habilitarla; repetir el primer comando.","Cambios de interfaz: si un menú cambió de nombre, usar el buscador superior de la consola."]}},{id:"1.3",hours:3,title:"Prompts, parámetros y costos",sub:"Instrucciones del sistema, temperatura, tokens y cómo estimar el costo por consulta.",objectives:["Escribir prompts estructurados con instrucciones del sistema, contexto, tarea y formato de salida.","Ajustar temperatura y límite de tokens según el tipo de tarea.","Contar tokens y estimar el costo mensual de un caso de uso."],blocks:[{h:"Anatomía de un buen prompt",html:'<p>Un prompt profesional tiene cuatro partes. Separarlas mejora la calidad y facilita mantenerlo:</p><ol><li><b>Instrucción del sistema</b> (system instruction): el rol y las reglas permanentes. <i>"Eres el asistente de RR. HH. de Nordia. Respondes solo con base en las políticas entregadas. Si no sabes, lo dices."</i></li><li><b>Contexto:</b> la información que el modelo necesita (una política, un correo, datos).</li><li><b>Tarea:</b> qué hacer, en una frase clara con un verbo.</li><li><b>Formato de salida:</b> cómo quieres la respuesta (viñetas, tabla, JSON con campos definidos).</li></ol><div class="tip">💡 Dar 1 a 3 ejemplos de entrada y salida esperada (few-shot) suele mejorar mucho la consistencia en tareas de extracción y clasificación.</div>'},{h:"Parámetros que sí importan",html:'<table class="tbl"><tr><th>Parámetro</th><th>Qué controla</th><th>Recomendación</th></tr><tr><td><b>Temperatura</b></td><td>Cuánta variación tiene la respuesta</td><td><b>Con Gemini 3 y posteriores:</b> Google recomienda dejarla en su valor por defecto (1,0); bajarla puede causar respuestas en bucle o de menor calidad. La consistencia se logra con instrucciones claras, un esquema de salida y el nivel de razonamiento. <b>Con otros modelos:</b> baja para extraer o clasificar, más alta para lluvia de ideas.</td></tr><tr><td><b>Nivel de razonamiento</b> (thinking_level)</td><td>Cuánto "piensa" el modelo antes de responder</td><td>Bajo para tareas simples (más rápido y barato); alto para problemas complejos. Los tokens de razonamiento se cobran como salida.</td></tr><tr><td><b>Esquema de salida</b> (response_schema)</td><td>Obliga a responder en un formato JSON exacto</td><td>Úsalo siempre que la respuesta la vaya a leer otro sistema.</td></tr><tr><td><b>Máximo de tokens de salida</b></td><td>Largo máximo de la respuesta</td><td>Limítalo para controlar el costo, pero deja margen: en modelos que razonan, el razonamiento también consume este límite y una cifra muy baja deja la respuesta cortada o vacía.</td></tr><tr><td><b>Top-p / Top-k</b></td><td>Entre cuántas opciones de palabra elige el modelo</td><td>Normalmente se dejan por defecto y se ajusta la temperatura.</td></tr></table>'},{h:"Tokens y costo: la cuenta que nadie hace",html:'<p>Los modelos cobran por <b>tokens de entrada</b> (lo que envías: instrucciones, contexto y pregunta) y <b>tokens de salida</b> (lo que responde, más los <b>tokens de razonamiento</b> en modelos que "piensan"), normalmente a precios distintos por cada millón de tokens. Los precios cambian y dependen del modelo, así que <b>siempre se consultan en la página oficial de precios</b> antes de estimar.</p><p>Fórmula mensual:</p><pre>costo_mes = consultas_mes × ( tokens_entrada × precio_entrada\n                           + (tokens_salida + tokens_razonamiento) × precio_salida ) ÷ 1.000.000</pre><p>El error más común es olvidar que el <b>contexto se envía en cada consulta</b>: si cada pregunta lleva 5 páginas de política, se pagan esas páginas miles de veces. Por eso RAG (enviar solo los fragmentos relevantes) también es una estrategia de ahorro.</p>'},{h:"Seguridad básica desde el primer prompt",html:"<ul><li>No envíes datos personales o secretos si la tarea no los necesita.</li><li>No confíes en que una instrucción del sistema basta para bloquear abusos: existe la <b>inyección de prompt</b> (prompt injection: instrucciones maliciosas escondidas en el texto). Se aborda con capas de defensa en el Módulo 4.</li><li>Pide formatos estructurados (JSON: formato de datos que los programas leen fácilmente) cuando la salida la consuma otro sistema, y valídala.</li></ul>"}],interactive:"cost",lab:{title:"Prompts de extracción de datos con el SDK de Gen AI",time:"75 min",cost:"Muy bajo (centavos de dólar).",steps:[["Preparar Cloud Shell","Abre Cloud Shell en tu proyecto y ejecuta (crea un entorno de Python aislado e instala el SDK, el kit de desarrollo de Google):<pre>gcloud services enable aiplatform.googleapis.com\npython3 -m venv ~/lab13 && source ~/lab13/bin/activate\npip install --upgrade google-genai\nexport GOOGLE_CLOUD_PROJECT=$(gcloud config get-value project)\nexport GOOGLE_CLOUD_LOCATION=global\nexport GOOGLE_GENAI_USE_ENTERPRISE=True</pre>La última variable indica que se usará Agent Platform (en documentación anterior aparece como <code>GOOGLE_GENAI_USE_VERTEXAI</code>)."],["Elegir el modelo","En Model Garden copia el identificador (ID) de un modelo Gemini vigente. En noviembre de 2026 la documentación oficial usa <code>gemini-3.8-flash</code>; los modelos 2.5 se retiraron en octubre de 2026. Guárdalo en una variable:<pre>export MODEL_ID=gemini-3.8-flash   # verifica que siga vigente</pre>Si cierras Cloud Shell, repite los comandos <code>export</code> y <code>source</code> antes de continuar."],["Primera llamada",'Crea el archivo <code>extraer.py</code> con el editor de Cloud Shell:<pre>import os\nfrom google import genai\nfrom google.genai import types\nfrom pydantic import BaseModel\n\nclass Factura(BaseModel):\n    proveedor: str | None\n    contacto: str | None\n    factura: str | None\n    monto: float | None\n    moneda: str | None\n    vencimiento: str | None\n\nclient = genai.Client()  # usa las variables de entorno\nmodelo = os.environ["MODEL_ID"]\n\ncorreo = """Hola, soy Laura Pérez de Suministros Andes.\nLa factura FA-2291 por USD 1.240 vence el 30 de noviembre.\nGracias por confirmar el pago."""\n\nr = client.models.generate_content(\n    model=modelo,\n    contents=f"Extrae los datos del correo.\\n\\nCorreo:\\n{correo}",\n    config=types.GenerateContentConfig(\n        system_instruction=(\n            "Eres un asistente de cuentas por pagar. Extrae los datos del correo. "\n            "El monto va como número con punto decimal y sin separador de miles "\n            "(ej.: 1240.00). Si un dato no aparece, usa null."),\n        response_mime_type="application/json",\n        response_schema=Factura,\n        thinking_config=types.ThinkingConfig(thinking_level="low"),\n        max_output_tokens=2048,\n    ),\n)\nprint(r.text)\nprint(r.usage_metadata)</pre>Ejecuta <code>python extraer.py</code>. Observa que no se modifica la temperatura: con Gemini 3 se deja en su valor por defecto y la consistencia la da el esquema.'],["Leer el consumo","En la salida, <code>usage_metadata</code> muestra los tokens del prompt (<code>prompt_token_count</code>), de la respuesta (<code>candidates_token_count</code>) y de razonamiento (<code>thoughts_token_count</code>). Anótalos: son la base de la estimación de costo."],["Experimentar con el razonamiento",'Cambia <code>thinking_level</code> a <code>"high"</code> y ejecuta 3 veces. Compara el tiempo de respuesta y los tokens de razonamiento con <code>"low"</code>. ¿Mejoró el resultado en una tarea tan simple? Registra la conclusión: el nivel de razonamiento se elige según la complejidad, porque cuesta.'],["Contar tokens antes de enviar",'Agrega al final del archivo (cuenta los tokens sin generar respuesta):<pre>t = client.models.count_tokens(model=modelo, contents=correo)\nprint("Tokens del correo:", t.total_tokens)</pre>'],["Estimación de costo","Con los precios vigentes de la página oficial y el simulador de esta lección, calcula el costo mensual de procesar 20.000 correos de proveedores, incluidos los tokens de razonamiento."]],check:"Entregar el JSON obtenido, la tabla de tokens por ejecución (entrada, salida y razonamiento), la conclusión sobre el nivel de razonamiento y la estimación mensual con la fuente y la fecha del precio usado.",cleanup:"No quedan recursos activos. Ejecuta <code>deactivate</code> y cierra Cloud Shell."},glossary:[["System instruction (instrucción del sistema)","Reglas y rol permanentes que guían todas las respuestas del modelo."],["Temperatura","Parámetro que controla la variabilidad de la respuesta. Con Gemini 3 se recomienda dejarla en su valor por defecto."],["Tokens de razonamiento (thinking)",'Tokens que el modelo usa para "pensar" antes de responder; se cobran como salida.'],["SDK","Kit de desarrollo: librería que facilita usar un servicio desde un lenguaje de programación."],["Few-shot","Técnica de incluir pocos ejemplos de entrada y salida en el prompt."],["Prompt injection (inyección de prompt)","Ataque que esconde instrucciones maliciosas en el texto que procesa el modelo."]],quiz:[["Con un modelo Gemini 3, ¿cómo logras que la extracción de datos de facturas sea consistente?",["Bajando la temperatura a 0","Dejando la temperatura por defecto y usando instrucciones claras con un esquema de salida JSON","Subiendo el máximo de tokens a 10"],1,"Google recomienda no bajar la temperatura en Gemini 3; la consistencia viene del esquema y de las instrucciones."],["¿Qué tokens se cobran?",["Solo los de la respuesta","Los de entrada, los de salida y los de razonamiento (estos últimos como salida)","Solo los de la instrucción del sistema"],1,"Se cobran todos; el razonamiento se factura al precio de salida."],["¿Por qué RAG también ahorra dinero?",["Porque usa modelos gratis","Porque envía solo los fragmentos relevantes y no documentos completos en cada consulta","Porque no usa tokens"],1,"Menos tokens de entrada por consulta = menor costo."],["¿Dónde se consultan los precios para una estimación?",["En un blog","En la página oficial de precios de Google Cloud","Se adivinan"],1,"Los precios cambian; siempre se toma la fuente oficial y se anota la fecha."]],instructor:{timing:[["Anatomía del prompt (demo en vivo)",30],["Parámetros, razonamiento y esquemas",20],["Tokens y costos con el simulador",30],["Seguridad básica",15],["Laboratorio",75],["Cierre",10]],keys:["Mostrar la misma tarea con un prompt pobre y uno estructurado.",'Aclarar que la regla de "temperatura baja" circula mucho en internet pero no aplica a Gemini 3.',"Hacer la estimación de costo en voz alta con precios del día."],errors:["Error de permisos o API no habilitada: revisar el primer comando del laboratorio.","ID de modelo inexistente o retirado (error 404): copiarlo de nuevo desde Model Garden; Google retira modelos con fecha anunciada.","Error KeyError: MODEL_ID: Cloud Shell se reinició; repetir los comandos export y source.","Respuesta vacía o cortada: el límite de tokens es muy bajo para el razonamiento; subir max_output_tokens.","Montos mal interpretados (1.240 leído como 1,24): reforzar en la instrucción el formato numérico esperado; es un buen punto para discutir formatos regionales."]}},{id:"1.4",hours:4,title:"Cómo se desarrolla un modelo",sub:"Datos, entrenamiento, evaluación; modelo preentrenado vs AutoML vs entrenamiento propio.",objectives:["Describir el ciclo de vida de un modelo de ML de punta a punta.","Separar datos de entrenamiento y de evaluación y leer métricas básicas de clasificación.","Entrenar, evaluar y usar un modelo con BigQuery ML."],blocks:[{h:"El ciclo de vida en seis pasos",html:"<ol><li><b>Definir el problema</b> y la métrica de éxito de negocio (ej.: detectar el 70 % de los clientes que cancelarán).</li><li><b>Reunir y preparar datos:</b> limpiar, unir fuentes y crear características útiles.</li><li><b>Entrenar</b> con una parte de los datos.</li><li><b>Evaluar</b> con datos que el modelo no vio.</li><li><b>Desplegar</b> para que otros sistemas lo usen.</li><li><b>Monitorear</b> y reentrenar: los datos del mundo real cambian (deriva o drift) y el desempeño del modelo se degrada con el tiempo.</li></ol>"},{h:"Tres caminos para obtener un modelo",html:'<table class="tbl"><tr><th>Camino</th><th>Cuándo usarlo</th><th>Esfuerzo</th></tr><tr><td><b>Modelo preentrenado / fundacional</b></td><td>La tarea es general (lenguaje, visión) y basta con buenos prompts o RAG</td><td>Bajo</td></tr><tr><td><b>AutoML o BigQuery ML</b></td><td>Tienes datos propios etiquetados y quieres un buen modelo sin diseñar la red neuronal ni el algoritmo a mano</td><td>Medio</td></tr><tr><td><b>Entrenamiento personalizado</b></td><td>Requisitos muy específicos, gran volumen de datos y un equipo de ciencia de datos</td><td>Alto</td></tr></table>'},{h:"Evaluar un clasificador sin perderse",html:'<p>En un problema de sí/no (¿comprará?) cada predicción cae en una de cuatro casillas de la <b>matriz de confusión</b>: verdaderos positivos, falsos positivos, falsos negativos y verdaderos negativos. De ahí salen las métricas:</p><ul><li><b>Exactitud (accuracy):</b> porcentaje total de aciertos. Engaña cuando los casos positivos son pocos.</li><li><b>Precisión (precision):</b> de los que el modelo marcó como "sí", cuántos lo eran.</li><li><b>Exhaustividad (recall):</b> de todos los "sí" reales, cuántos encontró el modelo.</li><li><b>ROC AUC:</b> qué tan bien separa ambas clases en general (1 es perfecto; 0,5 es azar).</li></ul><div class="tip">💡 Si solo 2 de cada 100 visitantes compran, un modelo que siempre dice "no comprará" tiene 98 % de exactitud y no sirve para nada. Por eso se miran precisión y exhaustividad.</div>'},{h:"BigQuery ML: modelos con SQL",html:"<p>BigQuery ML permite crear, evaluar y usar modelos con sentencias SQL, directamente donde están los datos. El modelo de este laboratorio es una <b>regresión logística</b> (logistic_reg): un algoritmo clásico que calcula la probabilidad de un resultado sí/no. Las tres instrucciones clave son <code>CREATE MODEL</code> (entrenar), <code>ML.EVALUATE</code> (evaluar) y <code>ML.PREDICT</code> (predecir). Es ideal para analistas que ya conocen SQL y para prototipos rápidos.</p>"}],interactive:"confusion",lab:{title:"Primer modelo con BigQuery ML: ¿qué visitantes comprarán?",time:"90 min",cost:"Bajo. BigQuery cobra por los datos que lee; el filtro de fechas (_TABLE_SUFFIX) y seleccionar solo las columnas necesarias reducen lo leído. Ojo: LIMIT no reduce los datos leídos.",steps:[["Crear el conjunto de datos","En la consola abre <b>BigQuery</b>. En el panel Explorador, junto al nombre de tu proyecto, abre el menú (⋮) → <b>Crear conjunto de datos</b> (dataset: el contenedor de tablas y modelos). Nombre: <code>bqml_lab</code>, ubicación: <b>US (multirregión, es decir, varios centros de datos de EE. UU.)</b>, porque el conjunto público de práctica está allí."],["Entrenar el modelo","En el editor de consultas ejecuta:<pre>CREATE OR REPLACE MODEL `bqml_lab.sample_model`\nOPTIONS(model_type='logistic_reg') AS\nSELECT\n  IF(totals.transactions IS NULL, 0, 1) AS label,\n  IFNULL(device.operatingSystem, \"\") AS os,\n  device.isMobile AS is_mobile,\n  IFNULL(geoNetwork.country, \"\") AS country,\n  IFNULL(totals.pageviews, 0) AS pageviews\nFROM `bigquery-public-data.google_analytics_sample.ga_sessions_*`\nWHERE _TABLE_SUFFIX BETWEEN '20160801' AND '20170630';</pre>Las tablas de este conjunto público están separadas por día; <code>_TABLE_SUFFIX</code> filtra los días a usar e <code>IFNULL</code> reemplaza los valores vacíos. Espera a que termine (unos minutos). Abre el modelo en el Explorador y revisa la pestaña de entrenamiento."],["Evaluar","Con datos de un periodo distinto (que el modelo no vio):<pre>SELECT *\nFROM ML.EVALUATE(MODEL `bqml_lab.sample_model`, (\n  SELECT\n    IF(totals.transactions IS NULL, 0, 1) AS label,\n    IFNULL(device.operatingSystem, \"\") AS os,\n    device.isMobile AS is_mobile,\n    IFNULL(geoNetwork.country, \"\") AS country,\n    IFNULL(totals.pageviews, 0) AS pageviews\n  FROM `bigquery-public-data.google_analytics_sample.ga_sessions_*`\n  WHERE _TABLE_SUFFIX BETWEEN '20170701' AND '20170801'));</pre>Anota precision, recall, accuracy y roc_auc. Interprétalas con lo visto en la lección."],["Predecir compras por país","<pre>SELECT country, SUM(predicted_label) AS compras_previstas\nFROM ML.PREDICT(MODEL `bqml_lab.sample_model`, (\n  SELECT\n    IFNULL(device.operatingSystem, \"\") AS os,\n    device.isMobile AS is_mobile,\n    IFNULL(totals.pageviews, 0) AS pageviews,\n    IFNULL(geoNetwork.country, \"\") AS country\n  FROM `bigquery-public-data.google_analytics_sample.ga_sessions_*`\n  WHERE _TABLE_SUFFIX BETWEEN '20170701' AND '20170801'))\nGROUP BY country\nORDER BY compras_previstas DESC\nLIMIT 10;</pre>"],["Reflexión de negocio","Si fueras el gerente comercial, ¿qué decisión tomarías con este resultado? ¿Qué dato adicional pedirías para mejorar el modelo?"]],check:"Entregar captura de las métricas, la interpretación de precision y recall con palabras propias, y la tabla de países con la decisión de negocio propuesta.",cleanup:"Si no seguirás usándolo, elimina el conjunto de datos bqml_lab (menú ⋮ → Eliminar) para no acumular almacenamiento."},glossary:[["Matriz de confusión","Tabla que cruza lo predicho con lo real en un clasificador."],["Precisión (precision)","De lo que el modelo marcó como positivo, qué parte lo era."],["Exhaustividad (recall)","De todos los positivos reales, qué parte encontró el modelo."],["Drift (deriva)","Cambio en la distribución de los datos del mundo real que degrada el desempeño del modelo con el tiempo."],["Regresión logística","Algoritmo clásico que estima la probabilidad de un resultado sí/no."]],quiz:[["¿Por qué se evalúa con datos que el modelo no vio?",["Para que el modelo sea más rápido","Para saber si generaliza y no solo memorizó","Porque BigQuery lo exige"],1,"Evaluar con los mismos datos del entrenamiento da resultados engañosamente buenos."],["En la detección de fraude importa encontrar la mayoría de los fraudes reales. ¿Qué métrica cuidas más?",["Recall (exhaustividad)","Solo la exactitud","La cantidad de columnas"],0,"El recall mide cuántos positivos reales encuentra el modelo."],["¿Qué instrucción de BigQuery ML entrena un modelo?",["ML.PREDICT","CREATE MODEL","ML.EVALUATE"],1,"CREATE MODEL entrena; ML.EVALUATE evalúa; ML.PREDICT predice."],['Un modelo que siempre dice "no comprará" obtiene 98 % de exactitud. ¿Qué significa?',["Que es excelente","Que la exactitud engaña cuando hay pocos positivos","Que hay un error en BigQuery"],1,"Por eso se revisan precisión y exhaustividad."]],instructor:{timing:[["Ciclo de vida",25],["Tres caminos",20],["Métricas con el simulador",35],["BigQuery ML: demo",20],["Laboratorio",90],["Debate de negocio",15],["Evaluación del módulo",20],["Cierre y reto",15]],keys:["El modelo es un medio; la métrica de negocio manda.","Practicar la lectura de métricas con números concretos antes del laboratorio."],errors:["Conjunto de datos creado en una región distinta de US: la consulta falla por ubicación; recrearlo en US.","Olvidar el filtro _TABLE_SUFFIX: lee muchos más datos, cuesta más y tarda más. LIMIT no lo evita.","Confundir precision y recall: usar el ejemplo del fraude."]}}],exam:[["¿Qué tipo de IA redacta un correo de cobro personalizado?",["ML clásico de regresión","IA generativa","Una API de visión","BigQuery ML"],1],['En un modelo que predice compras, ¿qué es "país del visitante"?',["La etiqueta (label)","Una característica (feature)","Un token de salida","Una métrica"],1],["Nordia quiere transcribir llamadas de soporte. Primera opción a evaluar:",["Speech-to-Text","BigQuery ML","Entrenar un modelo propio","Agent Search"],0],["¿Qué servicio es el catálogo de modelos con fichas y pruebas?",["Model Garden","Agent Runtime","Agent Search","Document AI"],0],["Nombre actual de Vertex AI Search:",["Agent Search","Agent Runtime","Agent Studio","Gemini Enterprise"],0],["Nombre actual de Agent Engine:",["Agent Runtime","Agent Search","Agent Studio","Model Garden"],0],["¿Para qué sirve la instrucción del sistema?",["Fijar el rol y las reglas permanentes del modelo","Definir el esquema JSON de salida","Limitar los tokens de salida","Elegir la región del modelo"],0],["Con Gemini 3, para clasificar tickets en categorías fijas de forma consistente conviene…",["Bajar la temperatura a 0","Mantener la temperatura por defecto y usar un esquema de salida con las categorías","Subir la temperatura al máximo","Quitar la instrucción del sistema"],1],["Si cada consulta incluye un documento de 5 páginas, el costo…",["No cambia, el contexto es gratis","Aumenta, porque esos tokens de entrada se pagan en cada consulta","Solo aumenta la primera vez","Baja, porque el modelo responde más corto"],1],["¿Qué es prompt injection?",["Un formato de salida estructurada","Instrucciones maliciosas escondidas en el texto que procesa el modelo","Una técnica de few-shot","Un error de cuota"],1],["¿Qué paso del ciclo de vida detecta la deriva (drift)?",["Monitoreo","Definir el problema","Entrenamiento","Preparación de datos"],0],["La precisión (precision) responde a…",["De lo marcado como positivo, cuánto lo era","De todos los positivos reales, cuántos encontró","El porcentaje total de aciertos","Qué tan bien separa las clases en general"],0],["Un ROC AUC de 0,5 indica…",["Un modelo perfecto","Un desempeño similar al azar","Una precisión del 50 %","Que faltan datos de entrenamiento"],1],["¿Qué instrucción produce predicciones en BigQuery ML?",["ML.PREDICT","CREATE MODEL","ML.EVALUATE","ML.TRAINING_INFO"],0],["¿Qué reduce de verdad los datos que lee (y cobra) una consulta en BigQuery?",["Agregar LIMIT","Filtrar por fechas con _TABLE_SUFFIX y seleccionar solo las columnas necesarias","Ordenar con ORDER BY","Ejecutarla de noche"],1]],rubric:"Rúbrica del reto: elección correcta del servicio (40 %), justificación con criterios de costo, control y calidad (40 %), estimación de costo con fuente y fecha (20 %).",guide:{before:["Verificar que cada participante tenga un proyecto propio con facturación y un presupuesto con alertas (lab 1.2, paso 1).","Revisar en la documentación oficial los nombres de productos y los IDs de modelos vigentes; actualizar las diapositivas si cambiaron.","Ejecutar los tres laboratorios completos el día anterior en un proyecto limpio.","Preparar un proyecto de respaldo propio para las demostraciones por si algún participante tiene bloqueos de cuenta.","Planear pausas de 10 minutos cada 90 minutos dentro de los bloques."],cost:["Los tres laboratorios del módulo tienen un costo muy bajo si se siguen los pasos y se usan los filtros indicados.","Presupuesto sugerido por participante: USD 20 con alertas al 50 %, 90 % y 100 %. Las alertas avisan, no detienen el gasto.","Al final del módulo: eliminar el conjunto de datos bqml_lab si no se usará más."]},challenge:"Reto del módulo: para 5 necesidades de Nordia (predecir cancelaciones, leer facturas, transcribir llamadas, responder preguntas de RR. HH. y traducir contratos), elige el servicio adecuado, justifica en 3 líneas cada uno y estima el orden de magnitud del costo mensual con precios oficiales del día."},

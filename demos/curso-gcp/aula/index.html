 llamada a función",html:'<ol><li>Le describes al modelo las funciones disponibles: nombre, para qué sirve y qué parámetros recibe.</li><li>El usuario pregunta algo que requiere un dato vivo ("¿cuántos días de vacaciones me quedan?").</li><li>El modelo no inventa: responde con una <b>solicitud estructurada</b> para llamar a la función con ciertos parámetros.</li><li>Tu código ejecuta la función contra el sistema real y devuelve el resultado.</li><li>El modelo redacta la respuesta final con ese dato.</li></ol><div class="tip">💡 El modelo nunca ejecuta nada por sí mismo: decide <i>qué</i> llamar; tu código decide si lo ejecuta. Ojo: en el laboratorio el SDK usa la <b>ejecución automática</b>, que corre la función sin pedir aprobación. Para acciones irreversibles se desactiva con <code>automatic_function_calling=types.AutomaticFunctionCallingConfig(disable=True)</code> y tu código revisa la solicitud antes de ejecutarla.</div>'},{h:"Opciones de integración empresarial",html:'<table class="tbl"><tr><th>Opción</th><th>Qué es</th><th>Cuándo</th></tr><tr><td><b>Funciones en código</b></td><td>Funciones de Python que el modelo puede pedir ejecutar</td><td>Prototipos y agentes a la medida</td></tr><tr><td><b>APIs administradas con Apigee</b></td><td>Publicar, asegurar y catalogar las APIs de la empresa (Apigee API hub) para que los agentes las usen con control</td><td>Empresas con muchas APIs y requisitos de gobierno</td></tr><tr><td><b>Servidores MCP</b></td><td>Protocolo estándar para exponer herramientas a cualquier agente compatible; en Agent Platform se registran en Agent Registry</td><td>Herramientas reutilizables entre varios agentes</td></tr><tr><td><b>Webhooks</b></td><td>Avisos automáticos que un sistema envía a una URL cuando ocurre algo (un ticket nuevo, un pago)</td><td>Cuando el agente debe reaccionar a eventos</td></tr></table>'},{h:"Riesgos que hay que controlar",html:"<ul><li><b>Acciones irreversibles:</b> borrar, pagar o enviar correos deben pedir confirmación humana.</li><li><b>Permisos mínimos:</b> la cuenta que usa el agente solo debe poder hacer lo necesario.</li><li><b>Validación:</b> verifica los parámetros que propone el modelo antes de ejecutar.</li><li><b>Inyección de prompt:</b> un texto malicioso podría intentar que el agente llame funciones indebidas; se aborda en el Módulo 4.</li></ul>"}],interactive:"flow",flow:[["👤 Usuario",'"¿Cuántos días de vacaciones me quedan? Mi código es E-1042."'],["🧠 Modelo",'Detecta que necesita un dato vivo y propone: consultar_vacaciones(codigo_empleado="E-1042").'],["🛡 Tu código","Valida el parámetro y los permisos del usuario antes de ejecutar."],["🗄 Sistema de RR. HH.",'Devuelve: {"dias_disponibles": 9, "periodo": "2026"}.'],["🧠 Modelo",'Redacta: "Tienes 9 días de vacaciones disponibles del periodo 2026." Solo usa el dato que devolvió el sistema.'],["✅ Resultado","Dato correcto, trazable y sin inventar."]],lab:{title:'Conectar Gemini al "sistema de RR. HH." de Nordia',time:"75 min",cost:"Muy bajo.",steps:[["Preparar el entorno","En Cloud Shell activa el entorno del laboratorio 2.2 (<code>source ~/lab22/bin/activate</code>) y verifica las variables <code>GOOGLE_CLOUD_PROJECT</code>, <code>GOOGLE_CLOUD_LOCATION</code>, <code>GOOGLE_GENAI_USE_ENTERPRISE</code> y <code>MODEL_ID</code> (repite los <code>export</code> si cerraste la sesión)."],["Crear la función",'Crea <code>rrhh.py</code>. La función simula el sistema de RR. HH.; en producción llamaría a la API real:<pre>import os\nfrom google import genai\nfrom google.genai import types\n\nSALDOS = {"E-1042": 9, "E-2077": 15}\n\ndef consultar_vacaciones(codigo_empleado: str) -> dict:\n    """Devuelve los días de vacaciones disponibles de un empleado de Nordia.\n\n    Args:\n        codigo_empleado: código del empleado, con formato E-0000.\n    """\n    if codigo_empleado not in SALDOS:\n        return {"error": "empleado no encontrado"}\n    return {"dias_disponibles": SALDOS[codigo_empleado], "periodo": "2026"}\n\nclient = genai.Client()\nr = client.models.generate_content(\n    model=os.environ["MODEL_ID"],\n    contents="¿Cuántos días de vacaciones me quedan? Mi código es E-1042.",\n    config=types.GenerateContentConfig(\n        system_instruction="Eres el asistente de RR. HH. de Nordia. Usa las "\n            "herramientas para datos de empleados; nunca inventes saldos.",\n        tools=[consultar_vacaciones]),\n)\nprint(r.text)</pre>Ejecuta <code>python rrhh.py</code>. El SDK ejecuta la función automáticamente cuando el modelo la solicita.'],["Ver la llamada","Agrega al final <code>print(r.automatic_function_calling_history)</code> y vuelve a ejecutar. Identifica en la salida el mensaje donde el modelo pide llamar a la función y el resultado devuelto."],["Probar casos borde",'Cambia la pregunta: código inexistente (E-9999), sin código ("¿cuántos días me quedan?") y una pregunta de política ("¿con cuánta anticipación pido vacaciones?"). Registra qué hace el agente en cada caso.'],["Añadir un control","Modifica la función para que rechace códigos que no cumplan el formato E-0000 y vuelve a probar. Escribe en tu bitácora qué otras validaciones exigirías antes de conectarla a un sistema real."],["Diseño de integración (papel)","Dibuja cómo se conectaría este agente al sistema real de Nordia: ¿función directa, API publicada en Apigee o servidor MCP? ¿Qué webhook usarías para avisar al empleado cuando aprueben su solicitud?"]],check:"Entregar la salida de los 4 casos de prueba, la función con la validación añadida y el diagrama de integración con la justificación de la opción elegida.",cleanup:"Ejecuta <code>deactivate</code>. No quedan recursos con costo."},glossary:[["Function calling (llamada a funciones)","Capacidad del modelo de solicitar la ejecución de una función con parámetros estructurados."],["Apigee API hub","Catálogo centralizado de APIs de la organización, con gobierno y seguridad."],["Webhook","Aviso automático que un sistema envía a una URL cuando ocurre un evento."],["Docstring","Texto de documentación de una función en Python; el SDK lo usa para describirle la función al modelo."]],quiz:[["En function calling, ¿quién ejecuta la función?",["El modelo, dentro de Google","Tu código o el SDK, después de que el modelo la solicita","El usuario final","Nadie, es simulado"],1,"El modelo solo propone; el código ejecuta."],["¿Por qué es importante el docstring de la función?",["Para que el código se vea ordenado","Porque el SDK lo usa para explicarle al modelo qué hace la función y sus parámetros","Porque reduce el costo a cero","Porque cifra los datos"],1,"Una descripción clara mejora cuándo y cómo se llama la función."],["¿Qué acciones deben pedir confirmación humana?",["Consultar un saldo","Acciones irreversibles como pagar o borrar","Saludar","Resumir un texto"],1,"Control humano en acciones con impacto."],["¿Qué es un webhook?",["Un modelo de embeddings","Un aviso automático que un sistema envía a una URL cuando ocurre algo","Un tipo de corpus","Una región de Google Cloud"],1,"Permite que el agente reaccione a eventos."]]}],exam:[["La lista de precios de Nordia cambia cada mes. ¿Qué técnica permite que el asistente la responda bien?",["Fine-tuning mensual","Recuperación (RAG o búsqueda empresarial)","Subir la temperatura","Grounding con Google Search"],1],["¿Qué técnica conviene para responder sobre noticias públicas de hoy?",["Grounding con Google Search","RAG Engine","Fine-tuning","BigQuery ML"],0],["¿Qué es un corpus en RAG Engine?",["Un modelo entrenado","El índice buscable de fragmentos de documentos","Una región","Un tipo de API"],1],["¿Qué parámetro define cuántos fragmentos se entregan al modelo?",["chunk_overlap","top_k","max_output_tokens","display_name"],1],["Un fragmento demasiado grande tiende a…",["Mezclar temas y gastar más tokens","Mejorar siempre la precisión","Reducir el costo","Eliminar las alucinaciones"],0],["¿Qué se debe validar antes de conectar el corpus a la generación?",["La factura","Que la recuperación traiga los fragmentos correctos","La temperatura","El nombre del bucket"],1],['¿Qué opción es "llave en mano" para buscadores internos?',["Agent Search","RAG Engine","Model Garden","Cloud Shell"],0],["Nordia quiere un buscador interno sobre 2.000 PDF en Cloud Storage. En Agent Search, ¿qué creas primero?",["Un corpus de RAG Engine","Un almacén de datos (data store) con esos documentos","Un agente en Agent Studio","Una tabla de BigQuery"],1],["¿Para qué sirve la pestaña Preview de Agent Studio?",["Para registrar la factura del modelo","Para conversar con el agente e inspeccionar herramientas, solicitudes y tokens","Para crear buckets","Para entrenar embeddings"],1],["Un agente de políticas internas tiene Google Search activado y responde con información web. ¿Qué haces?",["Subir la temperatura","Desactivar Google Search y reforzar las instrucciones","Agregar más subagentes","Nada, es correcto"],1],["Un equipo de Finanzas sin programadores quiere automatizar su propio reporte semanal con IA dentro de las herramientas que ya usa la empresa. ¿Qué camino evalúas primero?",["ADK con Python","El constructor sin código de Gemini Enterprise, si la empresa tiene licencia","RAG Engine con un corpus nuevo","Un servidor MCP propio"],1],["En function calling, el modelo…",["Ejecuta la función en tu servidor","Propone la llamada con parámetros y el código la ejecuta","Reescribe la función","Desactiva la seguridad"],1],["¿Qué acción debería requerir confirmación humana?",["Consultar una política","Aprobar un pago","Contar tokens","Buscar un documento"],1],["¿Qué estándar permite exponer herramientas reutilizables a distintos agentes?",["MCP","JSON","SQL","PDF"],0],["Encuentras un tutorial de RAG Engine de 2025 que usa vertexai.rag. ¿Qué haces?",["Lo usas tal cual, siempre funcionará","Lo adaptas al cliente agentplatform, porque vertexai.rag está en desuso","Lo descartas y usas fine-tuning","Cambias a BigQuery ML"],1]],rubric:"Rúbrica del reto: asignación correcta de técnica a cada tipo de pregunta (30 %), fuentes y permisos (20 %), plan de medición de calidad (25 %), controles humanos y de seguridad (25 %).",challenge:"Reto del módulo: diseña el asistente interno de Nordia de punta a punta. Indica qué preguntas responderá con RAG, cuáles con búsqueda empresarial y cuáles con funciones conectadas a sistemas; qué fuentes y permisos usará; cómo medirás la calidad (conjunto de 20 preguntas) y qué acciones requerirán confirmación humana. Entrega un diagrama y una página de justificación."},m3:{id:"m3",n:3,lvl:"Avanzado",color:"#059669",hours:20,title:"Orquestación avanzada y agentes en Python",intro:"Nordia ya tiene prototipos. Ahora necesita agentes que su equipo técnico pueda versionar, probar y mantener. En este módulo se programa con ADK (Agent Development Kit, el kit de código abierto de Google para construir agentes): agentes con herramientas propias, servidores MCP, flujos de trabajo con rutas y ramas paralelas, memoria entre conversaciones y optimización de latencia y costo.",outcomes:["Crear, ejecutar e inspeccionar un agente con ADK desde Cloud Shell, con herramientas en Python.","Conectar un agente a herramientas externas mediante un servidor MCP propio.","Diseñar flujos de trabajo con la API de grafos de ADK 2.0: secuencias, rutas condicionales y ramas paralelas.","Explicar y elegir entre estado de sesión, sesiones persistentes y memoria de largo plazo (Memory Bank).","Medir latencia, tokens y costo de un agente y aplicar reintentos y otras optimizaciones."],prereq:"Módulos 1 y 2. Python intermedio: funciones, tipos (type hints), entornos virtuales y lectura de errores. Proyecto de Google Cloud con facturación, presupuesto con alertas y el rol de usuario de Agent Platform. Los laboratorios se hacen en Cloud Shell.",lessons:[{id:"3.1",hours:4,title:"Anatomía de un agente con ADK",sub:"Modelo, instrucciones y herramientas; estructura del proyecto y pruebas con la interfaz de desarrollo.",objectives:["Describir los componentes de un agente de ADK y el ciclo de eventos de una invocación.","Crear un proyecto de ADK con la estructura correcta y ejecutarlo con adk web y adk run.","Agregar una herramienta en Python e inspeccionar sus llamadas en la interfaz de desarrollo."],blocks:[{h:"Qué es ADK y por qué pasar a código",html:'<p>ADK es un framework (conjunto de librerías y convenciones) de código abierto para construir, probar y desplegar agentes. La versión <b>ADK 2.0 para Python</b> alcanzó disponibilidad general en mayo de 2026. Frente a Agent Studio, el código permite control de versiones con Git, pruebas automáticas, revisiones del equipo y despliegues repetibles: lo que una empresa necesita para producción.</p><div class="tip">💡 El código que Agent Studio genera con <b>Get code</b> (Módulo 2) es un buen punto de partida, pero en este módulo se escribe desde cero para entender cada pieza.</div>'},{h:"Las piezas de un agente",html:'<table class="tbl"><tr><th>Pieza</th><th>Qué define</th><th>Ejemplo en Nordia</th></tr><tr><td><b>name</b></td><td>Identificador único del agente</td><td><code>asistente_rrhh</code></td></tr><tr><td><b>model</b></td><td>El modelo que razona</td><td>Un modelo Gemini vigente</td></tr><tr><td><b>description</b></td><td>Para qué sirve; otros agentes la leen para decidir si le delegan trabajo</td><td>"Responde dudas de RR. HH."</td></tr><tr><td><b>instruction</b></td><td>Comportamiento, límites y formato</td><td>"Nunca inventes saldos…"</td></tr><tr><td><b>tools</b></td><td>Herramientas que puede usar</td><td><code>consultar_vacaciones</code></td></tr></table><p>Un proyecto de ADK es una carpeta (un paquete de Python) con tres archivos: <code>agent.py</code>, que define la variable <code>root_agent</code>; <code>__init__.py</code>, que importa el módulo del agente; y <code>.env</code>, con la configuración del proyecto de Google Cloud. ADK busca exactamente la variable <code>root_agent</code>.</p>'},{h:"El ciclo de una invocación",html:"<p>Cada mensaje del usuario inicia una <b>invocación</b> que produce una secuencia de <b>eventos</b>: el mensaje del usuario, la decisión del modelo de llamar una herramienta, el resultado de la herramienta y la respuesta final. ADK guarda esos eventos en la <b>sesión</b>. La interfaz de desarrollo (<code>adk web</code>) muestra cada evento con su contenido, lo que permite entender y depurar el comportamiento del agente.</p>"},{h:"Herramientas en Python: el contrato",html:"<ul><li>El <b>nombre</b> de la función y su <b>docstring</b> (texto de documentación) le explican al modelo para qué sirve.</li><li>Los <b>tipos</b> de los parámetros (por ejemplo <code>codigo_empleado: str</code>) definen qué datos debe enviar el modelo.</li><li>Devolver un <b>diccionario</b> con un campo de estado (<code>status</code>) ayuda al modelo a distinguir éxito de error.</li><li>Valida siempre los parámetros dentro de la función: el modelo puede equivocarse.</li></ul>"}],interactive:"flow",flowTitle:"Paso a paso de una invocación en ADK",flow:[["👤 Usuario",'"Hola, soy E-1042. ¿Cuántos días de vacaciones me quedan?"'],["🗂 Sesión","ADK registra el mensaje como el primer evento de la invocación."],["🧠 Modelo",'Lee instrucciones, descripción de herramientas e historial; decide llamar consultar_vacaciones(codigo_empleado="E-1042").'],["🛠 Herramienta",'Tu función de Python se ejecuta y devuelve {"status": "ok", "dias_disponibles": 9}.'],["🧠 Modelo","Recibe el resultado como un nuevo evento y redacta la respuesta final."],["✅ Evento final","is_final_response() es verdadero: la interfaz muestra la respuesta y la sesión guarda toda la traza."]],lab:{title:"Primer agente de RR. HH. de Nordia con ADK",time:"90 min",cost:"Bajo: solo consultas al modelo.",steps:[["Preparar el entorno",'En Cloud Shell crea un entorno virtual (venv: espacio aislado para las librerías de Python) e instala ADK:<pre>gcloud services enable aiplatform.googleapis.com\npython3 -m venv ~/lab3 && source ~/lab3/bin/activate\npip install "google-adk>=2.0"\nadk --version</pre>'],["Crear la estructura",'<pre>mkdir -p ~/nordia/asistente && cd ~/nordia\necho "from . import agent" > asistente/__init__.py\ncat > asistente/.env << FIN\nGOOGLE_GENAI_USE_ENTERPRISE=TRUE\nGOOGLE_CLOUD_PROJECT=$(gcloud config get-value project)\nGOOGLE_CLOUD_LOCATION=global\nFIN\ncat asistente/.env</pre>La primera variable indica que se usará Agent Platform (en documentación anterior aparece como GOOGLE_GENAI_USE_VERTEXAI). El bloque <code>cat &lt;&lt; FIN … FIN</code> escribe varias líneas en un archivo de una sola vez.'],["Escribir el agente",'Crea <code>asistente/agent.py</code> con el editor de Cloud Shell:<pre>from google.adk.agents import Agent\n\nSALDOS = {"E-1042": 9, "E-2077": 15}\n\ndef consultar_vacaciones(codigo_empleado: str) -> dict:\n    """Consulta los días de vacaciones disponibles de un empleado de Nordia.\n\n    Args:\n        codigo_empleado: código del empleado con formato E-0000.\n    """\n    codigo = codigo_empleado.strip().upper()\n    if codigo not in SALDOS:\n        return {"status": "error", "mensaje": "Empleado no encontrado"}\n    return {"status": "ok", "dias_disponibles": SALDOS[codigo], "periodo": "2026"}\n\nroot_agent = Agent(\n    name="asistente_rrhh",\n    model="gemini-3.8-flash",  # verifica que siga vigente en Model Garden\n    description="Asistente de Recursos Humanos de Nordia.",\n    instruction=(\n        "Eres el asistente de RR. HH. de Nordia. Para saldos de vacaciones usa "\n        "siempre la herramienta consultar_vacaciones; nunca inventes cifras. "\n        "Si falta el código del empleado, pídelo. Responde en máximo 4 líneas."),\n    tools=[consultar_vacaciones],\n)</pre>'],["Probar en la terminal",'Desde <code>~/nordia</code> ejecuta <code>adk run asistente</code> y escribe: "Soy E-1042, ¿cuántos días me quedan?". Sal con <code>exit</code>.'],["Abrir la interfaz de desarrollo","Desde <code>~/nordia</code> ejecuta <code>adk web --port 8080</code>. En Cloud Shell haz clic en <b>Web Preview</b> (vista previa web, ícono de ventana con ojo) → <b>Preview on port 8080</b>. Elige el agente <code>asistente</code> en el selector."],["Inspeccionar eventos","Conversa con 4 mensajes: con código válido, con código inexistente, sin código y una pregunta fuera de tema. Abre cada evento y localiza la llamada a la función, sus parámetros y su resultado."],["Mejorar la herramienta","Agrega una validación de formato (E seguida de 4 dígitos) que devuelva un error claro. Detén <code>adk web</code> (Ctrl+C), vuelve a iniciarlo y repite las pruebas."]],check:"Entregar agent.py final, capturas de 2 eventos inspeccionados (llamada y resultado de la herramienta) y una tabla con los 4 casos de prueba y el comportamiento observado.",cleanup:"Detén adk web con Ctrl+C. Conserva la carpeta ~/nordia para los siguientes laboratorios."},glossary:[["ADK","Agent Development Kit: framework de código abierto de Google para construir agentes."],["root_agent","Variable que ADK busca en agent.py como punto de entrada del agente."],["Invocación","Todo lo que ocurre desde un mensaje del usuario hasta la respuesta final."],["Evento","Cada paso registrado en una invocación: mensaje, llamada a herramienta, resultado o respuesta."]],quiz:[["¿Qué variable busca ADK en agent.py?",["main_agent","agent","app","root_agent"],3,"ADK carga exactamente root_agent como punto de entrada."],["¿Para qué sirve la description de un agente?",["Para cobrar menos tokens","Para que otros agentes sepan si deben delegarle trabajo","Para elegir la región","Para cifrar la sesión"],1,"En sistemas multiagente, la descripción guía la delegación."],["¿Qué le dice al modelo para qué sirve una herramienta de Python?",["El nombre del archivo agent.py","Los comentarios dentro del cuerpo de la función","El nombre de la función, su docstring y los tipos de sus parámetros","La instrucción del agente únicamente"],2,"Ese es el contrato que el modelo lee."],["¿Qué muestra la interfaz adk web en cada evento?",["Solo la respuesta final","El detalle de mensajes, llamadas a herramientas y resultados","La factura del proyecto","El código fuente de Gemini"],1,"Es la herramienta principal para depurar agentes."]]},{id:"3.2",hours:4,title:"Herramientas y conexiones",sub:"Funciones en Python, especificaciones OpenAPI, servidores MCP y agentes como herramientas.",objectives:["Elegir el tipo de herramienta adecuado para cada integración.","Construir un servidor MCP propio y conectarlo a un agente de ADK con McpToolset.","Restringir qué herramientas expone un servidor y aplicar controles sobre acciones sensibles."],blocks:[{h:"Cuatro formas de dar herramientas a un agente",html:'<table class="tbl"><tr><th>Tipo</th><th>Qué es</th><th>Úsalo cuando</th></tr><tr><td><b>Función de Python</b></td><td>Una función con docstring y tipos</td><td>La lógica vive en el mismo código del agente</td></tr><tr><td><b>OpenAPI</b> (OpenAPIToolset)</td><td>ADK convierte cada operación de una especificación OpenAPI (descripción estándar de una API REST, el estilo más común de APIs web) en una herramienta</td><td>La empresa ya tiene APIs documentadas</td></tr><tr><td><b>MCP</b> (McpToolset)</td><td>El agente se conecta a un servidor MCP y descubre sus herramientas</td><td>Herramientas reutilizables por varios agentes o aplicaciones</td></tr><tr><td><b>Agente como herramienta</b> (AgentTool)</td><td>Un agente especializado se usa como herramienta de otro</td><td>Encapsular una habilidad compleja, por ejemplo un buscador</td></tr></table>'},{h:"MCP en una página",html:'<p>MCP (Model Context Protocol) es un protocolo abierto: un <b>servidor MCP</b> publica herramientas con su descripción y un <b>cliente</b> (el agente) las descubre y las llama. La conexión puede ser local por <b>stdio</b> (el agente lanza el servidor como un proceso) o remota por <b>HTTP</b> (Streamable HTTP). En ADK se usa <code>McpToolset</code> con <code>StdioConnectionParams</code> o <code>StreamableHTTPConnectionParams</code>, y el parámetro <code>tool_filter</code> limita qué herramientas ve el agente.</p><div class="tip">💡 Un servidor MCP bien hecho se escribe una vez y lo usan ADK, Agent Studio (registrado en Agent Registry) u otras aplicaciones compatibles. Es la forma de no reescribir integraciones.</div>'},{h:"Seguridad de herramientas",html:"<ul><li><b>Mínimo privilegio:</b> expón solo las herramientas necesarias (<code>tool_filter</code>) y usa credenciales con permisos mínimos.</li><li><b>Secretos fuera del código:</b> llaves y contraseñas en variables de entorno o Secret Manager (Módulo 4), nunca en <code>agent.py</code>.</li><li><b>Acciones sensibles:</b> crear, pagar o borrar requieren confirmación del usuario o revisión humana; diseña la herramienta para que primero proponga y luego ejecute.</li><li><b>Servidores de terceros:</b> un servidor MCP ajeno puede describir sus herramientas de forma engañosa; revisa su origen antes de conectarlo.</li></ul>"}],interactive:"classify",cases:{title:"¿Qué tipo de herramienta usarías?",labels:["Función de Python","OpenAPI","Servidor MCP","Agente como herramienta"],items:[["Nordia tiene la API de su ERP (sistema de gestión empresarial) documentada con una especificación OpenAPI de 40 operaciones.",1,"OpenAPIToolset genera las herramientas a partir de la especificación."],["Calcular el número de días hábiles entre dos fechas.",0,"Lógica simple y local: una función de Python."],["La mesa de ayuda quiere que tres agentes distintos puedan crear y consultar tickets.",2,"Herramientas compartidas por varios agentes: servidor MCP."],["El asistente necesita a veces investigar en la web con un agente especializado en búsqueda.",3,"Encapsular un agente especializado como herramienta (AgentTool)."],["Conectar el agente al sistema de nómina que ya expone un servidor MCP oficial del proveedor.",2,"Si existe un servidor MCP, se conecta con McpToolset."]]},lab:{title:"Servidor MCP de RR. HH. de Nordia",time:"90 min",cost:"Bajo: solo consultas al modelo.",steps:[["Activar el entorno",'<pre>source ~/lab3/bin/activate && cd ~/nordia\npip install "mcp>=1.24,<2"   # la versión 2 cambió FastMCP de nombre\nmkdir -p asistente_mcp && echo "from . import agent" > asistente_mcp/__init__.py\ncp asistente/.env asistente_mcp/.env</pre>'],["Crear el servidor MCP",'Crea <code>asistente_mcp/servidor_rrhh.py</code>:<pre>from mcp.server.fastmcp import FastMCP\n\nmcp = FastMCP("rrhh-nordia")\nSALDOS = {"E-1042": 9, "E-2077": 15}\nTICKETS = []\n\n@mcp.tool()\ndef consultar_vacaciones(codigo_empleado: str) -> dict:\n    """Consulta los días de vacaciones disponibles de un empleado (código E-0000)."""\n    c = codigo_empleado.strip().upper()\n    if c not in SALDOS:\n        return {"status": "error", "mensaje": "Empleado no encontrado"}\n    return {"status": "ok", "dias_disponibles": SALDOS[c]}\n\n@mcp.tool()\ndef crear_ticket(asunto: str, descripcion: str) -> dict:\n    """Crea un ticket en la mesa de ayuda de Nordia y devuelve su número."""\n    TICKETS.append((asunto, descripcion))\n    return {"status": "ok", "ticket": f"TI-{1000 + len(TICKETS)}"}\n\n@mcp.tool()\ndef borrar_empleado(codigo_empleado: str) -> dict:\n    """Elimina un empleado del sistema (acción administrativa)."""\n    return {"status": "error", "mensaje": "No autorizado"}\n\nif __name__ == "__main__":\n    mcp.run()  # transporte stdio por defecto</pre>'],["Conectar el agente",'Crea <code>asistente_mcp/agent.py</code>:<pre>import os, sys\nfrom google.adk.agents import Agent\nfrom google.adk.tools.mcp_tool import McpToolset\nfrom google.adk.tools.mcp_tool.mcp_session_manager import StdioConnectionParams\nfrom mcp import StdioServerParameters\n\nSERVIDOR = os.path.join(os.path.dirname(os.path.abspath(__file__)), "servidor_rrhh.py")\n\nroot_agent = Agent(\n    name="asistente_mcp",\n    model="gemini-3.8-flash",\n    instruction=("Eres el asistente de RR. HH. y mesa de ayuda de Nordia. Usa las "\n                 "herramientas disponibles; antes de crear un ticket, confirma el "\n                 "asunto con el usuario."),\n    tools=[McpToolset(\n        connection_params=StdioConnectionParams(\n            server_params=StdioServerParameters(command=sys.executable, args=[SERVIDOR])),\n        tool_filter=["consultar_vacaciones", "crear_ticket"],\n    )],\n)</pre>Observa que <code>borrar_empleado</code> existe en el servidor pero no se expone al agente.'],["Probar",'Desde <code>~/nordia</code> ejecuta <code>adk web --port 8080</code> y elige <code>asistente_mcp</code>. Pide: tu saldo de vacaciones, crear un ticket porque el portátil no enciende y "borra al empleado E-2077". Revisa los eventos: ¿qué herramientas vio el agente?'],["Quitar el filtro (experimento controlado)","Elimina temporalmente la línea <code>tool_filter</code>, reinicia y repite la petición de borrado. Anota la diferencia y vuelve a poner el filtro. Conclusión: lo que no se expone no se puede pedir."],["Reflexión de diseño","En tu bitácora: ¿cómo publicarías este servidor para que lo usen otros agentes (stdio local o HTTP remoto en Cloud Run, el servicio de Google para ejecutar aplicaciones en contenedores sin administrar servidores)? ¿Qué autenticación exigirías?"]],check:"Entregar servidor_rrhh.py, agent.py, capturas de los eventos de las tres peticiones con y sin filtro, y la reflexión de diseño.",cleanup:"Detén adk web. No quedan recursos en la nube."},glossary:[["McpToolset","Clase de ADK que conecta un agente a un servidor MCP y expone sus herramientas."],["stdio","Conexión local en la que el agente lanza el servidor y se comunican por entrada y salida estándar."],["tool_filter","Lista que limita qué herramientas de un servidor puede ver el agente."],["OpenAPI","Formato estándar para describir APIs REST: rutas, parámetros y respuestas."]],quiz:[["Tres agentes distintos deben usar las mismas herramientas de la mesa de ayuda. ¿Qué conviene?",["Copiar la función en cada agente","Un servidor MCP compartido","Un prompt más largo","Fine-tuning"],1,"MCP permite reutilizar herramientas entre agentes y aplicaciones."],["¿Para qué sirve tool_filter?",["Para filtrar el contenido de las respuestas","Para elegir qué servidor MCP usar","Para limitar qué herramientas del servidor ve el agente","Para limitar cuántas veces se llama una herramienta"],2,"Aplica el principio de mínimo privilegio."],["¿Dónde deben ir las llaves y contraseñas de una integración?",["En el docstring","En variables de entorno o Secret Manager, nunca en el código","En la instrucción del agente","En el nombre del agente"],1,"Los secretos no se escriben en agent.py."],["¿Qué hace OpenAPIToolset?",["Crea una base vectorial","Convierte operaciones de una especificación OpenAPI en herramientas","Despliega el agente","Traduce el agente a otro idioma"],1,"Reutiliza APIs ya documentadas."]]},{id:"3.3",hours:5,title:"Sistemas multiagente y flujos complejos",sub:"Delegación entre agentes, la API de grafos de ADK 2.0 (secuencias, rutas y ramas paralelas) y comunicación A2A.",objectives:["Distinguir delegación dinámica entre agentes de flujos de trabajo deterministas.","Construir un flujo con la API Workflow de ADK 2.0 con nodos de función, nodos de agente y rutas condicionales.","Explicar cuándo exponer o consumir agentes remotos mediante el protocolo A2A."],blocks:[{h:"Dos formas de coordinar agentes",html:'<table class="tbl"><tr><th></th><th>Delegación dinámica</th><th>Flujo de trabajo (grafo)</th></tr><tr><td>Quién decide el camino</td><td>El modelo, leyendo las descripciones de los subagentes (<code>sub_agents</code>)</td><td>Tú, al definir nodos y rutas</td></tr><tr><td>Predecible</td><td>Menos</td><td>Más: el camino es explícito y auditable</td></tr><tr><td>Ideal para</td><td>Conversaciones abiertas con varios especialistas</td><td>Procesos de negocio con reglas: aprobaciones, extracción, validación</td></tr></table>'},{h:"La API de grafos de ADK 2.0",html:'<p>ADK 2.0 introdujo <code>Workflow</code>: un grafo donde funciones de Python y agentes son <b>nodos</b> unidos por <b>aristas</b> (edges). Reglas clave:</p><ul><li>Una <b>tupla</b> lista nodos en orden: <code>(START, a, b, c)</code>.</li><li>Una <b>tupla anidada</b> ejecuta en paralelo: <code>(START, a, (b, c))</code>; para unir ramas se usa un <code>JoinNode</code>.</li><li>Un <b>diccionario</b> es un mapa de rutas: el nodo anterior emite <code>Event(route="aprobar")</code> y el flujo sigue por esa rama.</li><li><code>START</code> se importa de <code>google.adk.workflow</code>.</li><li>Los agentes dentro de un flujo suelen usar <code>mode="single_turn"</code> (responden una sola vez con lo que reciben, sin seguir conversando); el esquema de salida de un nodo debe coincidir con el de entrada del siguiente.</li><li>Los ciclos sin condición están prohibidos; la repetición se logra con una ruta de regreso condicionada.</li></ul><div class="tip">⚠ En ADK 2.0 para Python, las clases <code>SequentialAgent</code>, <code>ParallelAgent</code> y <code>LoopAgent</code> están en desuso: siguen funcionando con un aviso, pero se eliminarán. Muchos tutoriales en internet todavía las usan; en proyectos nuevos se usa <code>Workflow</code>. Limitación actual: un Workflow todavía no puede usarse como subagente de un agente normal.</div>'},{h:"Ejemplo: ramas paralelas con unión",html:'<pre>from google.adk import Workflow\nfrom google.adk.workflow import JoinNode, START\n\ndef contar_palabras(node_input: str) -> int:\n    return len(node_input.split())\n\ndef mayusculas(node_input: str) -> str:\n    return node_input.upper()\n\nunion = JoinNode(name="union")\n\ndef reporte(node_input: dict) -> str:\n    return f"{node_input[\'mayusculas\']} ({node_input[\'contar_palabras\']} palabras)"\n\nroot_agent = Workflow(\n    name="ejemplo_paralelo",\n    edges=[(START, (contar_palabras, mayusculas), union, reporte)],\n)</pre><div class="tip">Nota didáctica: en el laboratorio las reglas simplifican la política POL-02 (donde el líder aprueba todas las solicitudes): el flujo pre-valida y enruta, y el líder decide.</div><p>Las dos funciones corren en paralelo; el <code>JoinNode</code> espera a ambas y entrega sus resultados al nodo <code>reporte</code>.</p>'},{h:"A2A: agentes que hablan con agentes",html:'<p>A2A (Agent2Agent) es un protocolo abierto para que agentes de distintos equipos, lenguajes o proveedores colaboren a través de la red. Con ADK un agente puede exponerse como servicio A2A o consumir un agente remoto como si fuera un subagente. Agent Studio también permite desplegar agentes como A2A. En ADK requiere instalar el extra <code>pip install "google-adk[a2a]"</code>. Úsalo cuando el agente de otra área (por ejemplo, Finanzas) ya existe y no conviene copiar su lógica.</p>'}],interactive:"router",lab:{title:"Flujo de aprobación de vacaciones con Workflow (ADK 2.0)",time:"120 min",cost:"Bajo: consultas al modelo.",steps:[["Crear el proyecto",'<pre>source ~/lab3/bin/activate && cd ~/nordia\nmkdir -p flujo && echo "from . import agent" > flujo/__init__.py\ncp asistente/.env flujo/.env</pre>'],["Definir el flujo",'Crea <code>flujo/agent.py</code>:<pre>from datetime import date\nfrom pydantic import BaseModel\nfrom google.adk import Agent, Event, Workflow\nfrom google.adk.workflow import START\n\nMODELO = "gemini-3.8-flash"\n\nclass Solicitud(BaseModel):  # pydantic: define la estructura de datos que el extractor debe devolver\n    empleado: str\n    dias: int\n    dias_anticipacion: int\n\nextractor = Agent(\n    name="extractor", model=MODELO, mode="single_turn",\n    instruction=(f"Hoy es {date.today().isoformat()}. Extrae de la solicitud de vacaciones "\n                 "el nombre del empleado, los días pedidos y con cuántos días de "\n                 "anticipación se solicita. Si dice una fecha relativa (la otra semana), "\n                 "calcula los días desde hoy."),\n    output_schema=Solicitud,\n)\n\ndef reglas(node_input: Solicitud):\n    s = node_input\n    resumen = f"{s.empleado} pide {s.dias} días con {s.dias_anticipacion} días de anticipación."\n    if s.dias_anticipacion < 15:\n        return Event(route="rechazar", output=resumen + " La política exige 15 días.")\n    if s.dias > 10:\n        return Event(route="revisar", output=resumen + " Supera 10 días: requiere revisión especial del líder (la política recomienda 30 días de anticipación).")\n    return Event(route="aprobar", output=resumen + " Cumple la política: se envía al líder para su aprobación final.")\n\naprobar = Agent(name="aprobar", model=MODELO, mode="single_turn",\n    instruction="Redacta un mensaje breve y cordial al empleado: su solicitud cumple la política y fue enviada a su líder para la aprobación final.")\nrevisar = Agent(name="revisar", model=MODELO, mode="single_turn",\n    instruction="Redacta un mensaje breve al líder pidiendo revisar la solicitud.")\nrechazar = Agent(name="rechazar", model=MODELO, mode="single_turn",\n    instruction="Explica con amabilidad por qué no se puede aprobar y qué debe hacer.")\n\nroot_agent = Workflow(\n    name="flujo_vacaciones",\n    edges=[(START, extractor, reglas,\n            {"aprobar": aprobar, "revisar": revisar, "rechazar": rechazar})],\n)</pre>'],["Ejecutar y observar",'Ejecuta <code>adk web --port 8080</code>, elige <code>flujo</code> y prueba: "Soy Ana, quiero 5 días y lo pido con 20 días de anticipación"; "Soy Luis, quiero 12 días, con 30 días de anticipación"; "Soy Marta, necesito 3 días la otra semana". Revisa en los eventos por qué ruta pasó cada solicitud.'],["Cambiar una regla","Nordia decide que más de 10 días requieren 30 días de anticipación. Modifica solo la función <code>reglas</code> y prueba de nuevo. Observa que no tocaste ningún prompt: las reglas de negocio viven en código verificable."],["Reto: rama paralela","Opcional avanzado: después de aprobar, genera en paralelo el mensaje al empleado y una nota para nómina, y únelos con un <code>JoinNode</code> (usa el ejemplo de la lección como guía)."],["Comparar enfoques","En tu bitácora: ¿qué pasaría si le dieras a un solo agente toda la política y le pidieras decidir? Compara predictibilidad, auditoría y costo frente al flujo."]],check:"Entregar agent.py con la regla modificada, capturas de las tres rutas (aprobar, revisar, rechazar) y la comparación escrita.",cleanup:"Detén adk web. No quedan recursos en la nube."},glossary:[["Workflow","Clase de ADK 2.0 que define un flujo de trabajo como un grafo de nodos y aristas."],["Nodo","Paso del flujo: una función de Python o un agente."],["JoinNode","Nodo que espera a varias ramas paralelas y combina sus resultados."],["A2A","Agent2Agent: protocolo abierto para que agentes colaboren por la red."]],quiz:[["Un proceso de aprobación con reglas fijas y auditoría obligatoria se modela mejor con…",["Delegación dinámica entre subagentes","Un solo agente con la política completa en la instrucción","Un flujo de trabajo (grafo) con rutas explícitas","Un agente con memoria de largo plazo"],2,"El grafo hace el camino explícito y auditable."],["En la API Workflow, ¿qué representa una tupla anidada como (START, a, (b, c))?",["Un error","Que b y c se ejecutan en paralelo después de a","Que b se ejecuta dos veces","Un ciclo"],1,"Las tuplas anidadas son ramas paralelas."],["¿Cómo elige un nodo la rama siguiente?",["Por el orden en que se escribieron las ramas",'Emitiendo Event(route="…") que coincide con una clave del mapa de rutas',"El modelo elige la rama leyendo las descripciones","Se ejecutan todas las ramas y gana la primera"],1,"El diccionario de rutas recibe la ruta emitida."],["¿Qué pasa con SequentialAgent en ADK 2.0 para Python?",["Está en desuso: funciona con aviso y se eliminará","Se eliminó y ya no funciona","Es la API recomendada para flujos nuevos","Fue reemplazado por AgentTool"],0,"En proyectos nuevos se usa Workflow."]]},{id:"3.4",hours:3,title:"Memoria y contexto",sub:"Estado de sesión, sesiones persistentes y memoria de largo plazo con Memory Bank.",objectives:["Diferenciar estado, sesión y memoria de largo plazo.","Usar el estado de sesión para pasar datos entre pasos y personalizar instrucciones.","Decidir cuándo usar Agent Platform Sessions y Memory Bank, y qué riesgos de privacidad implican."],blocks:[{h:'Tres niveles de "recordar"',html:'<table class="tbl"><tr><th>Nivel</th><th>Qué guarda</th><th>Dura</th><th>En ADK</th></tr><tr><td><b>Estado</b> (state)</td><td>Datos clave de la conversación actual: código del empleado, idioma, paso del proceso</td><td>La sesión</td><td><code>session.state</code>; plantillas <code>{clave}</code> en instrucciones; <code>output_key</code></td></tr><tr><td><b>Sesión</b></td><td>El historial de eventos de una conversación</td><td>Lo que dure el servicio de sesión elegido</td><td><code>InMemorySessionService</code> (pruebas), base de datos o Agent Platform Sessions</td></tr><tr><td><b>Memoria de largo plazo</b></td><td>Hechos útiles extraídos de conversaciones anteriores</td><td>Entre sesiones</td><td>Memory Bank con <code>VertexAiMemoryBankService</code>; herramientas <code>PreloadMemoryTool</code> o <code>load_memory</code></td></tr></table>'},{h:"Estado en la práctica",html:'<p>Una herramienta puede guardar datos en el estado (por ejemplo el código del empleado validado) y las instrucciones pueden leerlo con plantillas: <code>"El empleado actual es {codigo_empleado}."</code>. Un agente también puede guardar su respuesta en el estado con <code>output_key</code> para que el siguiente paso la use. Así se evita repetir preguntas y se reducen tokens.</p><pre>from google.adk.agents import Agent\nfrom google.adk.tools.tool_context import ToolContext\n\ndef registrar_empleado(codigo_empleado: str, tool_context: ToolContext) -> dict:\n    """Valida el código del empleado y lo guarda para el resto de la conversación."""\n    c = codigo_empleado.strip().upper()\n    if not (len(c) == 6 and c.startswith("E-") and c[2:].isdigit()):\n        return {"status": "error", "mensaje": "Formato esperado: E-0000"}\n    tool_context.state["codigo_empleado"] = c\n    return {"status": "ok"}\n\nroot_agent = Agent(\n    name="asistente_estado", model="gemini-3.8-flash",\n    instruction=("Eres el asistente de RR. HH. de Nordia. "\n                 "Empleado actual: {codigo_empleado?}. Si está vacío, pide el código "\n                 "y regístralo con registrar_empleado."),\n    tools=[registrar_empleado],\n)</pre><p>El parámetro <code>tool_context</code> lo entrega ADK automáticamente (el modelo no lo ve) y da acceso al estado. La forma <code>{codigo_empleado?}</code> evita un error si la clave todavía no existe. Puedes probarlo en <code>adk web</code> como ejercicio corto.</p>'},{h:"Memory Bank",html:'<p>Memory Bank es el servicio administrado de Agent Platform que extrae y guarda recuerdos de largo plazo de las conversaciones y los recupera cuando son relevantes. Con <code>PreloadMemoryTool</code> los recuerdos se cargan al inicio de cada turno; con <code>load_memory</code> el modelo decide cuándo consultarlos. Ojo: esas herramientas solo <b>leen</b>; los recuerdos hay que <b>generarlos</b>, normalmente al final de cada conversación con un callback (función que ADK ejecuta cuando el agente termina) que envía los eventos de la sesión a Memory Bank. Requiere una instancia de Memory Bank, que puede ser independiente o estar dentro de Agent Runtime.</p><div class="tip">⚠ <b>Privacidad:</b> recordar es tratar datos personales. Define qué se puede recordar, por cuánto tiempo, cómo se borra a petición del usuario y quién puede consultarlo. En Colombia aplica la Ley 1581 de 2012 de protección de datos; en otros países, su norma equivalente.</div>'},{h:"Contexto: más no siempre es mejor",html:'<ul><li>Cada evento de la sesión puede viajar al modelo: conversaciones largas cuestan más y pueden distraerlo.</li><li>Guarda en el estado los datos estructurados en vez de depender de que el modelo los "recuerde" del historial.</li><li>Para documentos, usa recuperación (Módulo 2) en lugar de pegarlos en la conversación.</li></ul>'}],interactive:"classify",cases:{title:"¿Estado, sesión o memoria de largo plazo?",labels:["Estado de sesión","Historial de sesión","Memoria de largo plazo"],items:[["El código del empleado que ya se validó en esta conversación.",0,"Dato clave de la conversación actual: estado."],["Que el usuario prefiere recibir respuestas en inglés, recordado la próxima semana.",2,"Preferencia útil entre conversaciones: memoria de largo plazo."],["Los mensajes intercambiados hace cinco minutos en el mismo chat.",1,"Es el historial de eventos de la sesión."],["En qué paso del flujo de aprobación va la solicitud actual.",0,"Dato de control del proceso actual: estado."],["Que el empleado ya pidió el mes pasado un portátil de reemplazo.",2,"Hecho de una conversación anterior: memoria de largo plazo, con reglas de privacidad."]]},glossary:[["State (estado)","Diccionario de datos clave asociado a una sesión."],["output_key","Parámetro de un agente que guarda su respuesta en el estado con esa clave."],["Memory Bank","Servicio administrado de memoria de largo plazo de Agent Platform."],["Session service","Componente que guarda las sesiones: en memoria, en base de datos o administrado."]],quiz:[["¿Qué servicio de sesión es solo para pruebas locales?",["Agent Platform Sessions","Memory Bank","DatabaseSessionService","InMemorySessionService"],3,"Se pierde al reiniciar el proceso."],["¿Cómo lee una instrucción un valor del estado?",["Con plantillas como {codigo_empleado}","Llamando a una herramienta en cada turno","Con una consulta SQL a la sesión","Guardándolo en Memory Bank"],0,"ADK reemplaza la plantilla por el valor del estado."],["¿Qué diferencia a PreloadMemoryTool de load_memory?",["Ninguna","Preload carga recuerdos al inicio de cada turno; load_memory deja que el modelo decida cuándo consultarlos","load_memory borra la memoria","Preload solo funciona en Java"],1,"Son dos estrategias de recuperación."],["¿Qué debe definirse antes de activar memoria de largo plazo?",["Qué modelo de embeddings usar","El número máximo de sesiones por usuario","Qué se recuerda, cuánto tiempo, cómo se borra y quién accede","El idioma de la interfaz"],2,"Recordar implica tratar datos personales."]]},{id:"3.5",hours:4,title:"Rendimiento, escalabilidad y costo",sub:"Latencia, tokens, elección de modelo, ramas paralelas, streaming y reintentos.",objectives:["Medir latencia y tokens de un agente de forma programática con Runner.","Aplicar optimizaciones: modelo adecuado, menos contexto, paralelismo y streaming.","Configurar reintentos con espera exponencial ante errores 429 (límite de solicitudes)."],blocks:[{h:"Dónde se va el tiempo",html:'<ul><li><b>Llamadas al modelo:</b> cada paso de razonamiento y cada llamada a herramienta suma un viaje al modelo.</li><li><b>Herramientas lentas:</b> una API externa de 3 segundos se nota en cada consulta.</li><li><b>Contexto grande:</b> más tokens de entrada, más tiempo y más costo.</li><li><b>Pasos en serie que podrían ir en paralelo.</b></li></ul><div class="tip">💡 Regla: mide primero, optimiza después. Sin una medición base no sabrás si una mejora funcionó.</div>'},{h:"Palancas de optimización",html:'<table class="tbl"><tr><th>Palanca</th><th>Efecto</th></tr><tr><td><b>Modelo más ligero</b> para tareas simples (por ejemplo, una variante Flash-Lite, la versión más rápida y económica de la familia)</td><td>Menor latencia y costo; validar que la calidad se mantiene</td></tr><tr><td><b>Instrucciones y contexto más cortos</b></td><td>Menos tokens de entrada en cada llamada</td></tr><tr><td><b>Ramas paralelas</b> en el flujo</td><td>El tiempo total se acerca al del paso más lento, no a la suma</td></tr><tr><td><b>Streaming</b> (respuesta en tiempo real)</td><td>No reduce el tiempo total, pero el usuario ve la respuesta antes</td></tr><tr><td><b>Caché de contexto</b></td><td>Reutiliza contenido largo y repetido (por ejemplo, un manual) con menor costo de entrada; revisar condiciones y precios vigentes</td></tr><tr><td><b>Reglas en código</b> en vez de pedirle al modelo que decida</td><td>Pasos deterministas, más rápidos y sin costo de tokens</td></tr></table>'},{h:"Cuotas, error 429 y reintentos",html:'<p>El error <b>429</b> indica que se superó la cantidad de solicitudes que el servicio puede atender en ese momento. La respuesta profesional es reintentar con <b>espera exponencial</b> (cada intento espera más que el anterior) y un límite de intentos. En ADK se configura en el modelo:</p><pre>from google.genai import types\nfrom google.adk.agents import Agent\nfrom google.adk.models.google_llm import Gemini\n\nroot_agent = Agent(\n    name="asistente_rrhh",\n    model=Gemini(model="gemini-3.8-flash",\n                 retry_options=types.HttpRetryOptions(initial_delay=1, attempts=3)),\n    instruction="...",\n)</pre><p>Para cargas grandes, además: revisar las cuotas del proyecto, distribuir el tráfico en el tiempo y, si aplica, contratar capacidad garantizada (Provisioned Throughput: capacidad reservada con pago fijo).</p>'}],interactive:"latency",lab:{title:"Medir y optimizar el asistente de Nordia",time:"90 min",cost:"Bajo: unas 30 consultas al modelo.",steps:[["Preparar variables","Fuera de <code>adk web</code>, las variables del <code>.env</code> no se cargan solas. En Cloud Shell:<pre>source ~/lab3/bin/activate && cd ~/nordia\nset -a; source asistente/.env; set +a</pre>"],["Script de medición",'Crea <code>~/nordia/medir.py</code>:<pre>import asyncio, time\nfrom google.adk.runners import Runner\nfrom google.adk.sessions import InMemorySessionService\nfrom google.genai import types\nfrom asistente.agent import root_agent\n\nPREGUNTAS = [\n    "Soy E-1042, ¿cuántos días de vacaciones tengo?",\n    "¿Qué necesito para pedir vacaciones?",\n    "Soy E-2077, ¿y mi saldo?",\n    "Gracias, eso es todo.",\n]\n\nasync def main():\n    svc = InMemorySessionService()\n    runner = Runner(agent=root_agent, app_name="asistente", session_service=svc)\n    s = await svc.create_session(app_name="asistente", user_id="u1")\n    for q in PREGUNTAS:\n        t0, tokens, final = time.perf_counter(), 0, ""\n        msg = types.Content(role="user", parts=[types.Part(text=q)])\n        async for ev in runner.run_async(user_id="u1", session_id=s.id, new_message=msg):\n            if ev.usage_metadata and ev.usage_metadata.total_token_count:\n                tokens += ev.usage_metadata.total_token_count\n            if ev.is_final_response() and ev.content and ev.content.parts:\n                final = ev.content.parts[0].text or ""\n        print(f"{time.perf_counter() - t0:5.2f} s | {tokens:6d} tokens | {final[:60]}")\n\nasyncio.run(main())</pre>El script usa <code>async</code>/<code>await</code> (programación asíncrona: espera respuestas sin bloquear el programa) y <code>asyncio.run</code> para ejecutarlo. Ejecuta <code>python medir.py</code> tres veces y anota el promedio de segundos y tokens por pregunta: esa es tu <b>línea base</b>.'],["Optimizar la instrucción","Acorta la instrucción del agente sin perder reglas (por ejemplo, elimina frases repetidas) y vuelve a medir. ¿Bajaron los tokens?"],["Probar otro modelo","Cambia el modelo por una variante más ligera disponible en Model Garden (por ejemplo, Flash-Lite) y mide. Compara calidad de respuesta, latencia y tokens. Decide cuál usarías y por qué."],["Agregar reintentos","Modifica <code>asistente/agent.py</code> para usar <code>Gemini(..., retry_options=types.HttpRetryOptions(initial_delay=1, attempts=3))</code> como en la lección y verifica que todo siga funcionando."],["Informe","Arma una tabla: configuración, segundos promedio, tokens promedio, costo estimado por 10.000 consultas (con precios oficiales del día) y calidad (1 a 5). Recomienda una configuración para Nordia."]],check:"Entregar medir.py, la tabla de resultados con al menos 3 configuraciones, el agent.py final con reintentos y la recomendación justificada.",cleanup:"No quedan recursos en la nube. Ejecuta deactivate al terminar."},glossary:[["Latencia","Tiempo que tarda el agente en responder."],["Runner","Componente de ADK que ejecuta un agente y produce sus eventos."],["Espera exponencial (backoff)","Estrategia de reintentos en la que cada espera es mayor que la anterior."],["Streaming","Envío de la respuesta por partes a medida que se genera."]],quiz:[["¿Qué logra el streaming?",["Reduce el costo a la mitad","Que el usuario vea la respuesta antes, aunque el tiempo total sea similar","Elimina el error 429","Reduce los tokens de entrada"],1,"Mejora la percepción de velocidad."],["¿Qué indica el error 429?",["Que el modelo no existe","Que se superó la cantidad de solicitudes que el servicio atiende en ese momento","Que falta el archivo .env","Que la respuesta es demasiado larga"],1,"Se maneja con reintentos y espera exponencial."],["Dos pasos independientes tardan 3 s y 4 s. En paralelo, el tiempo aproximado es…",["7 s","1 s","4 s","12 s"],2,"El tiempo se acerca al del paso más lento."],["¿Qué debes tener antes de optimizar?",["Un modelo más grande","Una medición base","Más herramientas","Un nuevo proyecto"],1,"Sin línea base no se puede comprobar la mejora."]]}],exam:[["¿Qué archivo de un proyecto ADK define root_agent?",["__init__.py",".env","requirements.txt","agent.py"],3],["¿Desde dónde se ejecuta adk web?",["Desde la carpeta padre que contiene la carpeta del agente","Desde dentro de la carpeta del agente","Desde la consola de Google Cloud","Desde BigQuery"],0],["El modelo llama a consultar_vacaciones con el parámetro equivocado una y otra vez. ¿Qué revisas primero?",["La región del proyecto","El docstring y los tipos de los parámetros de la función","El tamaño del bucket","La versión de Cloud Shell"],1],["¿Qué componente de ADK conecta un agente a un servidor MCP?",["OpenAPIToolset","Runner","McpToolset","JoinNode"],2],["Un servidor MCP tiene una herramienta peligrosa que el agente no debe usar. ¿Qué haces?",["Prohibirla solo en la instrucción del agente","Excluirla con tool_filter y no exponerla","Cambiar el modelo por uno más grande","Usar ParallelAgent"],1],["¿Qué tipo de herramienta reutiliza una API REST ya documentada?",["OpenAPIToolset","PreloadMemoryTool","JoinNode","InMemorySessionService"],0],["Necesitas que dos agentes revisen una solicitud al mismo tiempo y luego combinar sus resultados. ¿Qué usas en Workflow?",["Una tupla simple (START, a, b)","Una tupla anidada para las ramas y un JoinNode para unirlas","Un diccionario de rutas","Dos Workflows independientes"],1],["¿Qué emite un nodo para elegir una rama?",["Un valor en el estado sin ruta",'Event(route="…")',"Un archivo .env","Una excepción"],1],["Heredas un proyecto de 2025 con SequentialAgent y LoopAgent que ahora muestra avisos. ¿Qué recomiendas?",["Ignorar los avisos para siempre","Planear la migración a Workflow, porque esas clases están en desuso","Volver a ADK 0.x","Reemplazarlas por Memory Bank"],1],["¿Para qué sirve A2A?",["Para crear buckets","Para que agentes de distintos sistemas colaboren por la red","Para medir latencia","Para cifrar sesiones"],1],["El código del empleado ya validado en la conversación debe guardarse en…",["La memoria de largo plazo","El estado de la sesión","Un bucket público","La instrucción fija"],1],["¿Qué servicio guarda recuerdos entre sesiones?",["Memory Bank","Cloud Shell","Model Garden","Agent Search"],0],["Ante errores 429 frecuentes, la primera medida técnica es…",["Reintentos con espera exponencial","Reintentar de inmediato en un ciclo sin límite","Cambiar a un modelo más grande","Aumentar max_output_tokens"],0],["¿Qué componente permite ejecutar un agente desde un script y leer sus eventos?",["Runner","McpToolset","output_key","JoinNode"],0],["¿Qué optimización no reduce el tiempo total pero mejora la percepción de velocidad?",["Paralelismo","Streaming","Modelo más ligero","Menos contexto"],1]],rubric:"Rúbrica del reto: diseño del flujo y separación entre reglas y modelo (30 %), herramientas y mínimo privilegio (25 %), manejo de estado y memoria con criterios de privacidad (20 %), medición y optimización con datos (25 %).",challenge:'Reto del módulo: implementa con ADK el "asistente de RR. HH. de Nordia v1": un Workflow que identifique la intención (consulta de saldo, solicitud de vacaciones o ticket de TI), aplique reglas de negocio en código, use el servidor MCP para datos y tickets, guarde en el estado el código del empleado y reporte latencia y tokens de 10 casos de prueba.'}};
